<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康宣教统计 - 业务统计</title>
<link rel="stylesheet" href="框架.css">
<style>
  html.embed-mode .main-area{height:100%}
  html.embed-mode .tabbar{display:none}
  html.embed-mode .toast{top:24px}

  .content .content-card{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}

  .page-head .right .btn{height:30px;padding:0 14px;font-size:13px}

  .stat-tab{height:30px;padding:0 16px;border-radius:15px;border:1px solid #DDE3EA;background:#fff;color:var(--text-secondary);font-size:13px;cursor:pointer;transition:all var(--transition-fast);display:inline-flex;align-items:center}
  .stat-tab:hover{border-color:var(--primary);color:var(--primary)}
  .stat-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

  /* ===== 筛选区 ===== */
  .filter-panel{padding:14px 16px 0;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin-bottom:14px}
  .filter-item{display:flex;align-items:center;gap:4px}
  .filter-item label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
  .fi-ctl{width:150px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-select{width:150px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fi-ctl:focus,.fi-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  .fi-select.is-placeholder{color:var(--text-placeholder)}
  .fi-date{width:118px}
  .fi-range{display:flex;align-items:center;gap:4px;color:var(--text-tertiary)}
  .filter-btns{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}
  .list-tbl th:last-child,.list-tbl td:last-child{position:sticky;right:0}
  .list-tbl td:last-child{z-index:2;background-color:var(--bg-white)}
  .list-tbl th:last-child{z-index:6}
  .list-tbl{width:100%;min-width:1200px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:36px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:36px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:nth-child(even) td{background:var(--bg-table-even)}
  .list-tbl tbody tr:hover td{background:var(--primary-bg)}
  .table-wrap.hs-scrolled .list-tbl thead th:last-child,
  .table-wrap.hs-scrolled .list-tbl tbody tr td:last-child{
    background-image:linear-gradient(to right,rgba(0,0,0,0.10),rgba(0,0,0,0));

  .list-tbl .center{text-align:center}
  .list-tbl .num{font-family:Consolas,'Microsoft YaHei',monospace;text-align:right}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .op-link{color:var(--primary);cursor:pointer;font-size:13px}
  .op-link:hover{text-decoration:underline}
  .op-gap{display:inline-block;width:8px}
  .dash{color:var(--text-placeholder)}

  .empty-box{display:inline-flex;flex-direction:column;align-items:center;gap:10px}
  .empty-box svg{width:56px;height:56px;stroke:#C9CFD8;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .empty-box p{font-size:13px;color:var(--text-placeholder)}

  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}

  .pg-btn.disabled{color:var(--text-disabled);cursor:not-allowed;border-color:#EBEBEB}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
</style>
</head>

  /* ================= TAB 配置 ================= */
  var TABS = {

        ] },

  /* ================= 渲染 ================= */
  var curTab = 'org';
  var curRows = [];

  function renderTabs() {
    $('statTabs').innerHTML = Object.keys(TABS).map(function (k) {
      var t = TABS[k];
      return '<span class="stat-tab' + (k === curTab ? ' active' : '') + '" onclick="switchTab(\'' + k + '\')">' + esc(t.label) + '</span>';
    }).join('');
  }

  function filterItemHtml(f, idx) {
    var ph = f.ph || '';
    var label = f.noLabel ? '' : f.label + '：';
    if (f.type === 'select') {
      return '<div class="filter-item"><label>' + label + '</label><select class="fi-select is-placeholder" data-f="' + idx + '" onchange="markSelect(this);filterRows()">' + opts(f.opts) + '</select></div>';
    }
    if (f.type === 'daterange') {
      return '<div class="filter-item"><label>' + f.label + '：</label><span class="fi-range"><input class="fi-ctl fi-date" value="2026-01-01" data-f="' + idx + '" oninput="filterRows()">~<input class="fi-ctl fi-date" value="2026-12-31" data-half="end" data-f="' + idx + '" oninput="filterRows()"></span></div>';
    }
    return '<div class="filter-item"><label>' + label + '</label><input class="fi-ctl" placeholder="' + ph + '" data-f="' + idx + '" oninput="filterRows()"></div>';
  }

  function renderFilter() {
    var t = TABS[curTab];
    var html = '';
    var fidx = 0;
    t.filters.forEach(function (rowDef, ri) {
      html += '<div class="filter-row">';
      rowDef.items.forEach(function (f) {
        html += filterItemHtml(f, fidx);
        fidx++;
      });
      if (ri === t.filters.length - 1) {
        html += '<div class="filter-btns">'
          + '<button class="btn btn-default" onclick="resetFilter()">重置</button>'
          + '<button class="btn btn-primary" onclick="queryFilter()">查询</button></div>';
      }
      html += '</div>';
    });
    $('filterPanel').innerHTML = html;
  }

  function renderTable() {
    var t = TABS[curTab];
    var cols = t.cols;
    var colgroup = cols.map(function (c) { return '<col style="width:' + c.w + 'px">'; }).join('');
    var thead = '<tr>' + cols.map(function (c) {
      return '<th class="' + (c.c ? 'center' : '') + '">' + esc(c.label) + '</th>';
    }).join('') + '</tr>';

    if (!curRows.length) {
      $('colgroup').innerHTML = colgroup;
      $('thead').innerHTML = thead;
      $('tbody').innerHTML = '<tr><td class="empty-td" colspan="' + cols.length + '"><div class="empty-box">'
        + '<svg viewBox="0 0 24 24"><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M3 8h18l-2.5-4h-13z"/><line x1="10" y1="12" x2="14" y2="12"/></svg>'
        + '<p>暂无数据</p></div></td></tr>';
      $('total').textContent = 0;
      return;
    }

    var body = curRows.map(function (r, i) {
      return '<tr>' + cols.map(function (c) {
        var v = c.t ? c.t(r, i) : (c.render ? c.render(r) : '-');
        var cls = c.c ? 'center' : (c.num ? 'num' : '');
        return '<td class="' + cls + '">' + v + '</td>';
      }).join('') + '</tr>';
    }).join('');

    $('colgroup').innerHTML = colgroup;
    $('thead').innerHTML = thead;
    $('tbody').innerHTML = body;
    $('total').textContent = curRows.length;
  }

  function filterRows() {
    var t = TABS[curTab];
    var fields = $('filterPanel').querySelectorAll('[data-f]');
    var arr = [];
    fields.forEach(function (el) { arr.push(el.value ? el.value.trim().toLowerCase() : ''); });
    var rowDefs = [];
    t.filters.forEach(function (rd) { rd.items.forEach(function (f) { rowDefs.push(f); }); });
    curRows = t.rows.filter(function (r) {
      return rowDefs.every(function (f, i) {
        var v = arr[i];
        if (!v) return true;
        var k = f.key;
        if (k === 'date') return true;
        if (k === 'pop2') return true;
        var rv = r[k];
        if (rv === undefined || rv === null) return true;
        if (f.type === 'select') return String(rv) === v;
        return String(rv).toLowerCase().indexOf(v) !== -1;
      });
    });
    renderTable();
  }

  function resetFilter() {
    $('filterPanel').querySelectorAll('[data-f]').forEach(function (el) {
      if (el.tagName === 'SELECT') { el.value = ''; markSelect(el); }
      else if (el.classList.contains('fi-date')) el.value = (el.getAttribute('data-half') === 'end') ? '2026-12-31' : '2026-01-01';
      else el.value = '';
    });
    filterRows();
    toast('已重置', 'info');
  }

  function queryFilter() {
    filterRows();
    toast('查询完成，共 ' + $('total').textContent + ' 条记录', 'success');
  }

  function switchTab(k) {
    curTab = k;
    curRows = TABS[k].rows.slice();
    renderTabs();
    renderFilter();
    renderTable();
    var wrap = $('tableWrap');
    if (wrap.scrollLeft) { wrap.scrollLeft = 0; updShadow(); }
  }

  /* ================= 操作列冻结阴影 ================= */
  function updShadow() {
    var wrap = $('tableWrap');
    wrap.classList.toggle('hs-scrolled', wrap.scrollLeft > 0);
  }

  /* ================= 初始化 ================= */
  switchTab('org');
  (function () {
    var wrap = $('tableWrap');
    wrap.addEventListener('scroll', updShadow, { passive: true });
    window.addEventListener('resize', updShadow);
    updShadow();
  })();

  /* 便于评审 / 截图：?tab=org|tpl|detail */
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('tab');
    if (t && TABS[t]) switchTab(t);
  })();
</script>
