<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妇女管理 - 妇幼管理</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 妇女管理页面特有样式（设计变量与公共样式见 框架.css） ===== */

  /* ===== 嵌入模式（被 index.html 壳子以 iframe 内嵌时，框架.js 自动加 html.embed-mode） ===== */
  html.embed-mode .main-area{height:100%}      /* 壳子内自适应：无顶部导航栏包裹 */
  html.embed-mode .tabbar{display:none}        /* 标签栏由壳子统一管理，本页隐藏 */
  html.embed-mode .toast{top:24px}             /* 壳内提示位置上移 */

  /* ===== 布局：content 改为 flex，content-card 撑满并让表格区内部滚动 ===== */
  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-height:0;min-width:0}

  /* ===== 页头按钮 ===== */
  .page-head .right .btn{height:28px;padding:0 14px;font-size:13px}

  /* ===== 筛选区 ===== */
  .filter-panel{padding:14px 12px 0;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-row{display:flex;flex-wrap:wrap;gap:12px 16px;margin-bottom:14px;align-items:center}
  .filter-row.extra{display:none}
  .filter-row.extra.show{display:flex}
  .filter-item{display:flex;align-items:center;gap:8px}
  .filter-item label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
  .fi-ctl{width:180px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-select{width:140px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fi-select.w-lg{width:210px}
  .fi-ctl:focus,.fi-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  .filter-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn-plain{height:28px;padding:0 8px;font-size:13px;color:var(--primary);border-radius:var(--r-sm)}
  .btn-plain:hover{background:var(--primary-bg)}
  /* 筛选区扩展控件：日期区间 / 比较符 / 数值 / 单选复选组 */
  .fi-date{width:138px}
  .fi-sep{color:var(--text-placeholder);font-size:13px}
  .fi-cmp{width:78px}
  .fi-num{width:80px}
  .fi-unit{font-size:13px;color:var(--text-secondary)}
  .fi-opts{display:flex;align-items:center;gap:12px}
  .fi-radio{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--text-secondary);cursor:pointer}
  .fi-radio input{margin:0;accent-color:var(--primary);cursor:pointer}
  .fi-check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);cursor:pointer}
  .fi-check input{margin:0;accent-color:var(--primary);cursor:pointer}
  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}

  /* 横向滚动时前 4 列冻结（序号/管理机构/姓名/证件号） */
  .list-tbl th:nth-child(-n+4),.list-tbl td:nth-child(-n+4){position:sticky}
  .list-tbl td:nth-child(-n+4){z-index:2;background:var(--bg-white)}
  .list-tbl th:nth-child(-n+4){z-index:6}
  .list-tbl th:nth-child(1),.list-tbl td:nth-child(1){left:0}
  .list-tbl th:nth-child(2),.list-tbl td:nth-child(2){left:44px}
  .list-tbl th:nth-child(3),.list-tbl td:nth-child(3){left:194px}
  .list-tbl th:nth-child(4),.list-tbl td:nth-child(4){left:270px}
  .list-tbl th:nth-child(4),.list-tbl td:nth-child(4){box-shadow:6px 0 8px -6px rgba(0,0,0,0.2)}
  /* 横向滚动时操作列（末列）冻结在右侧 */
  .list-tbl th:last-child,.list-tbl td:last-child{position:sticky;right:0}
  .list-tbl td:last-child{z-index:2;background:var(--bg-white)}
  .list-tbl th:last-child{z-index:6}
  .list-tbl th:last-child,.list-tbl td:last-child{box-shadow:-6px 0 8px -6px rgba(0,0,0,0.2)}
  .list-tbl tr.empty-row td:last-child{position:static;box-shadow:none}
  /* 操作列允许溢出，保证「更多」下拉菜单可正常展开 */
  .list-tbl tbody tr:not(.empty-row) td:last-child{overflow:visible}
  .list-tbl{width:100%;min-width:1820px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:36px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:36px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:nth-child(even) td{background:var(--bg-table-even)}
  .list-tbl tbody tr:nth-child(even) td:nth-child(-n+4){background:var(--bg-table-even)}
  .list-tbl tbody tr:hover td,.list-tbl tbody tr:hover td:nth-child(-n+4){background:var(--primary-bg)}
  .list-tbl th.center,.list-tbl td.center{text-align:center}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 重点人群类型标签 */
  .crowd-tags{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center}
  .crowd-tag{display:inline-flex;align-items:center;justify-content:center;height:18px;padding:0 5px;border-radius:3px;font-size:11px;line-height:1;color:#fff}
  .crowd-tag.yun{background:#E53935}
  .crowd-tag.can{background:#FB8C00}
  .crowd-tag.di{background:#FDD835;color:#333}
  .crowd-tag.te{background:#43A047}
  .crowd-tag.jing{background:#1E88E5}
  .crowd-tag.jie{background:#8E24AA}
  .crowd-tag.lao{background:#757575}

  /* 个人档案情况 */
  .full-ok{color:var(--success);font-weight:var(--font-weight-medium)}
  .full-mid{color:var(--warning)}
  .full-low{color:var(--danger)}

  /* 状态圆点（个人档案情况/管辖行政区/锁定状态） */
  .st-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .st-dot.ok{background:var(--success)}
  .st-dot.warn{background:#FF9500}
  .st-dot.info{background:var(--info)}

  /* 操作列 */
  .op-link{color:var(--primary);cursor:pointer;font-size:13px}
  .op-link:hover{text-decoration:underline}
  .op-gap{display:inline-block;width:8px}
  .op-more{position:relative;display:inline-flex;align-items:center}
  .op-more .more-btn{display:inline-flex;align-items:center;gap:2px;color:var(--primary);cursor:pointer;font-size:13px}
  .op-more .more-btn:hover{text-decoration:underline}
  .op-more .more-btn svg{transition:transform var(--transition-fast)}
  .op-more.open .more-btn svg{transform:rotate(180deg)}
  .op-menu{position:absolute;top:calc(100% + 6px);right:-8px;min-width:110px;background:var(--bg-white);border:1px solid var(--color-neutral-200);border-radius:var(--r-sm);box-shadow:var(--shadow-md);padding:4px 0;display:none;z-index:30}
  .op-more.open .op-menu{display:block}
  .op-menu .mi{display:block;width:100%;text-align:left;padding:7px 14px;font-size:13px;color:var(--text-secondary);line-height:1.4}
  .op-menu .mi:hover{background:var(--primary-bg);color:var(--primary)}

  /* ===== 分页 ===== */
  .page-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;height:52px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .pg-size select{height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 22px 0 8px;font-size:13px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer}
  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}
  .pg-btn:hover{border-color:var(--primary);color:var(--primary)}
  .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .pg-ellipsis{display:inline-block;padding:0 4px;line-height:26px;color:var(--text-tertiary)}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
  .pg-jump input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}

  /* ===== 新建妇女档案弹框 ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--transition-normal)}
  .modal-overlay.show{opacity:1;pointer-events:auto}
  .modal{width:860px;max-width:92vw;background:var(--bg-white);border-radius:var(--r-md);box-shadow:0 8px 32px rgba(0,0,0,0.18);display:flex;flex-direction:column;overflow:hidden;transform:translateY(10px);transition:transform var(--transition-normal)}
  .modal-overlay.show .modal{transform:translateY(0)}
  .modal-head{height:48px;display:flex;align-items:center;padding:0 16px;flex-shrink:0}
  .modal-head h3{font-size:15px;font-weight:var(--font-weight-semibold);color:var(--primary)}
  .modal-close{margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);border-radius:var(--r-sm);font-size:16px}
  .modal-close:hover{background:var(--primary-bg);color:var(--primary)}
  .modal-body{padding:16px 16px 4px}
  .modal-cols{display:flex;gap:16px;align-items:flex-start}
  .modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:18px 20px 20px}

  /* 左侧表单 */
  .fm-form{width:316px;flex-shrink:0}
  .fm-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .fm-row label{width:88px;text-align:right;font-size:14px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .fm-row label i{color:var(--danger);font-style:normal;margin-right:2px}
  .fm-ctl-wrap{position:relative}
  .fm-ctl{width:220px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fm-ctl.has-cnt{padding-right:40px}
  .fm-select{width:220px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fm-ctl:focus,.fm-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fm-ctl::placeholder{color:var(--text-placeholder)}
  .cnt{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-placeholder);pointer-events:none}
  .fm-readcard{height:32px;padding:0 10px;border:1px solid var(--primary);color:var(--primary);background:var(--bg-white);border-radius:var(--r-sm);font-size:13px;white-space:nowrap;flex-shrink:0;transition:all var(--transition-fast)}
  .fm-readcard:hover{background:var(--primary-bg)}

  /* 右侧：证件号行 + 信息回显卡 */
  .pv-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .pv-side .fm-row{margin-bottom:0}
  .pv-side .fm-ctl-wrap{flex:1;min-width:0}
  .pv-side .fm-ctl{width:100%}
  .pv-card{flex:1;min-width:0;background:var(--primary-bg);border:1px dashed #9EC3F5;border-radius:var(--r-md);padding:22px 18px;display:grid;grid-template-columns:1fr 1fr;row-gap:24px;column-gap:12px;font-size:13px;min-height:210px;align-content:start}
  .pv-row{display:flex;min-width:0}
  .pv-row.wide{grid-column:1 / -1}
  .pv-label{color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .pv-val{color:var(--primary);word-break:break-all}

  /* ===== 档案选择弹框（新建妇女档案第一步：选择居民档案） ===== */
  .modal.select-modal .modal{width:980px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
  .modal.select-modal .modal-body{padding:12px 0 0;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  .select-filter{padding:0 16px 10px;border-bottom:1px solid #E8E8E8;flex-shrink:0}
  .select-filter .filter-row{margin-bottom:10px}
  .select-filter .fi-ctl{width:150px;height:30px;font-size:13px}
  .select-filter .fi-select{width:130px;height:30px;font-size:13px}
  .select-filter .fi-select.w-lg{width:170px}
  .select-filter .btn{height:28px;padding:0 12px;font-size:13px}
  .select-filter .btn-plain{height:28px;padding:0 6px;font-size:13px;color:var(--primary);background:none;border:none;cursor:pointer}
  .select-filter .btn-plain:hover{text-decoration:underline}
  .select-table-wrap{flex:1;overflow:auto;min-height:0;min-width:0}
  .select-tbl{width:100%;min-width:1268px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .select-tbl th{position:sticky;top:0;z-index:5;height:34px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .select-tbl td{height:34px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 横向滚动时前 3 列（序号/档案编号/姓名）冻结在左侧 */
  .select-tbl th:nth-child(-n+3),.select-tbl td:nth-child(-n+3){position:sticky}
  .select-tbl td:nth-child(-n+3){z-index:2;background:var(--bg-white)}
  .select-tbl th:nth-child(-n+3){z-index:6}
  .select-tbl th:nth-child(1),.select-tbl td:nth-child(1){left:0}
  .select-tbl th:nth-child(2),.select-tbl td:nth-child(2){left:50px}
  .select-tbl th:nth-child(3),.select-tbl td:nth-child(3){left:210px}
  .select-tbl th:nth-child(3),.select-tbl td:nth-child(3){box-shadow:6px 0 8px -6px rgba(0,0,0,0.2)}
  /* 操作列（末列）冻结在右侧 */
  .select-tbl th:last-child,.select-tbl td:last-child{position:sticky;right:0}
  .select-tbl td:last-child{z-index:2;background:var(--bg-white)}
  .select-tbl th:last-child{z-index:6}
  .select-tbl th:last-child,.select-tbl td:last-child{box-shadow:-6px 0 8px -6px rgba(0,0,0,0.2)}
  .select-tbl tr.empty-row td:last-child{position:static;box-shadow:none}
  .select-tbl tbody tr:hover td{background:var(--primary-bg)}
  .select-tbl th.center,.select-tbl td.center{text-align:center}
  .select-tbl .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .select-tbl .op-create{color:var(--primary);cursor:pointer;font-size:13px}
  .select-tbl .op-create:hover{text-decoration:underline}
  .select-tbl .op-enter{color:var(--primary);cursor:pointer;font-size:13px}
  .select-tbl .op-enter:hover{text-decoration:underline}
  .select-tbl .op-none{color:var(--text-tertiary);font-size:13px}
  .select-tbl .crowd-tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .select-pagefoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:44px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .select-pagefoot .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .select-pagefoot .pg-size select{height:24px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 20px 0 6px;font-size:12px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 5px center;cursor:pointer}
  .select-pagefoot .pg-pager{display:flex;align-items:center;gap:3px}
  .select-pagefoot .pg-btn{min-width:24px;height:24px;padding:0 5px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:12px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
  .select-pagefoot .pg-btn:hover{border-color:var(--primary);color:var(--primary)}
  .select-pagefoot .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .select-pagefoot .pg-ellipsis{display:inline-block;padding:0 3px;line-height:24px;color:var(--text-tertiary)}
  .select-pagefoot .pg-jump input{width:36px;height:24px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 5px;font-size:12px;text-align:center;color:var(--text-primary);outline:none}
  .select-pagefoot .pg-jump input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}

</style>
</head>
<body>

<!-- ===== 主内容区（顶部导航栏与左侧菜单栏由 框架.js 注入） ===== -->
<div class="main-area">

  <!-- 页面标签条（嵌入模式下隐藏，由壳子统一管理） -->
  <div class="tabbar">
    <div class="tab-item dashboard active" onclick="toast('当前已在「妇女管理」页','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      妇女管理
    </div>
    <div class="tab-item" onclick="toast('「产前随访」功能建设中','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      随访管理
      <span class="tab-close" onclick="event.stopPropagation();toast('关闭标签','info')">×</span>
    </div>
    <div class="tab-item" onclick="toast('「产后访视」功能建设中','info')">

      if (region && r.region !== region) return false;

  /* ================= 分页器 ================= */
  function renderPager(total) {
    var nums = [];
    if (total <= 7) {
      for (var i = 1; i <= total; i++) nums.push(i);
    } else {
      nums.push(1);
      if (curPage > 3) nums.push('…');
      for (var j = Math.max(2, curPage - 1); j <= Math.min(total - 1, curPage + 1); j++) nums.push(j);
      if (curPage < total - 2) nums.push('…');
      nums.push(total);
    }
    var h = '<button class="pg-btn" onclick="gotoPage(' + (curPage - 1) + ')">‹</button>';
    nums.forEach(function (n) {
      h += n === '…'
        ? '<span class="pg-ellipsis">…</span>'
        : '<button class="pg-btn' + (n === curPage ? ' active' : '') + '" onclick="gotoPage(' + n + ')">' + n + '</button>';
    });
    h += '<button class="pg-btn" onclick="gotoPage(' + (curPage + 1) + ')">›</button>';
    $('pgPager').innerHTML = h;
  }

  function gotoPage(p) {
    var total = Math.max(1, Math.ceil(lastList.length / PAGE_SIZE));
    if (p < 1) { toast('已是第一页', 'info'); return; }
    if (p > total) { toast('已是最后一页', 'info'); return; }
    if (p === curPage) { toast('已在第 ' + p + ' 页', 'info'); return; }
    curPage = p;
    renderTable();
  }

    var rows = document.querySelectorAll('.filter-row.extra');

    btn.textContent = show ? '收起 ▲' : '展开 ▼';
    /* 展开：按钮组移到最后一行筛选条件右侧；收起：移回第二行末尾 */
    var btns = document.querySelector('.filter-panel .filter-btns');
    var mainRows = document.querySelectorAll('.filter-panel .filter-row:not(.extra)');

    });

    var total = Math.max(1, Math.ceil(sfLastList.length / SF_PAGE_SIZE));
    if (sfCurPage > total) sfCurPage = total;
    var start = (sfCurPage - 1) * SF_PAGE_SIZE;
    var slice = sfLastList.slice(start, start + SF_PAGE_SIZE);

    var html = '';
    if (slice.length === 0) {
      html = '<tr class="empty-row"><td colspan="13" style="text-align:center;padding:24px;color:var(--text-tertiary)">暂无符合条件的居民档案</td></tr>';
    } else {
      slice.forEach(function (r, i) {
        var opHtml = '';
        if (r.op === 'create') {
          opHtml = '<a class="op-create" onclick="selectArchive(\'' + esc(r.archNo) + '\')">新建</a>';
        } else if (r.op === 'enter') {
          opHtml = '<a class="op-enter" onclick="enterArchive(\'' + esc(r.name) + '\')">进入专项</a>';
        } else {
          opHtml = '<span class="op-none">-</span>';
        }
        var crowdHtml = r.crowd ? '<span class="crowd-tag" title="' + esc(r.crowd) + '">' + esc(r.crowd) + '</span>' : '<span class="op-none">-</span>';
        var rsDot = r.rStatus === '正常' ? 'ok' : 'warn';
        var lkDot = r.lock === '未上锁' ? 'ok' : 'warn';
        html += '<tr>'
          + '<td class="center">' + (start + i + 1) + '</td>'
          + '<td title="' + esc(r.archNo) + '"><span class="cell">' + esc(r.archNo) + '</span></td>'
          + '<td>' + esc(r.name) + '</td>'
          + '<td class="center">' + esc(r.gender) + '</td>'
          + '<td class="center">' + r.age + '</td>'
          + '<td>' + esc(r.idType) + '</td>'
          + '<td title="' + esc(r.idcard) + '"><span class="cell">' + (r.idcard || '-') + '</span></td>'
          + '<td>' + crowdHtml + '</td>'
          + '<td>' + esc(r.region) + '</td>'
          + '<td title="' + esc(r.org) + '"><span class="cell">' + esc(r.org) + '</span></td>'
          + '<td><span class="st-dot ' + rsDot + '"></span>' + esc(r.rStatus) + '</td>'
          + '<td><span class="st-dot ' + lkDot + '"></span>' + esc(r.lock) + '</td>'
          + '<td class="center">' + opHtml + '</td>'
          + '</tr>';
      });
    }
    $('sfTbBody').innerHTML = html;
    $('sfTotal').textContent = sfLastList.length;
    renderSelectPager(total);
    $('sfJump').value = sfCurPage;
  }

  function renderSelectPager(total) {
    var nums = [];
    if (total <= 7) {
      for (var i = 1; i <= total; i++) nums.push(i);
    } else {
      nums.push(1);
      if (sfCurPage > 3) nums.push('…');
      for (var j = Math.max(2, sfCurPage - 1); j <= Math.min(total - 1, sfCurPage + 1); j++) nums.push(j);
      if (sfCurPage < total - 2) nums.push('…');
      nums.push(total);
    }
    var h = '<button class="pg-btn" onclick="sfGotoPage(' + (sfCurPage - 1) + ')">‹</button>';
    nums.forEach(function (n) {
      h += n === '…'
        ? '<span class="pg-ellipsis">…</span>'
        : '<button class="pg-btn' + (n === sfCurPage ? ' active' : '') + '" onclick="sfGotoPage(' + n + ')">' + n + '</button>';
    });
    h += '<button class="pg-btn" onclick="sfGotoPage(' + (sfCurPage + 1) + ')">›</button>';
    $('sfPager').innerHTML = h;
  }

  function sfGotoPage(p) {
    var total = Math.max(1, Math.ceil(sfLastList.length / SF_PAGE_SIZE));
    if (p < 1 || p > total || p === sfCurPage) return;
    sfCurPage = p;
    renderSelectTable();
  }

  function sfJumpPage() {
    var v = parseInt($('sfJump').value, 10);
    if (!isNaN(v)) sfGotoPage(v);
  }

  function resetSelectFilter() {
    ['sfName','sfIdcard','sfGrid','sfAge','sfRegion'].forEach(function (id) { $(id).value = ''; });
    $('sfIdType').value = ''; $('sfOrg').value = '';
    $('sfGender').value = ''; $('sfCrowd').value = '';
    sfCurPage = 1;
    renderSelectTable();
  }

  function applySelectFilter() {
    sfCurPage = 1;
    renderSelectTable();
    toast('查询完成，共 ' + $('sfTotal').textContent + ' 条记录', 'success');
  }

  function toggleSelectExtra() {
    var row = $('sfExtraRow'), btn = $('sfExpand');
    var show = row.style.display !== 'none';
    row.style.display = show ? 'none' : 'flex';
    btn.textContent = show ? '展开 ▼' : '收起 ▲';
  }

  function openSelectModal() {
    sfCurPage = 1;
    renderSelectTable();
    $('selectModal').classList.add('show');
  }

  function closeSelectModal() {
    $('selectModal').classList.remove('show');
  }

  /* 选择档案后点击"新建专项"：跳转至档案维护页，切换到妇女档案表填报界面 */
  function selectArchive(archNo) {
    var r = null;
    for (var i = 0; i < selectArchiveData.length; i++) {
      if (selectArchiveData[i].archNo === archNo) { r = selectArchiveData[i]; break; }
    }
    if (!r) return;
    closeSelectModal();
    var params = [
      'view=women',
      'name=' + encodeURIComponent(r.name),
      'gender=' + encodeURIComponent(r.gender === '男' ? '男性' : '女性'),
      'idcard=' + encodeURIComponent(r.idcard),
      'idType=' + encodeURIComponent(r.idType),
      'archNo=' + encodeURIComponent(r.archNo)
    ];
    if (r.idcard && /^\d{17}[\dXx]$/.test(r.idcard)) {
      params.push('birth=' + r.idcard.slice(6, 10) + '-' + r.idcard.slice(10, 12) + '-' + r.idcard.slice(12, 14));
    }
    location.href = '档案维护.html?' + params.join('&');
  }

  /* 已有专项档案：点击"进入专项" */
  function enterArchive(name) {
    closeSelectModal();
    toast('进入妇女档案：' + name + '（功能建设中）', 'info');
  }

  /* 列表操作列「查看/编辑」：跳转档案维护页并定位到妇女档案表（带行数据预填） */
  function goArchive(archNo) {
    var r = null;
    for (var i = 0; i < womenData.length; i++) {
      if (womenData[i].archNo === archNo) { r = womenData[i]; break; }
    }
    if (!r) return;
    var params = [
      'view=women',
      'name=' + encodeURIComponent(r.name),
      'gender=' + encodeURIComponent(r.gender === '男' ? '男性' : '女性'),
      'idcard=' + encodeURIComponent(r.idcard),
      'idType=' + encodeURIComponent(r.idType || '居民身份证'),
      'archNo=' + encodeURIComponent(r.archNo),
      'addr=' + encodeURIComponent(r.address || '')
    ];
    if (r.birth) params.push('birth=' + encodeURIComponent(r.birth));
    if (r.phone) params.push('phone=' + encodeURIComponent(r.phone));
    if (r.marriage) params.push('marriage=' + encodeURIComponent(r.marriage));
    if (r.crowd) params.push('crowd=' + encodeURIComponent(r.crowd));
    if (r.region) params.push('region=' + encodeURIComponent(r.region));
    if (r.dutyDoc) params.push('dutyDoc=' + encodeURIComponent(r.dutyDoc));
    if (r.createDate) params.push('createDate=' + encodeURIComponent(r.createDate));
    location.href = '档案维护.html?' + params.join('&');
  }

  /* 筛选控件实时过滤 */
  ['sfName','sfIdcard','sfGrid','sfAge','sfRegion'].forEach(function (id) {
    $(id).addEventListener('input', function () { sfCurPage = 1; renderSelectTable(); });
  });
  ['sfIdType','sfOrg','sfGender','sfCrowd'].forEach(function (id) {
    $(id).addEventListener('change', function () { sfCurPage = 1; renderSelectTable(); });
  });

  /* ================= 新建妇女档案档案弹框 ================= */
  function pvRow(label, val, wide) {
    return '<div class="pv-row' + (wide ? ' wide' : '') + '"><span class="pv-label">' + label + '</span><span class="pv-val">' + esc(val || '') + '</span></div>';
  }

  /* 回显卡渲染：左侧表单实时联动 */
  function renderPreview() {
    $('pvCard').innerHTML =
      pvRow('姓名：', $('cmName').value.trim()) +
      pvRow('性别：', $('cmGender').value) +
      pvRow('出生年月：', $('cmBirth').value) +
      pvRow('证件类型：', $('cmIdType').value) +
      pvRow('证件号：', $('cmIdcard').value.trim(), true) +
      pvRow('联系电话：', $('cmPhone').value.trim()) +
      pvRow('重点人群类型：', $('cmCrowd').value) +
      pvRow('婚姻状况：', $('cmMarriage').value) +
      pvRow('建档日期：', $('cmCreateDate').value);
  }

  /* 弹框刚打开时回显卡为空（贴合原型：仅展示标签） */
  function renderPreviewEmpty() {
    $('pvCard').innerHTML =
      pvRow('姓名：', '') + pvRow('性别：', '') +
      pvRow('出生年月：', '') + pvRow('证件类型：', '') +
      pvRow('证件号：', '', true) +
      pvRow('联系电话：', '') + pvRow('重点人群类型：', '') +
      pvRow('婚姻状况：', '') + pvRow('建档日期：', '');
  }

  function openCreateModal() {
    /* 新建专项第一步：弹出档案选择框，选择居民档案后再进入专项表单 */
    openSelectModal();
  }

  function closeCreateModal() {
    $('createModal').classList.remove('show');
  }

  /* 证件号满 18 位：自动解析出生日期与性别（身份证第 7-14 位出生段、第 17 位奇偶判性别） */
  function parseIdcard() {
    var v = $('cmIdcard').value.trim();
    if (!/^\d{17}[\dXx]$/.test(v)) return;
    $('cmBirth').value = v.slice(6, 10) + '-' + v.slice(10, 12) + '-' + v.slice(12, 14);
    $('cmGender').value = (parseInt(v[16], 10) % 2 === 1) ? '男性' : '女性';
    toast('已根据证件号自动填充出生日期与性别', 'success');
  }

  function submitCreate() {
    var missing = [];
    if (!$('cmIdType').value) missing.push('证件类型');
    var idcard = $('cmIdcard').value.trim();
    if (!idcard) missing.push('证件号');
    else if (!/^\d{17}[\dXx]$/.test(idcard)) { toast('证件号格式不正确，需为 18 位', 'warning'); return; }
    if (!$('cmName').value.trim()) missing.push('姓名');
    if (!$('cmGender').value) missing.push('性别');
    if (!$('cmBirth').value) missing.push('出生日期');
    if (!$('cmPhone').value.trim()) missing.push('联系电话');
    if (!$('cmCrowd').value) missing.push('重点人群类型');
    if (!$('cmMarriage').value) missing.push('婚姻状况');
    if (!$('cmCreateDate').value) missing.push('建档日期');
    if (missing.length) { toast('请完善必填项：' + missing.join('、'), 'warning'); return; }
    closeCreateModal();
    toast('专项档案信息校验通过，创建流程后续步骤建设中', 'success');
  }

  /* 弹框联动事件 */
  ['cmIdType', 'cmGender', 'cmBirth', 'cmCrowd', 'cmMarriage', 'cmCreateDate'].forEach(function (id) {
    $(id).addEventListener('change', renderPreview);
  });
  $('cmPhone').addEventListener('input', renderPreview);
  $('cmIdcard').addEventListener('input', function () {
    $('cntIdcard').textContent = this.value.length + '/18';
    if (this.value.length === 18) parseIdcard();
    renderPreview();
  });
  $('cmName').addEventListener('input', function () {
    $('cntName').textContent = this.value.length + '/8';
    renderPreview();
  });

  /* 初始渲染 */
  renderTable();
</script>

</body>
</html>
