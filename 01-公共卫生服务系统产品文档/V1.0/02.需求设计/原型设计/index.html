<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康医疗应用中心</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 框架壳子特有样式（设计变量与公共样式见 框架.css） ===== */

  /* 内容区：去掉内边距，由 iframe 内嵌页面自带留白（与独立打开时视觉一致） */
  .content.shell-content{padding:0;overflow:hidden;display:flex;flex-direction:column}

  /* 页面装载 iframe：每个标签页独立一个 iframe，切换标签不重载、状态互不影响 */
  .shell-frame{flex:1;width:100%;border:none;display:block;background:var(--bg-page)}
  .shell-frame.hidden{display:none}

  /* 无标签页时的空状态 */
  .shell-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg-page);color:var(--text-tertiary)}
  .shell-empty .ico{font-size:44px;opacity:.35;line-height:1}
  .shell-empty .txt{font-size:var(--font-size-body)}
</style>
</head>
<body>

<!-- ===== 框架壳子 =====
  顶部导航栏与左侧菜单栏由 框架.js 注入；
  标签栏与右侧内容区由本页管理：
  点击左侧菜单 → 打开/激活标签页 → 右侧装载对应页面（iframe 内嵌） -->
<div class="main-area">

  <!-- 标签栏（由下方脚本动态渲染） -->
  <div class="tabbar" id="shellTabbar"></div>

  <!-- 内容区：装载功能页面 -->
  <div class="content shell-content" id="shellContent">
    <div class="shell-empty" id="shellEmpty">
      <div class="ico">📋</div>
      <div class="txt">请从左侧菜单选择功能模块</div>
    </div>
  </div>
</div>

<!-- ===== 统一框架：顶部导航栏 + 左侧菜单栏（菜单配置见 框架.js；data-shell 声明壳子模式） ===== -->
<script src="框架.js" data-shell="true"></script>

<script>
/* ==========================================================================
 * 框架壳子逻辑：标签页管理 + 页面装载
 * 依赖 框架.js 提供：MENU_CONFIG / findMenuItem / setMenuActive / FRAME_DIR
 * --------------------------------------------------------------------------
 * 工作方式：
 *   1. 左侧菜单点击 → 框架.js navigate() → 本页 shellOpen(key)
 *   2. 菜单项配置了 url：以 iframe 内嵌对应页面（自动附加 ?embed=1，
 *      页面检测后进入嵌入模式，不重复注入顶部导航栏 / 左侧菜单栏 / 标签栏）
 *   3. 菜单项未配置 url：右侧显示「功能建设中」占位页
 *   4. 每个标签页独立 iframe：切换标签保留各页状态，关闭标签销毁对应 iframe
 * ========================================================================== */
(function () {
  'use strict';

  var tabs = [];          // 标签页集合：{ key, label, url, frame }
  var activeKey = null;   // 当前激活标签页 key
  var tabbar = document.getElementById('shellTabbar');
  var content = document.getElementById('shellContent');
  var emptyState = document.getElementById('shellEmpty');

  /* 标签页图标：按菜单分组取用（与各页面原有标签图标风格一致） */
  var GROUP_TAB_ICONS = {
    archives: '<path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/><line x1="2" y1="11" x2="22" y2="11"/>',
    chronic: '<path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>',
    elderly: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    log: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
    jianjiao: '<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/>',
    supervision: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>',
    reportcard: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    bizquery: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    syssetting: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>',
    panorama: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>',
    system: '<path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/>'
  };

  /* 查菜单项所属分组 key（用于取标签图标，兼容三级嵌套子菜单） */
  function findGroupKeyOf(key) {
    var cfg = window.MENU_CONFIG || [];
    for (var i = 0; i < cfg.length; i++) {
      var g = cfg[i];
      if (g.type !== 'group') continue;
      if (g.key === key) return g.key;
      var ch = g.children || [];
      for (var j = 0; j < ch.length; j++) {
        if (ch[j].key === key) return g.key;
        var sub = ch[j].children || [];
        for (var k = 0; k < sub.length; k++) {
          if (sub[k].key === key) return g.key;
        }
      }
    }
    return null;
  }

  function getTab(key) {
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].key === key) return tabs[i];
    }
    return null;
  }

  /* 打开 / 激活标签页（由 框架.js 的 navigate 调用） */
  window.shellOpen = function (key) {
    var item = window.findMenuItem(key);
    if (!item) return;
    if (!getTab(key)) {
      tabs.push({
        key: key,
        label: item.label,
        url: item.url ? (window.FRAME_DIR || '') + item.url : null,
        frame: null
      });
    }
    activate(key);
  };

  function activate(key) {
    var tab = getTab(key);
    if (!tab) return;
    activeKey = key;
    if (!tab.frame) tab.frame = createFrame(tab); // 懒创建：首次激活时才装载
    // 显示当前页、隐藏其他页（各标签页状态互不影响）
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].frame) tabs[i].frame.classList.toggle('hidden', tabs[i].key !== key);
    }
    emptyState.style.display = 'none';
    if (window.setMenuActive) window.setMenuActive(key); // 左侧菜单同步高亮
    renderTabbar();
  }

  function createFrame(tab) {
    var f = document.createElement('iframe');
    f.className = 'shell-frame';
    if (tab.url) {
      // 附加 embed 参数：页面（框架.js data-embed="auto"）进入嵌入模式
      f.src = tab.url + (tab.url.indexOf('?') > -1 ? '&' : '?') + 'embed=1';
    } else {
      f.srcdoc = buildPlaceholderDoc(tab.label);
    }
    content.appendChild(f);
    return f;
  }

  function closeTab(key) {
    var idx = -1;
    for (var i = 0; i < tabs.length; i++) {
      if (tabs[i].key === key) { idx = i; break; }
    }
    if (idx < 0) return;
    var tab = tabs[idx];
    if (tab.frame && tab.frame.parentNode) tab.frame.parentNode.removeChild(tab.frame);
    tabs.splice(idx, 1);
    if (activeKey === key) {
      // 关闭的是当前标签：优先激活右侧相邻标签，其次左侧
      var neighbor = tabs[idx] || tabs[idx - 1] || null;
      if (neighbor) {
        activate(neighbor.key);
      } else {
        activeKey = null;
        emptyState.style.display = 'flex';
        if (window.setMenuActive) window.setMenuActive('');
        renderTabbar();
      }
    } else {
      renderTabbar();
    }
  }

  function renderTabbar() {
    tabbar.innerHTML = '';
    tabs.forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'tab-item' + (t.key === activeKey ? ' active' : '');
      el.title = t.label;

      var icon = GROUP_TAB_ICONS[findGroupKeyOf(t.key)] || GROUP_TAB_ICONS.system;
      el.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0">' + icon + '</svg>';

      var label = document.createElement('span');
      label.textContent = t.label;
      el.appendChild(label);

      var close = document.createElement('span');
      close.className = 'tab-close';
      close.title = '关闭标签';
      close.textContent = '×';
      close.onclick = function (ev) {
        ev.stopPropagation();
        closeTab(t.key);
      };
      el.appendChild(close);

      el.onclick = function () { activate(t.key); };
      tabbar.appendChild(el);
    });
  }

  /* 未配置页面的菜单项：内嵌「功能建设中」占位页 */
  function buildPlaceholderDoc(label) {
    return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">' +
      '<style>' +
      'html,body{height:100%;margin:0}' +
      'body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#F0F0F0;display:flex;align-items:center;justify-content:center;overflow:auto}' +
      '.ph-card{background:#fff;border:1px solid #BFDEFF;border-radius:8px;padding:44px 64px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04)}' +
      '.ph-ico{font-size:40px;line-height:1;margin-bottom:14px}' +
      '.ph-title{font-size:16px;font-weight:500;color:#262626;margin-bottom:8px}' +
      '.ph-desc{font-size:13px;color:#8c8c8c;line-height:1.6}' +
      '</style></head><body>' +
      '<div class="ph-card">' +
      '<div class="ph-ico">🚧</div>' +
      '<div class="ph-title">「' + label + '」功能建设中</div>' +
      '<div class="ph-desc">该模块原型暂未提供，请从左侧菜单选择其他功能模块</div>' +
      '</div></body></html>';
  }

  /* ===== 初始化：默认打开「脱敏设置」（新增页面后可按需调整默认落地页） ===== */
  (function init() {
    var item = window.findMenuItem('tuomin');
    if (!item) {
      // 兜底：打开菜单中第一个配置了 url 的页面
      (window.MENU_CONFIG || []).some(function (g) {
        if (g.type !== 'group') return false;
        return (g.children || []).some(function (c) {
          if (c.url) { item = c; return true; }
          return false;
        });
      });
    }
    if (item) window.shellOpen(item.key);
  })();
})();
</script>
</body>
</html>
