<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 - 公共卫生系统</title>
<link rel="stylesheet" href="框架.css">
<style>
  html.embed-mode .main-area{height:100%}
  html.embed-mode .tabbar{display:none}
  html.embed-mode .toast{top:24px}

  .content{padding:12px;overflow-y:auto;overflow-x:hidden}
  .content-card{border:none;min-height:100%}

  /* 页面标题 */
  .dash-head{padding:4px 4px 16px}
  .dash-head h1{font-size:18px;font-weight:var(--font-weight-medium);color:var(--text-primary)}

  /* 筛选栏 */
  .filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .fb-select{height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 28px 0 12px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;cursor:pointer;transition:all var(--transition-fast)}
  .fb-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fb-input{height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 12px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fb-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fb-input.fb-date{padding:0 30px 0 12px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238c8c8c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2'/%3E%3Cline x1='16' y1='2' x2='16' y2='6'/%3E%3Cline x1='8' y1='2' x2='8' y2='6'/%3E%3Cline x1='3' y1='10' x2='21' y2='10'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;cursor:pointer}
  .fb-range{display:flex;align-items:center;gap:8px}
  .fb-range .dash{-color:var(--text-tertiary)}
  .filter-btns{margin-left:auto;display:flex;gap:8px}

  /* 统计卡片 */
  .stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat-card{border-radius:var(--r-md);padding:20px 20px;display:flex;align-items:center;justify-content:space-between;min-height:96px;transition:transform var(--transition-fast),box-shadow var(--transition-fast)}
  .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .stat-card .sc-label{font-size:14px;color:var(--text-secondary);margin-bottom:10px;white-space:nowrap}
  .stat-card .sc-value{font-size:30px;font-weight:600;line-height:1;color:var(--text-primary)}
  .stat-card .sc-icon{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px}
  .stat-card .sc-icon svg{width:26px;height:26px}
  .stat-card.blue{background:#E8F4FD}
  .stat-card.blue .sc-icon{background:#D0E8FA}
  .stat-card.orange{background:#FFF4E6}
  .stat-card.orange .sc-icon{background:#FFE4C2}
  .stat-card.green{background:#E8F8E8}
  .stat-card.green .sc-icon{background:#C8ECC8}
  .stat-card.purple{background:#F0E8FF}
  .stat-card.purple .sc-icon{background:#E0D0FA}

  /* 图表区块 */
  .chart-section{background:var(--bg-white);border-radius:var(--r-md);padding:20px 24px;margin-bottom:20px;border:1px solid #F0F0F0}
  .chart-title{font-size:16px;font-weight:var(--font-weight-medium);color:var(--text-primary);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #F0F0F0}
  .chart-wrap{position:relative;height:260px}
  .chart-legend{position:absolute;top:0;right:0;display:flex;gap:16px;font-size:12px;color:var(--text-secondary)}
  .chart-legend .lg-item{display:flex;align-items:center;gap:6px}
  .chart-legend .lg-dot{width:12px;height:12px;border-radius:2px}
  .chart-grid{position:absolute;top:24px;left:40px;right:16px;bottom:32px}
  .chart-y{position:absolute;top:24px;left:0;height:calc(100% - 56px);width:32px;display:flex;flex-direction:column;justify-content:space-between;text-align:right;font-size:11px;color:var(--text-tertiary)}
  .chart-bars{position:absolute;top:24px;left:40px;right:16px;bottom:32px;display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid #E8E8E8;border-left:1px solid #E8E8E8}
  .bar-group{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;position:relative}
  .bar-pair{display:flex;align-items:flex-end;gap:4px;height:100%;justify-content:center}
  .bar{width:24px;border-radius:2px 2px 0 0;transition:height 0.6s ease;min-height:2px}
  .bar.male{background:#007AFF}
  .bar.female{background:#FA8C16}
  .bar.single{background:#007AFF;width:32px}
  .bar-x{position:absolute;bottom:-24px;font-size:11px;color:var(--text-tertiary);white-space:nowrap;transform:translateX(-50%);left:50%}
  .chart-grid-lines{position:absolute;top:24px;left:40px;right:16px;bottom:32px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .grid-line{height:1px;background:repeating-linear-gradient(90deg,#E8E8E8 0,#E8E8E8 4px,transparent 4px,transparent 8px)}
</style>
</head>
<body>

<div class="main-area">

  <div class="tabbar">
    <div class="tab-item active">首页</div>
  </div>

  <div class="content">
    <div class="content-card">

      <!-- 页面标题 -->
      <div class="dash-head">
        <h1>卫健管理者</h1>
      </div>

      <!-- 筛选栏 -->
      <div class="filter-bar">
        <select class="fb-select" id="fbType" onchange="fbTypeChange()">
          <option value="org">按机构</option>
          <option value="region">按行政区划</option>
        </select>
        <select class="fb-select" id="fbScope"></select>
        <select class="fb-select" id="fbMode" onchange="fbModeChange()">
          <option value="year">按年</option>
          <option value="month">按月</option>
        </select>
        <div class="fb-range">
          <input class="fb-input fb-date" id="fbStart" type="text" value="2026" style="width:110px">
          <span class="dash">-</span>
          <input class="fb-input fb-date" id="fbEnd" type="text" value="2026" style="width:110px">
        </div>
        <div class="filter-btns">
          <button class="btn btn-default" onclick="fbReset()">重置</button>
          <button class="btn btn-primary" onclick="toast('查询成功','success')">查询</button>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="stat-cards">
        <div class="stat-card blue">
          <div>
            <div class="sc-label">健康档案数</div>
            <div class="sc-value">11</div>
          </div>
          <div class="sc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              <line x1="12" y1="11" x2="12" y2="17"/>
              <line x1="9" y1="14" x2="15" y2="14"/>
            </svg>
          </div>
        </div>
        <div class="stat-card orange">
          <div>
            <div class="sc-label">老年人档案数</div>
            <div class="sc-value">1</div>
          </div>
          <div class="sc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FA8C16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
              <circle cx="12" cy="7" r="1.5"/>
            </svg>
          </div>
        </div>
        <div class="stat-card green">
          <div>
            <div class="sc-label">高血压档案数</div>
            <div class="sc-value">1</div>
          </div>
          <div class="sc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#52C31B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
        </div>
        <div class="stat-card purple">
          <div>
            <div class="sc-label">糖尿病档案数</div>
            <div class="sc-value">1</div>
          </div>
          <div class="sc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#7B61FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <line x1="2" y1="17" x2="12" y2="22"/>
              <line x1="22" y1="17" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="12" y2="17"/>
              <line x1="22" y1="12" x2="12" y2="17"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- 疾病情况 -->
      <div class="chart-section">
        <div class="chart-title">疾病情况</div>
        <div class="chart-wrap">
          <div class="chart-legend">
            <div class="lg-item"><div class="lg-dot" style="background:#007AFF"></div>数量</div>
          </div>
          <div class="chart-y">
            <span>4</span><span>3</span><span>2</span><span>1</span><span>0</span>
          </div>
          <div class="chart-grid-lines">
            <div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div>
          </div>
          <div class="chart-bars">
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar single" style="height:100%"></div>
              </div>
              <div class="bar-x">高血压</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar single" style="height:25%"></div>
              </div>
              <div class="bar-x">糖尿病</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 辖区人口分布 -->
      <div class="chart-section">
        <div class="chart-title">辖区人口分布</div>
        <div class="chart-wrap" style="height:280px">
          <div class="chart-legend">
            <div class="lg-item"><div class="lg-dot" style="background:#007AFF"></div>男</div>
            <div class="lg-item"><div class="lg-dot" style="background:#FA8C16"></div>女</div>
          </div>
          <div class="chart-y" style="height:calc(100% - 56px)">
            <span>30</span><span>25</span><span>20</span><span>15</span><span>10</span><span>5</span><span>0</span>
          </div>
          <div class="chart-grid-lines">
            <div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div><div class="grid-line"></div>
          </div>
          <div class="chart-bars">
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar male" style="height:30%"></div>
              </div>
              <div class="bar-x">0-9岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair"></div>
              <div class="bar-x">10-19岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar male" style="height:90%"></div>
              </div>
              <div class="bar-x">20-29岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar female" style="height:30%"></div>
              </div>
              <div class="bar-x">30-39岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar female" style="height:60%"></div>
              </div>
              <div class="bar-x">40-49岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar male" style="height:60%"></div>
              </div>
              <div class="bar-x">50-59岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar male" style="height:30%"></div>
              </div>
              <div class="bar-x">60-69岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair">
                <div class="bar female" style="height:30%"></div>
              </div>
              <div class="bar-x">70-79岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair"></div>
              <div class="bar-x">80-89岁</div>
            </div>
            <div class="bar-group">
              <div class="bar-pair"></div>
              <div class="bar-x">90岁以上</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="框架.js" data-page="dashboard" data-embed="auto" data-sysname="公共卫生系统" data-org="山东大学齐鲁医院"></script>
<script>
'use strict';
/* ================= 筛选栏联动 ================= */
var FB_ORGS = ['山东大学齐鲁医院', '山东省立医院', '济南市中心医院'];
/* 按行政区划：镇列表（与区域网格化管理页同源） */
var FB_TOWNS = ['仙女镇', '小纪镇', '邵伯镇', '樊川镇', '真武镇', '宜陵镇', '丁沟镇', '郭村镇'];

function fbFillScope(type) {
  var sel = document.getElementById('fbScope');
  var list = type === 'region' ? FB_TOWNS : FB_ORGS;
  var ph = type === 'region' ? '请选择行政区划' : '请选择机构';
  sel.innerHTML = '<option value="">' + ph + '</option>'
    + list.map(function (x) { return '<option>' + x + '</option>'; }).join('');
}
/* 第一列切换：按机构 / 按行政区划 → 第二列选项联动刷新 */
function fbTypeChange() {
  fbFillScope(document.getElementById('fbType').value);
}
/* 第三列切换：按年 / 按月 → 时间区间值格式联动（yyyy / yyyy-MM） */
function fbModeChange() {
  var isMonth = document.getElementById('fbMode').value === 'month';
  var s = document.getElementById('fbStart'), e = document.getElementById('fbEnd');
  if (isMonth) {
    if (/^\d{4}$/.test(s.value)) s.value = s.value + '-01';
    if (/^\d{4}$/.test(e.value)) e.value = e.value + '-12';
  } else {
    if (/^\d{4}-\d{2}$/.test(s.value)) s.value = s.value.slice(0, 4);
    if (/^\d{4}-\d{2}$/.test(e.value)) e.value = e.value.slice(0, 4);
  }
}
/* 重置：恢复默认筛选（按机构 + 请选择机构 + 按年 + 当年区间） */
function fbReset() {
  document.getElementById('fbType').value = 'org';
  fbFillScope('org');
  document.getElementById('fbMode').value = 'year';
  document.getElementById('fbStart').value = '2026';
  document.getElementById('fbEnd').value = '2026';
  toast('已重置', 'info');
}
/* 初始化 */
fbFillScope('org');
</script>
</body>
</html>
