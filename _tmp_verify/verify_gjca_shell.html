<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>html,body{margin:0;height:100%;background:#fff}#f{width:1600px;height:900px;border:0}#info{position:fixed;left:0;top:0;z-index:99;background:#ffe94d;color:#000;font:bold 16px/1.5 Consolas,monospace;padding:4px 10px;max-width:1600px;white-space:pre-wrap}</style>
</head>
<body>
<div id="info">loading...</div>
<iframe id="f"></iframe>
<script>
var base = 'file:///D:/AI_Project/Public-Health-Service-System/Public-Health-Service-System/';
var dir = base + ['01-公共卫生服务系统产品文档','V1.0','02.需求设计','原型设计'].map(encodeURIComponent).join('/') + '/';
var f = document.getElementById('f');
f.src = dir + 'index.html';
f.onload = function () {
  try {
    var w = f.contentWindow;
    var doc = w.document;
    var out = [];
    // shellOpen 打开宫颈癌筛查（三级子菜单项）
    w.shellOpen('cervical-cancer-screening');
    var owners = doc.querySelectorAll('.sub-item.has-children');
    out.push('has-children=' + owners.length);
    var sub2 = doc.querySelector('.menu-sub.sub2');
    out.push('sub2-open=' + sub2.classList.contains('open'));
    var labels = [];
    sub2.querySelectorAll('.sub-item').forEach(function (i) { labels.push(i.textContent.trim() + (i.classList.contains('active') ? '*' : '')); });
    out.push('sub2-items=' + labels.join('|'));
    var ownerExpanded = doc.querySelector('.sub-item.has-children').classList.contains('expanded');
    out.push('owner-expanded=' + ownerExpanded);
    // 标签栏
    var tabs = [];
    doc.querySelectorAll('#shellTabbar .tab-item span').forEach(function (s) { tabs.push(s.textContent); });
    out.push('tabs=' + tabs.join('|'));
    // 页面 iframe
    var frames = doc.querySelectorAll('iframe.shell-frame');
    out.push('frames=' + frames.length);
    out.push('lastSrc=' + decodeURIComponent(frames[frames.length - 1].getAttribute('src')));
    // 菜单收起/展开交互
    doc.querySelector('.sub-item.has-children').click();
    out.push('afterClick-open=' + sub2.classList.contains('open'));
    doc.querySelector('.sub-item.has-children').click();
    out.push('afterClick2-open=' + sub2.classList.contains('open'));
    document.getElementById('info').textContent = 'OK\n' + out.join('\n');
  } catch (e) {
    document.getElementById('info').textContent = 'ERR ' + e.message;
  }
};
</script>
</body>
</html>
