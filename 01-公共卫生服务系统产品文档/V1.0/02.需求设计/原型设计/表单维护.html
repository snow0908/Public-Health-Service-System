<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表单维护 - 系统设置</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 表单维护页面特有样式（设计变量与公共样式见 框架.css） =====
     风格：克制的企业级配置台。单一主色 + 中性灰承载界面，颜色只用于把关强调。 */

  /* 嵌入模式（被 index.html 壳子内嵌时生效） */
  html.embed-mode .main-area{height:100%}
  html.embed-mode .tabbar{display:none}
  html.embed-mode .toast{top:24px}

  /* 布局：content 改为 flex，配置工作台撑满高度并内部滚动 */
  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

  /* ===== 页头 ===== */
  .page-head .right{font-size:13px;color:var(--text-tertiary);gap:6px}
  .page-head .right svg{width:14px;height:14px;stroke:var(--text-tertiary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ===== 配置工作台：左侧表单树 + 右侧配置区 ===== */
  .config-wrap{flex:1;min-height:0;display:flex}

  /* ---- 左侧：业务表单列表 ---- */
  .tree-pane{width:248px;flex-shrink:0;border-right:1px solid #ECEFF2;display:flex;flex-direction:column;background:var(--bg-white)}
  .tree-search{padding:10px 12px;border-bottom:1px solid #ECEFF2;flex-shrink:0}
  .tree-scroll{flex:1;overflow:auto;min-height:0;padding:6px 0 16px}
  .tree-group-label{display:flex;align-items:center;padding:12px 12px 4px;font-size:12px;font-weight:500;color:var(--text-tertiary)}
  .tree-item{position:relative;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;margin:1px 8px;cursor:pointer;border-radius:6px;transition:background var(--transition-fast)}
  .tree-item:hover{background:#F5F6F8}
  .tree-item.active{background:#EEF3FA}
  .tree-item .tree-name{flex:1;min-width:0;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-item.active .tree-name{color:var(--primary);font-weight:500}
  .tree-item .tree-meta{font-size:11px;color:var(--text-tertiary);white-space:nowrap;flex-shrink:0}
  .tree-item .tree-off{font-size:11px;color:#A94A35;flex-shrink:0}
  .tree-item.off{opacity:.5}
  .tree-empty{padding:40px 20px;text-align:center;color:var(--text-tertiary);font-size:13px}

  /* ---- 右侧：配置区 ---- */
  .cfg-pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-white)}
  .cfg-head{display:flex;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid #ECEFF2;flex-shrink:0;flex-wrap:wrap}
  .cfg-head .cfg-title h2{font-size:15px;font-weight:500;color:var(--text-primary);line-height:1.3}
  .cfg-head .cfg-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
  .cfg-head .cfg-enable{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary)}

  /* ---- 指标条（单行紧凑） ---- */
  .stat-strip{display:flex;align-items:center;gap:18px;padding:6px 16px;border-bottom:1px solid #ECEFF2;flex-shrink:0;flex-wrap:wrap}
  .ss-item{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .ss-item label{font-size:12px;color:var(--text-tertiary)}
  .ss-item b{font-size:14px;font-weight:500;color:var(--text-primary)}
  .ss-item .ss-dim{font-size:12px;color:var(--text-tertiary)}
  .ss-sep{width:1px;height:13px;background:#E5E7EB;flex-shrink:0}
  .ss-val{display:flex;align-items:center;gap:8px;margin-left:auto;white-space:nowrap}
  .ss-val b{font-size:14px;font-weight:500;color:var(--text-primary)}
  .ss-val b.ok{color:#6C9F4F}
  .ss-val b.no{color:#C0553C}
  .ss-chip{height:18px;line-height:18px;padding:0 8px;border-radius:9px;font-size:12px}
  .ss-chip.ok{background:#EDF6E6;color:#5E9147}
  .ss-chip.no{background:#F8EDEB;color:#A94A35}

  /* ---- 页签 ---- */
  .cfg-tabs{display:flex;align-items:center;gap:2px;padding:0 16px;border-bottom:1px solid #ECEFF2;flex-shrink:0}
  .cfg-tab{position:relative;height:42px;padding:0 16px;font-size:14px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:6px}
  .cfg-tab:hover{color:var(--primary)}
  .cfg-tab.active{color:var(--primary);font-weight:500}
  .cfg-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary);border-radius:2px}
  .cfg-tab .tab-cnt{min-width:18px;height:16px;line-height:16px;padding:0 5px;border-radius:8px;font-size:11px;color:var(--text-tertiary);background:#F2F3F5}
  .cfg-tab .tab-cnt.warn{color:#C0553C;background:#F8EDEB}
  .cfg-tab .tab-cnt.ok{color:#6C9F4F;background:#EDF6E6}

  /* ---- 必填项配置（扁平无框：留白分层，不加线框） ---- */
  .tab-body{flex:1;min-height:0;overflow:auto;padding:14px 16px 24px}
  .req-group{margin-bottom:2px}
  .req-group .req-ghead{display:flex;align-items:center;gap:6px;padding:12px 4px 6px;cursor:pointer;user-select:none;font-size:13px;font-weight:500;color:var(--text-primary)}
  .req-group .grp-arrow{width:14px;height:14px;flex-shrink:0;transition:transform var(--transition-fast)}
  .req-group .grp-arrow polyline{stroke:#9AA0A8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .req-group.collapsed .grp-arrow{transform:rotate(-90deg)}
  .req-group.collapsed .req-group-body{display:none}
  .req-group .req-ghead .gcnt{font-size:12px;font-weight:400;color:var(--text-tertiary)}
  .req-group .req-ghead .grp-btns{margin-left:auto;display:flex;gap:2px}
  .grp-all{height:22px;line-height:22px;padding:0 6px;border-radius:4px;font-size:12px;color:var(--text-tertiary);cursor:pointer;transition:color var(--transition-fast)}
  .grp-all:hover{color:var(--primary)}
  .grp-all.clean:hover{color:var(--text-secondary)}
  .req-group-body{padding:0 0 4px}
  .req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px}
  .req-cell{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:6px;transition:background var(--transition-fast);justify-content:flex-end}
  .req-cell:hover{background:#F4F6F8}
  .req-cell .req-label{min-width:0;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:right}
  .req-cell.req-true .req-label{font-weight:500}
  .req-cell label.req-switch{flex:none}
  .req-flag{font-size:13px;line-height:1;color:transparent;margin-right:1px}
  .req-cell.req-true .req-flag{color:#C0553C}
  .req-switch{flex-shrink:0}

  /* ---- 随访分类配置 ---- */
  .fctx-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 16px;flex-wrap:wrap;gap:8px}
  .fctx-hint{font-size:12px;color:var(--text-tertiary);max-width:560px;line-height:1.6}
  .fctx-tools{display:flex;align-items:center;gap:8px}
  .fctx-sum{display:flex;align-items:center;gap:8px}
  .fctx-sum .lbl{font-size:13px;color:var(--text-secondary)}
  .fctx-sum .sum-val{font-size:16px;font-weight:500;color:var(--primary)}
  .fctx-cards{display:flex;flex-direction:column;gap:14px}
  .fctx-card{border:1px solid #E8EBEF;border-radius:var(--r-md);overflow:hidden;background:#fff}
  .fctx-card-head{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#F8F9FA;border-bottom:1px solid #ECEEF1}
  .fctx-age-ico{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:12px;font-weight:600}
  .fctx-age-ico.eld{background:#E6A23C}
  .fctx-age-ico.nyg{background:var(--primary)}
  .fctx-age-name{font-size:13px;font-weight:500;color:var(--text-primary)}
  .fctx-age-rule{font-size:12px;color:var(--text-tertiary);background:#F0F2F5;border:1px solid #E8EBEF;border-radius:4px;padding:1px 8px}
  .fctx-card-body{display:grid;grid-template-columns:1fr 1fr}
  .fctx-col{padding:14px 16px}
  .fctx-col+.fctx-col{border-left:1px solid #ECEEF1}
  .fctx-col-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:12px;white-space:nowrap}
  .fctx-col-head .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .fctx-col.ok-col .fctx-col-head .dot{background:#6C9F4F}
  .fctx-col.no-col .fctx-col-head .dot{background:#C0553C}
  .fctx-cond{display:flex;align-items:center;gap:8px;min-height:34px;padding:3px 0}
  .fctx-cond+.fctx-cond{border-top:1px dashed #F0F2F5}
  .fctx-metric{width:56px;font-size:13px;color:var(--text-secondary);flex-shrink:0}
  .fctx-op{width:64px;height:30px;border:1px solid #E1E4E8;border-radius:var(--r-sm);padding:0 4px 0 8px;font-size:13px;color:var(--text-primary);background:#fff;outline:none;transition:all var(--transition-fast);appearance:none;-webkit-appearance:none}
  .fctx-val{width:88px;height:30px;border:1px solid #E1E4E8;border-radius:var(--r-sm);padding:0 8px;font-size:13px;color:var(--text-primary);text-align:right;background:#fff;outline:none;transition:all var(--transition-fast)}
  .fctx-op:focus,.fctx-val:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.12)}
  .fctx-unit{color:var(--text-tertiary);font-size:12px;white-space:nowrap}
  .fctx-none{padding:30px 20px;text-align:center;color:var(--text-tertiary);font-size:13px;border:1px dashed #D8DCE3;border-radius:var(--r-md)}

  /* 随访不佳设置 */
  .pf-card{border:1px solid #E8EBEF;border-radius:var(--r-md);background:#fff;overflow:hidden}
  .pf-card-head{padding:10px 16px;background:#F8F9FA;border-bottom:1px solid #ECEEF1;font-size:13px;font-weight:500;color:var(--text-primary)}
  .pf-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 16px}
  .pf-row+.pf-row{border-top:1px dashed #F0F2F5}
  .pf-label{width:110px;font-size:13px;color:var(--text-secondary);flex-shrink:0;text-align:right}
  .pf-label i{color:var(--danger);font-style:normal;margin-right:2px}
  .pf-select{width:220px;height:30px;border:1px solid #E1E4E8;border-radius:var(--r-sm);padding:0 8px;font-size:13px;color:var(--text-primary);background:#fff;outline:none;transition:all var(--transition-fast)}
  .pf-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.12)}
  .pf-checks{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .pf-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-primary);cursor:pointer}
  .pf-check input{width:14px;height:14px;accent-color:var(--primary);cursor:pointer}
  .pf-tip{margin-top:12px;padding:8px 14px;font-size:12px;line-height:1.6;color:#8A6D1A;background:#FDF6E3;border:1px solid #F3E3B6;border-radius:var(--r-sm)}

  /* ---- 完整度配置 ---- */
  .comp-toolbar{display:flex;align-items:center;gap:12px;padding:0 2px 14px;flex-wrap:wrap}
  .comp-toolbar .hint{font-size:12px;color:var(--text-tertiary)}
  .comp-sum{display:flex;align-items:center;gap:8px}
  .comp-sum .lbl{font-size:13px;color:var(--text-secondary)}
  .comp-sum .sum-val{font-size:18px;font-weight:500;color:var(--text-primary)}
  .comp-sum .sum-val.ok{color:#6C9F4F}
  .comp-sum .sum-val.no{color:#C0553C}
  .comp-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .btn.btn-xs{height:26px;line-height:24px;padding:0 10px;font-size:12px;border-radius:4px}
  .btn.btn-default.btn-xs:hover{color:var(--primary);border-color:var(--primary-border);background:#F2F6FB}

  /* 完整度字段级：必填锁定徽章 */
  .comp-lock{display:inline-block;margin-left:4px;padding:0 5px;font-size:11px;line-height:16px;border-radius:3px;color:#B26B00;background:#FFF3DC;border:1px solid #F3DFB8;vertical-align:1px;white-space:nowrap}
  .switch input:disabled + .track{opacity:.45;cursor:not-allowed}
  .switch input:disabled ~ span{cursor:not-allowed}

  /* 底部保存条 */
  .cfg-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #ECEFF2;flex-shrink:0;background:var(--bg-white)}
  .cfg-foot .foot-msg{margin-right:auto;font-size:12px;color:var(--text-tertiary)}
</style>
</head>
<body>

<!-- ===== 主内容区（顶部导航栏与左侧菜单栏由 框架.js 注入） ===== -->
<div class="main-area">

  <!-- 页面标签条（嵌入模式下隐藏，由壳子统一管理） -->
  <div class="tabbar">
    <div class="tab-item dashboard active" onclick="toast('当前已在「表单维护」页','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="16" x2="16" y2="16"/><line x1="8" y1="12" x2="12" y2="12"/></svg>
      表单维护
    </div>
    <div class="tab-item" onclick="toast('「必填与完整度规则」功能建设中','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      配置日志
      <span class="tab-close" onclick="event.stopPropagation();toast('关闭标签','info')">×</span>
    </div>
  </div>

  <div class="content">
    <div class="content-card">

      <!-- 页头 -->
      <div class="page-head">
        <h1>表单维护</h1>
      </div>

      <!-- 配置工作台 -->
      <div class="config-wrap">

        <!-- 左侧：业务表单列表 -->
        <div class="tree-pane">
          <div class="tree-search">
            <div class="search-input">
              <input id="formSearch" type="text" placeholder="搜索表单名称 / 模块" oninput="renderTree(this.value)">
            </div>
          </div>
          <div class="tree-scroll" id="treeScroll"></div>
        </div>

        <!-- 右侧：配置区 -->
        <div class="cfg-pane" id="cfgPane"></div>

      </div>
    </div>
  </div>
</div>

<!-- ===== 统一框架：顶部导航栏 + 左侧菜单栏（菜单配置见 框架.js） =====
     data-page    = 左侧菜单高亮项（独立打开时生效）
     data-embed   = "auto" 被壳子 iframe 内嵌时自动进入嵌入模式 -->
<script src="框架.js" data-page="form-maintenance" data-embed="auto"></script>

<script>
  /* ================= 业务表单配置模型（模拟数据，无后端） =================
   * 目录结构 1:1 对齐「档案维护」左侧档案目录：module = 档案维护分组名（空串 = 无分组的单列项），
   * 同一 module 内的表单顺序 = 档案维护目录中的顺序；字段（sections）从档案维护对应表单抽取。
   * props: key | name | module | enabled | sections[{g, fields[{k,n,r}]}] | fctx? | pf?
   *  - sections  = 表单字段分组，r = 该字段是否必填（抽取自档案维护端带 <i>*</i> 的标签）
   *  - fctx / pf = 随访分类 / 随访不佳设置（仅随访类表单具备，可选项）
   *  - 完整度按字段级统计：完整率 = 已填报字段 ÷ 完整度参与字段 × 100% */

  var DM = [
    {
      key: 'cover', name: '封面', module: '个人档案',
      enabled: true,
      sections: [
        { g: '档案标识', fields: [
          { k: 'f1', n: '档案编号', r: true }, { k: 'f2', n: '档案条码' }
        ] },
        { g: '居民基本信息', fields: [
          { k: 'f3', n: '姓名', r: true }, { k: 'f4', n: '性别', r: true }, { k: 'f5', n: '出生日期', r: true }, { k: 'f6', n: '身份证号', r: true },
          { k: 'f7', n: '民族' }, { k: 'f8', n: '联系电话', r: true }, { k: 'f9', n: '户籍地址' }, { k: 'f10', n: '现住址', r: true }
        ] },
        { g: '建档信息', fields: [
          { k: 'f11', n: '建档机构', r: true }, { k: 'f12', n: '建档日期', r: true }, { k: 'f13', n: '责任医生', r: true }, { k: 'f14', n: '建档医生' }
        ] }
      ]
    },
    {
      key: 'basic', name: '个人基本信息', module: '个人档案',
      enabled: true,
      sections: [
        { g: '个人健康标识', fields: [
          { k: 'f1', n: '人群标识' }, { k: 'f2', n: '慢病/重点疾病' }, { k: 'f3', n: '法定传染病' }, { k: 'f4', n: '体重情况' },
          { k: 'f5', n: 'ABO血型' }, { k: 'f6', n: 'RH血型' }, { k: 'f7', n: '姓名', r: true }, { k: 'f8', n: '性别', r: true },
          { k: 'f9', n: '证件类型', r: true }, { k: 'f10', n: '证件号', r: true }, { k: 'f11', n: '出生日期', r: true }, { k: 'f12', n: '工作单位/学校' },
          { k: 'f13', n: '籍贯', r: true }, { k: 'f14', n: '出生地', r: true }, { k: 'f15', n: '民族' }, { k: 'f16', n: '管理机构', r: true },
          { k: 'f17', n: '档案管理机构电话' }, { k: 'f18', n: '家庭医生是否签约' }, { k: 'f19', n: '家庭医生姓名' }, { k: 'f20', n: '家庭医生电话' },
          { k: 'f21', n: '本人电话', r: true }
        ] },
        { g: '紧急联系人', fields: [
          { k: 'f22', n: '联系人1', r: true }, { k: 'f23', n: '联系人2' }, { k: 'f24', n: '常住类型' }, { k: 'f25', n: '常住地址' },
          { k: 'f26', n: '文化程度', r: true }, { k: 'f27', n: '职业', r: true }, { k: 'f28', n: '婚姻状况', r: true }, { k: 'f29', n: '医疗费用支付方式', r: true },
          { k: 'f30', n: '个人健康凭证' }, { k: 'f31', n: '药物过敏史' }, { k: 'f32', n: '暴露史', r: true }
        ] },
        { g: '既往史', fields: [
          { k: 'f33', n: '疾病', r: true }, { k: 'f34', n: '手术' }, { k: 'f35', n: '外伤' }, { k: 'f36', n: '输血' },
          { k: 'f37', n: '预防接种史' }
        ] },
        { g: '家族史', fields: [
          { k: 'f38', n: '遗传病史' }, { k: 'f39', n: '残疾情况', r: true }, { k: 'f40', n: '村委会', r: true }, { k: 'f41', n: '人群性质' },
          { k: 'f42', n: '责任医生', r: true }, { k: 'f43', n: '建档单位' }, { k: 'f44', n: '建档人', r: true }, { k: 'f45', n: '建档日期', r: true }
        ] }
      ]
    },
    {
      key: 'healthCard', name: '健康信息卡', module: '个人档案',
      enabled: true,
      sections: [
        { g: '正面', fields: [
          { k: 'f1', n: '姓名' }, { k: 'f2', n: '性别' }, { k: 'f3', n: '出生日期' }, { k: 'f4', n: '健康档案编号' },

        { n: '发病诊断', k: 'infDiag', w: 45, on: true },
        { n: '报告信息', k: 'infReport', w: 25, on: true }
      ]
    }
  ];

  /* ================= 运行态：每次渲染从 DM 派生，改完写入 CFG，用于保存/重置 ================= */
  var CFG = {};          // key -> { enabled, req:{k:bool}, comp:{k:bool} }
  var COLLAPSE = {};     // formKey|groupName -> bool(已折叠)
  var ACTIVE = 'basic';  // 当前选中表单 key
  var TAB = 'required';  // 'required' | 'complete' | 'fctx' | 'pf'

  function initCfg(form) {
    var c = CFG[form.key] || (CFG[form.key] = {
      enabled: form.enabled,
      req: {}
    });
    // 字段必填态
    form.sections.forEach(function (sec) {
      (sec.fields || []).forEach(function (f) { if (c.req[f.k] === undefined) c.req[f.k] = !!f.r; });
    });
    // 完整度配置（字段级）：默认全部字段参与，必填字段强制参与
    if (c.comp === undefined) {
      c.comp = {};
      form.sections.forEach(function (sec) {
        (sec.fields || [{ k: sec.k, n: sec.n, r: sec.r }]).forEach(function (f) {
          c.comp[f.k] = true;
        });
      });
    }
    // 随访分类配置
    if (form.fctx && c.fctx === undefined) {
      c.fctx = { enabled: !!form.fctx.enabled, groups: {} };
      var gc = c.fctx.groups;
      Object.keys(form.fctx.groups).forEach(function (gk) {
        var g = form.fctx.groups[gk];
        gc[gk] = { label: g.label, threshold: g.threshold, ok: {}, no: {} };
        ['ok', 'no'].forEach(function (st) {
          Object.keys(g[st]).forEach(function (ik) {
            gc[gk][st][ik] = { op: g[st][ik].op, val: g[st][ik].val };
          });
        });
      });
    }
    // 随访不佳配置
    if (form.pf && c.pf === undefined) {
      c.pf = { enabled: !!form.pf.enabled, sel: (form.pf.opts || []).slice() };
    }
    return c;
  }

  function getForm(key) { for (var i = 0; i < DM.length; i++) if (DM[i].key === key) return DM[i]; return null; }

  /* ---- 工具：统计 ---- */
  function countFlat(form) { return form.sections.reduce(function (a, s) { return a + (s.fields ? s.fields.length : 1); }, 0); }
  function countReq(form, c) {
    return form.sections.reduce(function (a, s) {
      var list = s.fields || [{ k: s.k, n: s.n, r: s.r }];
      return a + list.filter(function (f) { return c.req[f.k]; }).length;
    }, 0);
  }
  function countSecOn(form, c) { return flatList(form).reduce(function (a, g) { return a + g.fields.filter(function (f) { return c.comp[f.k] || c.req[f.k]; }).length; }, 0); }
  function compPctOf(form, c) { return Math.round(countSecOn(form, c) / Math.max(1, countFlat(form)) * 100); }

  function flatList(form) {
    var out = [];
    form.sections.forEach(function (s) {
      var list = s.fields && s.fields.length ? s.fields : [{ k: s.k, n: s.n, r: s.r }];
      out.push({ g: s.g, fields: list });
    });
    return out;
  }

  /* ================= 左侧表单树 ================= */
  function renderTree(q) {
    q = (q || '').trim();
    var groups = {}, order = [];
    DM.forEach(function (f) {
      if (q && f.name.indexOf(q) < 0 && (f.module || '').indexOf(q) < 0 && f.key.indexOf(q) < 0) return;
      if (!groups[f.module]) { groups[f.module] = []; order.push(f.module); }
      groups[f.module].push(f);
    });
    var html = '';
    if (!order.length) { html = '<div class="tree-empty">未找到匹配的业务表单</div>'; }
    order.forEach(function (mod) {
      var list = groups[mod];
      if (mod) html += '<div class="tree-group-label">' + mod + '</div>';
      list.forEach(function (f) {
        var c = initCfg(f);
        var compCnt = countSecOn(f, c), reqCnt = countReq(f, c);
        html += '<div class="tree-item' + (f.key === ACTIVE ? ' active' : '') + (c.enabled ? '' : ' off') + '" data-key="' + f.key + '" onclick="selectForm(\'' + f.key + '\')" title="' + f.name + '">' +
          '<span class="tree-name">' + f.name + '</span>' +
          '<span class="tree-meta">' + compCnt + '完整度 ' + reqCnt + '必填</span>' +
          (c.enabled ? '' : '<span class="tree-off">停用</span>') +
        '</div>';
      });
    });
    document.getElementById('treeScroll').innerHTML = html;
  }

  /* ================= 右侧配置区 ================= */
  function selectForm(key) { ACTIVE = key; renderTree(document.getElementById('formSearch').value); renderCfg(); }

  function renderCfg() {
    var f = getForm(ACTIVE), c = initCfg(f);
    var total = countFlat(f), req = countReq(f, c), compOn = countSecOn(f, c), compPct = compPctOf(f, c);
    var pct = Math.round(req / total * 100);

    document.getElementById('cfgPane').innerHTML =
      /* 头部 */
      '<div class="cfg-head">' +
        '<div class="cfg-title"><h2>' + f.name + (f.module ? '【' + f.module + '】' : '') + '</h2></div>' +
        '<div class="cfg-actions">' +
          '<label class="switch cfg-enable"><input type="checkbox" ' + (c.enabled ? 'checked' : '') + ' onchange="toggleEnabled(this.checked)"><span class="track"></span>启用</label>' +
        '</div>' +
      '</div>' +
      /* 单行指标条 */
      '<div class="stat-strip">' +
        '<span class="ss-item"><label>字段总数</label><b>' + total + '</b></span>' +
        '<span class="ss-sep"></span>' +
        '<span class="ss-item"><label>已设必填</label><b>' + req + '</b><span class="ss-dim">/ ' + total + ' · ' + pct + '%</span></span>' +
        '<span class="ss-sep"></span>' +
        '<span class="ss-item"><label>完整度字段</label><b>' + compOn + ' / ' + total + '</b><span class="ss-dim">参与完整度</span></span>' +
        '<span class="ss-val">' +
          '<span class="ss-item"><label>参与占比</label><b class="' + (compPct ? 'ok' : 'no') + '">' + compPct + '%</b></span>' +
          '<span class="ss-chip ' + (compPct ? 'ok' : 'no') + '">' + (compPct ? '字段级统计' : '未配置参与字段') + '</span>' +
        '</span>' +
      '</div>' +
      /* 页签 */
      '<div class="cfg-tabs">' +
        '<div class="cfg-tab' + (TAB === 'required' ? ' active' : '') + '" onclick="switchTab(\'required\')">必填项配置<span class="tab-cnt ' + (req ? 'ok' : '') + '">' + req + '</span></div>' +
        '<div class="cfg-tab' + (TAB === 'complete' ? ' active' : '') + '" onclick="switchTab(\'complete\')">完整度配置<span class="tab-cnt ' + (compPct ? 'ok' : '') + '">' + compPct + '%</span></div>' +
        (f.fctx ? '<div class="cfg-tab' + (TAB === 'fctx' ? ' active' : '') + '" onclick="switchTab(\'fctx\')">随访分类设置' + (c.fctx && c.fctx.enabled ? '<span class="tab-cnt ok">已启用</span>' : '<span class="tab-cnt warn">未启用</span>') + '</div>' : '') +
        (f.pf ? '<div class="cfg-tab' + (TAB === 'pf' ? ' active' : '') + '" onclick="switchTab(\'pf\')">随访不佳设置' + (c.pf && c.pf.sel && c.pf.sel.length ? '<span class="tab-cnt ok">' + c.pf.sel.length + '项</span>' : '<span class="tab-cnt warn">未设置</span>') + '</div>' : '') +
      '</div>' +
      '<div class="tab-body" id="tabBody"></div>' +
      /* 底部 */
      '<div class="cfg-foot">' +
        '<span class="foot-msg">配置保存后立即生效，将同步作用于「档案维护」中的建档与随访校验</span>' +
        '<button class="btn btn-default" onclick="resetConfig()">重置</button>' +
        '<button class="btn btn-primary" onclick="saveConfig()">保存配置</button>' +
      '</div>';

    renderTab();
  }

  function renderTab() {
    var f = getForm(ACTIVE), c = initCfg(f);
    var body = document.getElementById('tabBody');
    if (TAB === 'complete') { renderCompleteTab(f, c); }
    else if (TAB === 'fctx') { renderFctxTab(f, c); }
    else if (TAB === 'pf') { renderPfTab(f, c); }
    else { renderRequiredTab(f, c); }
  }

  /* ---- 必填项页签 ---- */
  function renderRequiredTab(f, c) {
    var groups = flatList(f);
    var html = '';
    groups.forEach(function (g, gi) {
      var on = g.fields.filter(function (a) { return c.req[a.k]; }).length;
      var collapsed = !!COLLAPSE[f.key + '|' + g.g];
      html += '<div class="req-group' + (collapsed ? ' collapsed' : '') + '">' +
        '<div class="req-ghead" onclick="toggleGroup(\'' + g.g + '\')">' +
        '<svg class="grp-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>' +
        '<span>' + g.g + '</span>' +
        '<span class="gcnt">' + on + '/' + g.fields.length + ' 必填</span>' +
        '<span class="grp-btns">' +
          '<button class="grp-all" onclick="event.stopPropagation();checkAllGroup(\'' + g.g + '\', true)">全选</button>' +
          '<button class="grp-all clean" onclick="event.stopPropagation();checkAllGroup(\'' + g.g + '\', false)">清空</button>' +
        '</span></div>';
      html += '<div class="req-group-body"><div class="req-grid">';
      g.fields.forEach(function (fd) {
        var isReq = !!c.req[fd.k];
        html += '<div class="req-cell' + (isReq ? ' req-true' : '') + '">' +
          '<label class="req-label" title="' + fd.n + '"><span class="req-flag">*</span>' + fd.n + '</label>' +
          '<label class="switch req-switch"><input type="checkbox" ' + (isReq ? 'checked' : '') + ' onchange="toggleReq(\'' + fd.k + '\', this.checked)"><span class="track"></span></label>' +
          '</div>';
      });
      html += '</div></div></div>';
    });
    document.getElementById('tabBody').innerHTML = html;
  }

  function toggleGroup(g) {
    var k = ACTIVE + '|' + g;
    COLLAPSE[k] = !COLLAPSE[k];
    renderTab();
  }

  function checkAllGroup(g, val) {
    var f = getForm(ACTIVE), c = initCfg(f);
    flatList(f).forEach(function (gr) {
      if (gr.g === g) gr.fields.forEach(function (fd) { c.req[fd.k] = val; if (val) c.comp[fd.k] = true; });
    });
    renderCfg();
  }

  function toggleReq(fk, val) {
    var c = initCfg(getForm(ACTIVE));
    c.req[fk] = val;
    if (val) c.comp[fk] = true;
    renderCfg();
  }

  /* ---- 完整度页签（字段级） ---- */
  function renderCompleteTab(f, c) {
    var total = countFlat(f), compOn = countSecOn(f, c);
    var groups = flatList(f);
    var html = '';
    groups.forEach(function (g) {
      var on = g.fields.filter(function (a) { return c.comp[a.k]; }).length;
      var collapsed = !!COLLAPSE[f.key + '|' + g.g];
      html += '<div class="req-group' + (collapsed ? ' collapsed' : '') + '">' +
        '<div class="req-ghead" onclick="toggleGroup(\'' + g.g + '\')">' +
        '<svg class="grp-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>' +
        '<span>' + g.g + '</span>' +
        '<span class="gcnt">' + on + '/' + g.fields.length + ' 参与</span>' +
        '</div>';
      html += '<div class="req-group-body"><div class="req-grid">';
      g.fields.forEach(function (fd) {
        var locked = !!c.req[fd.k];
        var isComp = !!c.comp[fd.k] || locked;
        html += '<div class="req-cell' + (isComp ? ' req-true' : '') + '">' +
          '<label class="req-label" title="' + fd.n + (locked ? '（必填字段，强制参与完整度）' : '') + '">' +
            '<span class="req-flag">' + (locked ? '锁' : '') + '</span>' + fd.n +
            (locked ? '<span class="comp-lock">必填</span>' : '') +
          '</label>' +
          '<label class="switch req-switch"><input type="checkbox" ' + (isComp ? 'checked' : '') + (locked ? ' disabled' : '') + ' onchange="toggleComp(\'' + fd.k + '\', this.checked)"><span class="track"></span></label>' +
          '</div>';
      });
      html += '</div></div></div>';
    });

    document.getElementById('tabBody').innerHTML =
      '<div class="comp-toolbar">' +
        '<span class="hint">完整率 = 已填报字段 ÷ 完整度配置字段 × 100%。必填字段强制参与完整度（锁定，不可取消）；非必填字段可自由勾选是否参与。</span>' +
        '<span class="comp-tools">' +
          '<span class="comp-sum"><span class="lbl">参与字段</span>' +
          '<span class="sum-val ' + (compOn ? 'ok' : 'no') + '">' + compOn + ' / ' + total + '</span>' +
          '</span>' +
          '<button class="btn btn-default btn-xs" onclick="restoreComp()" title="恢复为该表单的默认完整度参与字段（全部参与）">恢复默认</button>' +
        '</span>' +
      '</div>' + html;
  }

  function toggleComp(fk, val) {
    var c = initCfg(getForm(ACTIVE));
    c.comp[fk] = val;
    renderCfg();
  }
  function restoreComp() {
    var f = getForm(ACTIVE), c = initCfg(f);
    c.comp = undefined; initCfg(f);
    renderCompleteTab(f, c);
    toast('已恢复「' + f.name + '」的默认完整度字段（全部字段参与）', 'info');
  }

  /* ---- 随访分类页签 ---- */
  function renderFctxTab(f, c) {
    if (!f.fctx) { document.getElementById('tabBody').innerHTML = '<div class="fctx-none">该表单项不适用随防分类自动判定配置</div>'; return; }
    var fc = c.fctx;
    // 判定口径由数据决定（收缩压/舒张压 → 血压；空腹血糖 → 血糖）
    var isHtn = !!(fc.groups.elderly && fc.groups.elderly.ok && fc.groups.elderly.ok.sbp);
    var hint = isHtn
      ? '录入随访表收缩压/舒张压后，系统按居民年龄（65 岁为界）与下方判定条件自动回填「此次随访分类」。'
      : '录入随访表空腹血糖后，系统按居民年龄（65 岁为界）与下方判定条件自动回填「此次随访分类」。';
    function condRows(gk, g, stat) {
      var rows = '';
      var add = function (ik, metric, unit) {
        var cond = g[stat][ik];
        rows += '<div class="fctx-cond">' +
          '<span class="fctx-metric">' + metric + '</span>' +
          '<select class="fctx-op" data-op="' + gk + '_' + stat + '_' + ik + '" onchange="setFctxOp(this)">' +
            '<option value="&lt;"' + (cond.op === '<' ? ' selected' : '') + '>&lt;</option>' +
            '<option value="&lt;="' + (cond.op === '<=' ? ' selected' : '') + '>≤</option>' +
            '<option value="&gt;"' + (cond.op === '>' ? ' selected' : '') + '>&gt;</option>' +
            '<option value="&gt;="' + (cond.op === '>=' ? ' selected' : '') + '>≥</option>' +
          '</select>' +
          '<input class="fctx-val" type="number" value="' + cond.val + '" oninput="setFctxVal(\'' + gk + '\',\'' + stat + '\',\'' + ik + '\',this.value)">' +
          '<span class="fctx-unit">' + unit + '</span>' +
        '</div>';
      };
      if (isHtn) { add('sbp', '收缩压', 'mmHg'); add('dbp', '舒张压', 'mmHg'); }
      else { add('fbg', '空腹血糖', 'mmol/L'); }
      return rows;
    }

    var cards = '';
    ['elderly', 'young'].forEach(function (gk) {
      var g = fc.groups[gk];
      var r = gk === 'elderly';
      cards += '<div class="fctx-card">' +
        '<div class="fctx-card-head">' +
          '<span class="fctx-age-ico ' + (r ? 'eld' : 'nyg') + '">' + (r ? '老' : '成') + '</span>' +
          '<span class="fctx-age-name">' + g.label + '</span>' +
          '<span class="fctx-age-rule">' + (r ? '≥' + g.threshold + ' 岁' : '< ' + g.threshold + ' 岁') + '</span>' +
        '</div>' +
        '<div class="fctx-card-body">' +
          '<div class="fctx-col ok-col">' +
            '<div class="fctx-col-head"><span class="dot"></span>控制满意 · 自动判定条件</div>' +
            condRows(gk, g, 'ok') +
          '</div>' +
          '<div class="fctx-col no-col">' +
            '<div class="fctx-col-head"><span class="dot"></span>控制不满意 · 自动判定条件</div>' +
            condRows(gk, g, 'no') +
          '</div>' +
        '</div>' +
      '</div>';
    });

    document.getElementById('tabBody').innerHTML =
      '<div class="fctx-head">' +
        '<span class="fctx-hint">' + hint + '</span>' +
        '<span class="fctx-tools">' +
          '<span class="fctx-sum"><span class="lbl">判定依据</span><span class="sum-val">' + (isHtn ? '收缩压 / 舒张压' : '空腹血糖') + '</span></span>' +
          '<button class="btn btn-default btn-xs" onclick="restoreFctx()" title="恢复为该表单的默认随防分类阈值">恢复默认阈值</button>' +
        '</span>' +
      '</div>' +
      '<div class="fctx-cards">' + cards + '</div>';
  }

  function setFctxOp(el) {
    var parts = el.getAttribute('data-op').split('_'); // gk, stat, key
    var gk = parts[0], stat = parts[1] === 'ok' ? 'ok' : 'no', key = parts[2];
    var v = el.value;
    var c = initCfg(getForm(ACTIVE)).fctx;
    c.groups[gk][stat][key].op = v;
  }
  function setFctxVal(gk, stat, key, raw) {
    var v = Number(raw); if (isNaN(v)) v = 0;
    var c = initCfg(getForm(ACTIVE)).fctx;
    c.groups[gk][stat][key].val = v;
  }
  function restoreFctx() {
    var f = getForm(ACTIVE), c = initCfg(f);
    c.fctx = undefined; initCfg(f);
    renderFctxTab(f, c);
    toast('已恢复「' + f.name + '」的默认随防分类阈值', 'info');
  }

  /* ---- 随访不佳页签 ---- */
  var PF_OPTS = ['控制满意', '控制不满意', '不良反应', '并发症'];
  function renderPfTab(f, c) {
    if (!f.pf) { document.getElementById('tabBody').innerHTML = '<div class="fctx-none">该表单项不适用随访不佳设置</div>'; return; }
    var p = c.pf;
    var checks = '';
    PF_OPTS.forEach(function (o) {
      checks += '<label class="pf-check"><input type="checkbox" value="' + o + '"' + (p.sel.indexOf(o) > -1 ? ' checked' : '') + ' onchange="setPfSel(this)">' + o + '</label>';
    });
    var tip = p.sel.length
      ? '当前判定：随访表中「此次随访分类」为「' + p.sel.join('、') + '」的记录将被标记为随访不佳，进入「计划提醒-随访不佳提醒」待处理列表。'
      : '未勾选任何分类：随访不佳提醒不会生成（按系统默认口径，仅提示口径未配置）。';

    document.getElementById('tabBody').innerHTML =
      '<div class="fctx-head">' +
        '<span class="fctx-hint">勾选「此次随访分类」中的分类作为随访不佳判定依据。随访记录匹配所选分类时，自动生成随访不佳提醒，供医生在「计划提醒-随访不佳提醒」中处置。</span>' +
        '<span class="fctx-tools">' +
          '<span class="fctx-sum"><span class="lbl">当前设置</span><span class="sum-val">' + (p.sel.length ? p.sel.length + ' 项' : '未设置') + '</span></span>' +
          '<button class="btn btn-default btn-xs" onclick="restorePf()" title="恢复为该表单的默认随访不佳分类">恢复默认</button>' +
        '</span>' +
      '</div>' +
      '<div class="pf-card">' +
        '<div class="pf-card-head">随访不佳判定配置</div>' +
        '<div class="pf-row">' +
          '<label class="pf-label">随访类型名称：</label>' +
          '<select class="pf-select" onchange="switchPfType(this)">' +
            '<option value="followup"' + (ACTIVE === 'followup' ? ' selected' : '') + '>高血压</option>' +
            '<option value="dmFollowup"' + (ACTIVE === 'dmFollowup' ? ' selected' : '') + '>糖尿病</option>' +
          '</select>' +
        '</div>' +
        '<div class="pf-row">' +
          '<label class="pf-label"><i>*</i>此次随访分类：</label>' +
          '<div class="pf-checks">' + checks + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="pf-tip">' + tip + '</div>';
  }
  function setPfSel(el) {
    var p = initCfg(getForm(ACTIVE)).pf;
    var v = el.value;
    if (el.checked) { if (p.sel.indexOf(v) < 0) p.sel.push(v); }
    else { var i = p.sel.indexOf(v); if (i > -1) p.sel.splice(i, 1); }
  }
  function switchPfType(el) { if (el.value && el.value !== ACTIVE) selectForm(el.value); }
  function restorePf() {
    var f = getForm(ACTIVE), c = initCfg(f);
    c.pf = undefined; initCfg(f);
    renderPfTab(f, c);
    toast('已恢复「' + f.name + '」的默认随访不佳分类', 'info');
  }

  /* ---- 页签切换 / 表单操作 ---- */
  function switchTab(t) { TAB = t; renderCfg(); }
  function toggleEnabled(val) {
    initCfg(getForm(ACTIVE)).enabled = val;
    toast(val ? '该表单已启用' : '该表单已停用，业务端将隐藏/只读', val ? 'success' : 'warning');
  }

  function saveConfig() {
    var f = getForm(ACTIVE), c = initCfg(f);
    var req = countReq(f, c), comp = countSecOn(f, c), total = countFlat(f);
    if (!c.enabled) { toast('该表单已停用，无法保存配置', 'warning'); return; }
    toast('配置已保存：「' + f.name + '」共 ' + req + ' 个必填项、' + comp + '/' + total + ' 个完整度参与字段（完整率 = 已填报字段 ÷ 参与字段 × 100%）', 'success');
  }

  function resetConfig() {
    CFG[ACTIVE] = undefined;
    renderCfg();
    toast('已重置「' + getForm(ACTIVE).name + '」为系统默认配置', 'info');
  }

  /* ================= 初始渲染 ================= */
  renderTree('');
  renderCfg();
</script>

</body>
</html>
