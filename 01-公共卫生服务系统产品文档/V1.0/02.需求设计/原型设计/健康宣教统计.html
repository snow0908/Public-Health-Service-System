<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康宣教统计 - 业务统计</title>
<link rel="stylesheet" href="框架.css">
<style>
  html.embed-mode .main-area{height:100%}
  html.embed-mode .tabbar{display:none}
  html.embed-mode .toast{top:24px}

  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}

  /* ===== 页头 ===== */
  .page-head .right .btn{height:30px;padding:0 14px;font-size:13px}

  /* ===== 统计 TAB（卡片式标签：底部基准线 + 选中项描边并与内容区连通） ===== */
  .stat-tabs{display:flex;flex-wrap:wrap;padding:14px 16px 0;border-bottom:1px solid var(--color-neutral-300);flex-shrink:0;background:var(--bg-white)}
  .stat-tab{height:34px;padding:0 22px;margin-right:-1px;border:1px solid var(--color-neutral-300);border-bottom:0;border-radius:3px 3px 0 0;background:var(--bg-white);color:#404040;font-size:14px;cursor:pointer;transition:color var(--transition-fast),border-color var(--transition-fast);display:inline-flex;align-items:center;white-space:nowrap}
  .stat-tab:hover{color:var(--primary);border-color:var(--primary)}
  .stat-tab.active{position:relative;z-index:1;margin-bottom:-1px;color:var(--primary);border-color:var(--primary)}

  /* ===== 筛选区 ===== */
  .filter-panel{padding:14px 16px 0;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-bottom:14px}
  .filter-item{display:flex;align-items:center;gap:12px}
  .filter-item label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
  .fi-ctl{width:180px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-select{width:180px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fi-ctl:focus,.fi-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  .fi-select.is-placeholder{color:var(--text-placeholder)}
  /* 筛选区内复合控件统一外框宽度 180px（框架.css 默认 190px） */
  .filter-panel .fcp-ms,.filter-panel .fcp-mst{width:180px}
  /* 重点人群类型：关系符（且/或）窄下拉 86px（设计稿实测 97 → ÷1.1 ≈ 88） */
  .fi-select-relation{width:86px}
  .fi-pair{gap:6px}
  /* 设计稿盒内「已选择（N）｜ v」：分隔竖线，仅在有值时出现（空态只留「请选择」） */
  .fcp-mst .fcp-sep{display:none;width:1px;height:14px;background:var(--color-neutral-300);flex-shrink:0}
  .filter-panel .fcp-mst.has-val .fcp-sep{display:block}
  /* 设计稿该控件盒内为「文本 ｜ 箭头」，无清除按钮（清除走「重置」） */
  .filter-panel .fcp-mst .fcp-clear{display:none}
  /* 面板选项行高对齐设计稿（约 32~33px；框架默认 35px） */
  .filter-panel .fcp-opt{padding:6px 12px}
  /* 设计稿 8 项全部可见、无滚动条（框架 max-height:238px 会截断第 8 项） */
  .filter-panel .fcp-mst .fcp-panel{max-height:none}
  /* 日期区间：单一外框（开始日期 ~ 结束日期 + 日历图标） */
  .fi-range{display:flex;align-items:center;gap:6px;width:232px;height:32px;padding:0 8px 0 10px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);background:var(--bg-white);transition:all var(--transition-fast)}
  .fi-range:hover{border-color:var(--primary)}
  .fi-range:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-range input{flex:1 1 0;min-width:0;height:30px;border:none;background:transparent;outline:none;padding:0;font-size:14px;color:var(--text-primary);font-family:inherit}
  .fi-range input::placeholder{color:var(--text-placeholder)}
  .fi-range input::-webkit-calendar-picker-indicator{display:none}
  .fi-tilde{flex-shrink:0;font-size:14px;color:var(--text-placeholder)}
  .fi-cal{width:14px;height:14px;flex-shrink:0;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14' fill='none' stroke='%23bfbfbf' stroke-width='1.2'%3E%3Crect x='1.4' y='2.4' width='11.2' height='10.2' rx='1.6'/%3E%3Cpath d='M1.4 5.6h11.2M4.6 1.4v2M9.4 1.4v2'/%3E%3C/svg%3E") no-repeat center/contain}
  .filter-btns{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}
  .list-tbl th:last-child,.list-tbl td:last-child{position:sticky;right:0}
  .list-tbl td:last-child{z-index:2;background-color:var(--bg-white)}
  .list-tbl th:last-child{z-index:6}
  .list-tbl{width:100%;min-width:1200px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:36px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:36px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:nth-child(even) td{background:var(--bg-table-even)}
  .list-tbl tbody tr:hover td{background:var(--primary-bg)}
  .table-wrap.hs-scrolled .list-tbl thead th:last-child,
  .table-wrap.hs-scrolled .list-tbl tbody tr td:last-child{
    background-image:linear-gradient(to right,rgba(0,0,0,0.10),rgba(0,0,0,0));
    background-repeat:no-repeat;background-size:9px 100%;background-position:left center;
  }
  .list-tbl .center{text-align:center}
  .list-tbl .num{font-family:Consolas,'Microsoft YaHei',monospace;text-align:right}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .op-link{color:var(--primary);cursor:pointer;font-size:13px}
  .op-link:hover{text-decoration:underline}
  .op-gap{display:inline-block;width:8px}
  .dash{color:var(--text-placeholder)}

  /* 空状态 */
  .empty-td{height:200px;text-align:center;color:var(--text-tertiary)}
  .empty-box{display:inline-flex;flex-direction:column;align-items:center;gap:10px}
  .empty-box svg{width:56px;height:56px;stroke:#C9CFD8;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .empty-box p{font-size:13px;color:var(--text-placeholder)}

  /* ===== 分页 ===== */
  .page-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;height:44px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .pg-size select{height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 22px 0 8px;font-size:13px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer}
  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}
  .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .pg-btn.disabled{color:var(--text-disabled);cursor:not-allowed;border-color:#EBEBEB}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
</style>
</head>

  /* 日期区间内的输入框：聚焦时切原生 date 并唤起选择器，失焦且为空则还原为文本占位 */
  function pickDate(el) { el.type = 'date'; try { el.showPicker(); } catch (e) { } }
  function blurDate(el) { if (!el.value) el.type = 'text'; }

  function filterItemHtml(f) {
    var ph = f.ph || '';
    var label = f.noLabel ? '' : f.label + '：';
    if (f.type === 'select') {
      var cls = 'fi-select is-placeholder' + (f.cls ? ' ' + f.cls : '');
      return '<div class="filter-item"><label>' + label + '</label><select class="' + cls + '" data-k="' + f.key + '" onchange="markSelect(this);filterRows()">' + opts(f.opts) + '</select></div>';
    }
    if (f.type === 'daterange') {
      return '<div class="filter-item"><label>' + f.label + '：</label>'
        + '<span class="fi-range">'
        + '<input type="text" placeholder="开始日期" data-k="' + f.key + '-start" onfocus="pickDate(this)" onblur="blurDate(this)" oninput="filterRows()">'
        + '<span class="fi-tilde">~</span>'
        + '<input type="text" placeholder="结束日期" data-k="' + f.key + '-end" onfocus="pickDate(this)" onblur="blurDate(this)" oninput="filterRows()">'
        + '<span class="fi-cal"></span>'
        + '</span></div>';
    }
    if (f.type === 'fcpms') {
      /* 多选（复选框）复合控件：如「宣教机构」——列表为机构树顶层机构 */
      var dopts = f.opts ? ' data-options="' + f.opts.join('|') + '"' : '';
      return '<div class="filter-item"><label>' + f.label + '：</label>'
        + '<div class="fcp-ms" data-fcp="ms"' + dopts + '>'
        + '<div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>'
        + '<div class="fcp-panel"></div>'
        + '<input type="hidden" class="fcp-val" id="' + f.id + '" data-k="' + f.key + '">'
        + '</div></div>';
    }
    if (f.type === 'fcpmst') {
      /* 关系符（且/或）+ 多选（对勾）复合控件：如「重点人群类型」 */
      var dopts2 = f.opts ? ' data-options="' + f.opts.join('|') + '"' : '';
      return '<div class="filter-item"><label>' + f.label + '：</label>'
        + '<div class="filter-item fi-pair">'
        + '<select class="fi-select fi-select-relation" data-k="' + f.relKey + '" onchange="filterRows()">'
        + '<option value="and">且</option><option value="or">或</option></select>'
        + '<div class="fcp-mst" data-fcp="mst" data-caret' + dopts2 + '>'
        + '<div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span><span class="fcp-sep"></span></div>'
        + '<div class="fcp-panel"></div>'
        + '<input type="hidden" class="fcp-val" id="' + f.id + '" data-k="' + f.key + '">'
        + '</div></div></div>';
    }
    return '<div class="filter-item"><label>' + label + '</label><input class="fi-ctl" placeholder="' + ph + '" data-k="' + f.key + '" oninput="filterRows()"></div>';
  }

  function renderFilter() {

          + '<button class="btn btn-primary" onclick="queryFilter()">查询</button></div>';

    $('filterPanel').innerHTML = html;
    /* 面板是动态重建的，需重新初始化复合控件（机构多选/重点人群多选）并重绑实时过滤 */
    if (window.fcpInit) window.fcpInit();
    $('filterPanel').querySelectorAll('[data-fcp]').forEach(function (el) {
      /* 勾选复选框走 change；点击整行对勾走 click。框架用 document 级委托且不阻断冒泡，故在此可拿到 */
      el.addEventListener('change', function () { setTimeout(filterRows, 0); });

      });

  }

  /* 按 data-k 取各控件当前值再逐条过滤：避免「日期区间占两个输入框」导致的下标错位 */
  function filterRows() {
    var t = TABS[curTab];
    var v = {};
    $('filterPanel').querySelectorAll('[data-k]').forEach(function (el) {
      v[el.getAttribute('data-k')] = el.value ? String(el.value).trim() : '';
    });
    var defs = [];
    t.filters.forEach(function (rd) { rd.items.forEach(function (f) { defs.push(f); }); });

    curRows = t.rows.filter(function (r) {
      return defs.every(function (f) {
        if (f.type === 'daterange') {
          var s = v[f.key + '-start'] || '', e = v[f.key + '-end'] || '';
          if (!s && !e) return true;
          var dv = f.field ? r[f.field] : '';
          if (!dv) return true;   /* 汇总维度（按机构/按模板）无日期字段，不参与日期过滤 */
          if (s && dv < s) return false;
          if (e && dv > e) return false;
          return true;
        }
        /* 机构多选：任一命中即保留；机构名在不同维度下写法不同，按双向包含匹配 */
        if (f.type === 'fcpms') {
          var orgs = (v[f.key] || '').split(',').filter(Boolean);
          if (!orgs.length) return true;
          var rvOrg = r[f.field || f.key];
          if (rvOrg === undefined || rvOrg === null) return true;
          var rsOrg = String(rvOrg);
          if (rsOrg === '') return false;
          return orgs.some(function (x) { return rsOrg === x || rsOrg.indexOf(x) !== -1 || x.indexOf(rsOrg) !== -1; });
        }
        /* 重点人群类型：多选 + 且/或关系（数据侧为多值数组） */
        if (f.type === 'fcpmst') {
          var selC = (v[f.key] || '').split(',').filter(Boolean);
          if (!selC.length) return true;
          var arrC = r[f.field || f.key] || [];
          if (!arrC.length) return false;
          return (v[f.relKey] === 'or')
            ? selC.some(function (x) { return arrC.indexOf(x) !== -1; })
            : selC.every(function (x) { return arrC.indexOf(x) !== -1; });
        }
        var q = v[f.key] || '';
        if (!q) return true;
        /* field 用于「控件 key ≠ 数据字段名」的场景，如 重点人群类型 pop1 → 数据字段 pop */
        var rv = r[f.field || f.key];
        /* 该行不含此维度（undefined/null）→ 不参与过滤；有维度但为空串 → 视为不匹配 */
        if (rv === undefined || rv === null) return true;
        var rs = String(rv);
        if (rs === '') return false;   /* 该行此维度为空值，不匹配 */
        if (f.type === 'input') return rs.toLowerCase().indexOf(q.toLowerCase()) !== -1;
        /* 下拉：同一机构在不同汇总维度下写法不同（带/不带「扬州市江都区」前缀），按双向包含匹配 */
        return rs === q || rs.indexOf(q) !== -1 || q.indexOf(rs) !== -1;
      });
    });
    renderTable();
  }

  function resetFilter() {
    $('filterPanel').querySelectorAll('[data-k]').forEach(function (el) {
      if (el.classList.contains('fi-select-relation')) { el.value = 'and'; }
      else if (el.tagName === 'SELECT') { el.value = ''; markSelect(el); }
      else { el.value = ''; if (el.type === 'date') el.type = 'text'; }
    });
    filterRows();
    toast('已重置', 'info');
  }

  function queryFilter() {
    filterRows();
    toast('查询完成，共 ' + $('total').textContent + ' 条记录', 'success');
  }

  function switchTab(k) {
    curTab = k;
    curRows = TABS[k].rows.slice();
    renderTabs();
    renderFilter();
    renderTable();
    var wrap = $('tableWrap');
    if (wrap.scrollLeft) { wrap.scrollLeft = 0; updShadow(); }
  }

  /* ================= 操作列冻结阴影 ================= */
  function updShadow() {
    var wrap = $('tableWrap');
    wrap.classList.toggle('hs-scrolled', wrap.scrollLeft > 0);
  }

  /* ================= 初始化 ================= */
  switchTab('org');
  (function () {
    var wrap = $('tableWrap');
    wrap.addEventListener('scroll', updShadow, { passive: true });
    window.addEventListener('resize', updShadow);
    updShadow();
  })();

  /* 便于评审 / 截图：?tab=org|tpl|detail */
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('tab');
    if (t && TABS[t]) switchTab(t);
  })();
</script>

</body>
</html>
