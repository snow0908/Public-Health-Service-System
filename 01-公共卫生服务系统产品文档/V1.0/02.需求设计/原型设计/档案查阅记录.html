<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>档案查阅记录 - 档案管理</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 档案查阅记录页面特有样式（设计变量与公共样式见 框架.css） ===== */

  /* ===== 嵌入模式（被 index.html 壳子以 iframe 内嵌时，框架.js 自动加 html.embed-mode） ===== */
  html.embed-mode .main-area{height:100%}
  html.embed-mode .tabbar{display:none}
  html.embed-mode .toast{top:24px}

  /* ===== 布局 ===== */
  #listView{display:flex;flex-direction:column;flex:1;min-height:0}
  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-height:0;min-width:0}

  /* ===== 筛选区 ===== */
  .filter-panel{padding:14px 12px 0;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-row{display:flex;flex-wrap:wrap;gap:12px 16px;margin-bottom:14px;align-items:center}
  .filter-item{display:flex;align-items:center;gap:8px}
  .filter-item label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
  .fi-ctl{width:200px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-ctl:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  .filter-btns{margin-left:auto;display:flex;gap:8px;align-items:center}

  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}
  .list-tbl{width:100%;min-width:1200px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:38px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:38px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:hover td{background:var(--primary-bg)}
  .list-tbl th.center,.list-tbl td.center{text-align:center}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 查阅表单徽标 */
  .form-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;background:#E6F7FF;color:#1890FF;border:1px solid #91D5FF}

  /* ===== 分页 ===== */
  .page-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;height:52px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .pg-size select{height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 22px 0 8px;font-size:13px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer}
  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}
  .pg-btn:hover{border-color:var(--primary);color:var(--primary)}
  .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .pg-more{color:var(--text-tertiary);padding:0 2px}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
  .pg-jump input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
</style>
</head>
<body>

<!-- ===== 主内容区（顶部导航栏与左侧菜单栏由 框架.js 注入） ===== -->
<div class="main-area">

  <!-- 页面标签条（嵌入模式下隐藏，由壳子统一管理） -->
  <div class="tabbar">
    <div class="tab-item active" onclick="toast('当前已在「档案查阅记录」页','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      档案查阅记录
    </div>
  </div>

  <div class="content">
    <div class="content-card">
      <div id="listView">

        <!-- 页头 -->
        <div class="page-head">
          <h1>档案查阅记录</h1>
        </div>

        <!-- 筛选区 -->
        <div class="filter-panel">
          <div class="filter-row">
            <div class="filter-item"><label>姓名</label><input id="fName" class="fi-ctl" placeholder="请输入"></div>
            <div class="filter-item"><label>证件号</label><input id="fIdcard" class="fi-ctl" placeholder="请输入"></div>
            <div class="filter-item"><label>档案编号</label><input id="fArchiveNo" class="fi-ctl" placeholder="请输入"></div>
            <div class="filter-item"><label>查阅人</label><input id="fReviewer" class="fi-ctl" placeholder="请输入"></div>
            <div class="filter-btns">
              <button class="btn btn-default" onclick="resetFilter()">重置</button>
              <button class="btn btn-primary" onclick="applyFilter()">查询</button>
            </div>
          </div>
        </div>

        <!-- 数据表格 -->
        <div class="table-wrap">
          <table class="list-tbl">
            <colgroup>
              <col style="width:50px">
              <col style="width:100px">
              <col style="width:120px">
              <col style="width:100px">
              <col style="width:100px">
              <col style="width:180px">
              <col style="width:180px">
              <col style="width:160px">
              <col style="width:200px">
            </colgroup>
            <thead>
              <tr>
                <th class="center">序号</th>
                <th>查阅人员</th>
                <th>查阅表单</th>
                <th>姓名</th>
                <th>证件类型</th>
                <th>证件号</th>
                <th>档案编号</th>
                <th>查阅时间</th>
                <th>查阅机构</th>
              </tr>
            </thead>
            <tbody id="tbBody"></tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div class="page-foot">
          <span class="pg-total">共 <b id="pgTotal">0</b> 条</span>
          <span class="pg-size">
            <select onchange="toast('原型演示：每页条数固定 20 条','info')">
              <option selected>20条/页</option>
              <option>50条/页</option>
              <option>100条/页</option>
            </select>
          </span>
          <span class="pg-pager" id="pagerBox"></span>
          <span class="pg-jump">跳至第 <input id="pgJump" value="1" onkeydown="if(event.key==='Enter'){toast('原型演示：仅演示第 1 页','info')}"> 页</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 统一框架：顶部导航栏 + 左侧菜单栏（菜单配置见 框架.js） =====
     data-page    = 左侧菜单高亮项（独立打开时生效）
     data-embed   = "auto" 被壳子 iframe 内嵌时自动进入嵌入模式 -->
<script src="框架.js" data-page="archive-access-records" data-embed="auto"></script>

    { reviewer:'沈卉',   form:'妇女保健档案', name:'何桂芳', idType:'身份证号',   idcard:'321088194402110026', archiveNo:'32101210010000319', time:'2024-12-08 09:14:30', org:'扬州市江都区小纪中心卫生院' },
    { reviewer:'顾海燕', form:'个人基本信息', name:'张晓晓', idType:'出生医学证明', idcard:'321088202105150022', archiveNo:'32101210010000317', time:'2024-11-20 13:40:18', org:'扬州市江都区仙女社区卫生服务中心' },
    { reviewer:'田川',   form:'儿童保健',     name:'李小明', idType:'居民身份证', idcard:'321088201903200011', archiveNo:'32101210010000316', time:'2024-10-05 10:25:55', org:'扬州市江都区小纪中心卫生院' }
  ];

  /* ================= 工具函数 ================= */
  function $(id) { return document.getElementById(id); }
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ================= 主表渲染 ================= */
  function renderTable() {
    var name = $('fName').value.trim();
    var idcard = $('fIdcard').value.trim();
    var archiveNo = $('fArchiveNo').value.trim();
    var reviewer = $('fReviewer').value.trim();

    var list = logData.filter(function (r) {
      if (name && r.name.indexOf(name) === -1) return false;
      if (idcard && r.idcard.indexOf(idcard) === -1) return false;
      if (archiveNo && r.archiveNo.indexOf(archiveNo) === -1) return false;
      if (reviewer && r.reviewer.indexOf(reviewer) === -1) return false;
      return true;
    });

    var html = '';
    if (list.length === 0) {
      html = '<tr class="empty-row"><td colspan="9"><div class="ico" style="font-size:32px;margin-bottom:8px">📭</div>暂无符合条件的查阅记录</td></tr>';
    } else {
      list.forEach(function (r, i) {
        html += '<tr>'
          + '<td class="center">' + (i + 1) + '</td>'
          + '<td>' + esc(r.reviewer) + '</td>'
          + '<td><span class="form-tag">' + esc(r.form) + '</span></td>'
          + '<td>' + esc(r.name) + '</td>'
          + '<td>' + esc(r.idType) + '</td>'
          + '<td title="' + esc(r.idcard) + '"><span class="cell">' + esc(r.idcard) + '</span></td>'
          + '<td title="' + esc(r.archiveNo) + '"><span class="cell">' + esc(r.archiveNo) + '</span></td>'
          + '<td>' + esc(r.time) + '</td>'
          + '<td title="' + esc(r.org) + '"><span class="cell">' + esc(r.org) + '</span></td>'
          + '</tr>';
      });
    }
    $('tbBody').innerHTML = html;
    $('pgTotal').textContent = list.length;
    renderPager();
  }

  /* 分页（原型演示第 1 页） */
  function renderPager() {
    var total = parseInt($('pgTotal').textContent) || 0;
    var box = $('pagerBox'), html = '';
    html += '<button class="pg-btn" onclick="toast(\'已是第一页\',\'info\')">‹</button>';
    html += '<button class="pg-btn active">1</button>';
    if (total > 20) {
      html += '<button class="pg-btn" onclick="toast(\'原型演示：仅 1 页\',\'info\')">2</button>';
      html += '<span class="pg-more">…</span>';
      html += '<button class="pg-btn" onclick="toast(\'原型演示：仅 1 页\',\'info\')">2</button>';
    }
    html += '<button class="pg-btn" onclick="toast(\'原型演示：仅 1 页\',\'info\')">›</button>';
    box.innerHTML = html;
  }

  /* ================= 筛选交互 ================= */
  function resetFilter() {
    ['fName','fIdcard','fArchiveNo','fReviewer'].forEach(function (id) {
      $(id).value = '';
    });
    renderTable();
    toast('筛选条件已重置', 'success');
  }
  function applyFilter() {
    renderTable();
    toast('查询完成，共 ' + $('pgTotal').textContent + ' 条记录', 'success');
  }
  ['fName','fIdcard','fArchiveNo','fReviewer'].forEach(function (id) {
    $(id).addEventListener('input', renderTable);
  });

  /* ================= 初始渲染 ================= */
  renderTable();
</script>

</body>
</html>
