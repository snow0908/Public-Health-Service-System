<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妇女管理 - 妇幼管理</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 妇女管理页面特有样式（设计变量与公共样式见 框架.css） ===== */

  /* ===== 嵌入模式（被 index.html 壳子以 iframe 内嵌时，框架.js 自动加 html.embed-mode） ===== */
  html.embed-mode .main-area{height:100%}      /* 壳子内自适应：无顶部导航栏包裹 */
  html.embed-mode .tabbar{display:none}        /* 标签栏由壳子统一管理，本页隐藏 */
  html.embed-mode .toast{top:24px}             /* 壳内提示位置上移 */

  /* ===== 布局：content 改为 flex，content-card 撑满并让表格区内部滚动 ===== */
  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-height:0;min-width:0}

  /* ===== 页头按钮 ===== */
  .page-head .right .btn{height:28px;padding:0 14px;font-size:13px}

  /* ===== 筛选区 ===== */
  .filter-panel{padding:14px 12px 0;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-row{display:flex;flex-wrap:wrap;gap:12px 16px;margin-bottom:14px;align-items:center}
  .filter-row.extra{display:none}
  .filter-row.extra.show{display:flex}
  .filter-item{display:flex;align-items:center;gap:8px}
  .filter-item label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
  .fi-ctl{width:160px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-select{width:140px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fi-select.w-lg{width:210px}
  .fi-ctl:focus,.fi-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  .filter-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn-plain{height:28px;padding:0 8px;font-size:13px;color:var(--primary);border-radius:var(--r-sm)}
  .btn-plain:hover{background:var(--primary-bg)}
  /* 筛选区扩展控件：日期区间 / 比较符 / 数值 / 单选复选组 */
  .fi-date{width:138px}
  .fi-sep{color:var(--text-placeholder);font-size:13px}
  .fi-cmp{width:78px}
  .fi-num{width:80px}
  .fi-unit{font-size:13px;color:var(--text-secondary)}
  .fi-opts{display:flex;align-items:center;gap:12px}
  .fi-radio{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--text-secondary);cursor:pointer}
  .fi-radio input{margin:0;accent-color:var(--primary);cursor:pointer}
  .fi-check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);cursor:pointer}
  .fi-check input{margin:0;accent-color:var(--primary);cursor:pointer}
  /* 主筛选区行距/列距/标签间距（对齐设计稿：行距 10、列距 22、标签-控件 12） */
  .filter-panel .filter-row{gap:12px 22px;margin-bottom:10px}
  .filter-panel .filter-item{gap:12px}
  /* 筛选区内控件统一外框宽度（仅作用于主筛选区，不影响新建专项弹框内同名类） */
  .filter-panel .fi-ctl,.filter-panel .fi-select{width:160px}
  /* 筛选区内统一筛选复合控件（管理机构/管辖行政区）等宽 160px */
  .filter-panel .fcp-ms,.filter-panel .fcp-cas,.filter-panel .fcp-tree,.filter-panel .fcp-mst{width:160px}
  .filter-panel .fcp-ms .fcp-panel{width:max-content;min-width:100%;max-width:300px}
  .filter-panel .fcp-tree .fcp-panel{width:200px}
  /* 日期区间：单一外框（开始日期 ~ 结束日期 + 日历图标） */
  .fi-range{display:flex;align-items:center;gap:6px;width:232px;height:32px;padding:0 8px 0 10px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);background:var(--bg-white);transition:all var(--transition-fast)}
  .fi-range:hover{border-color:var(--primary)}
  .fi-range:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-range input{flex:1 1 0;min-width:0;height:30px;border:none;background:transparent;outline:none;padding:0;font-size:14px;color:var(--text-primary);font-family:inherit}
  .fi-range input::placeholder{color:var(--text-placeholder)}
  .fi-range input::-webkit-calendar-picker-indicator{display:none}
  .fi-tilde{flex-shrink:0;font-size:14px;color:var(--text-placeholder)}
  .fi-cal{width:14px;height:14px;flex-shrink:0;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14' fill='none' stroke='%23bfbfbf' stroke-width='1.2'%3E%3Crect x='1.4' y='2.4' width='11.2' height='10.2' rx='1.6'/%3E%3Cpath d='M1.4 5.6h11.2M4.6 1.4v2M9.4 1.4v2'/%3E%3C/svg%3E") no-repeat center/contain}
  /* 只看个人管理档案 复选框（统一写法，替换各页旧版 .own-check） */
  .fi-check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);cursor:pointer;user-select:none;white-space:nowrap;margin:0}
  .fi-check input[type=checkbox]{width:15px;height:15px;margin:0;accent-color:var(--primary);cursor:pointer}
  /* 可清空单选下拉（中医服务等：有值时右侧出现圆形 ✕） */
  .fi-combo{position:relative;display:inline-flex;align-items:center}
  .filter-panel .fi-combo .fi-select{width:160px;padding-right:30px}
  .fi-combo.has-val .fi-select{background-image:none}
  .fi-combo .fi-combo-x{display:none;position:absolute;right:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;box-sizing:border-box;border:1px solid #BFBFBF;border-radius:50%;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='5' height='5' viewBox='0 0 5 5'%3E%3Cpath d='M1 1l3 3M4 1L1 4' stroke='%23BFBFBF' stroke-width='1' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat center/5px 5px;cursor:pointer;user-select:none}
  .fi-combo.has-val .fi-combo-x{display:block}
  .fi-combo .fi-combo-x:hover{border-color:var(--primary);background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='5' height='5' viewBox='0 0 5 5'%3E%3Cpath d='M1 1l3 3M4 1L1 4' stroke='%23007AFF' stroke-width='1' stroke-linecap='round'/%3E%3C/svg%3E")}
  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}

  /* 横向滚动时前 4 列冻结（序号/管理机构/姓名/证件号） */
  .list-tbl th:nth-child(-n+4),.list-tbl td:nth-child(-n+4){position:sticky}
  .list-tbl td:nth-child(-n+4){z-index:2;background:var(--bg-white)}
  .list-tbl th:nth-child(-n+4){z-index:6}
  .list-tbl th:nth-child(1),.list-tbl td:nth-child(1){left:0}
  .list-tbl th:nth-child(2),.list-tbl td:nth-child(2){left:44px}
  .list-tbl th:nth-child(3),.list-tbl td:nth-child(3){left:194px}
  .list-tbl th:nth-child(4),.list-tbl td:nth-child(4){left:270px}
  .list-tbl th:nth-child(4),.list-tbl td:nth-child(4){box-shadow:6px 0 8px -6px rgba(0,0,0,0.2)}
  /* 横向滚动时操作列（末列）冻结在右侧 */
  .list-tbl th:last-child,.list-tbl td:last-child{position:sticky;right:0}
  .list-tbl td:last-child{z-index:2;background:var(--bg-white)}
  .list-tbl th:last-child{z-index:6}
  .list-tbl th:last-child,.list-tbl td:last-child{box-shadow:-6px 0 8px -6px rgba(0,0,0,0.2)}
  .list-tbl tr.empty-row td:last-child{position:static;box-shadow:none}
  /* 操作列允许溢出，保证「更多」下拉菜单可正常展开 */
  .list-tbl tbody tr:not(.empty-row) td:last-child{overflow:visible}
  .list-tbl{width:100%;min-width:1820px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:36px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:36px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:nth-child(even) td{background:var(--bg-table-even)}
  .list-tbl tbody tr:nth-child(even) td:nth-child(-n+4){background:var(--bg-table-even)}
  .list-tbl tbody tr:hover td,.list-tbl tbody tr:hover td:nth-child(-n+4){background:var(--primary-bg)}
  .list-tbl th.center,.list-tbl td.center{text-align:center}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 重点人群类型标签 */
  .crowd-tags{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center}
  .crowd-tag{display:inline-flex;align-items:center;justify-content:center;height:18px;padding:0 5px;border-radius:3px;font-size:11px;line-height:1;color:#fff}
  .crowd-tag.yun{background:#E53935}
  .crowd-tag.can{background:#FB8C00}
  .crowd-tag.di{background:#FDD835;color:#333}
  .crowd-tag.te{background:#43A047}
  .crowd-tag.jing{background:#1E88E5}
  .crowd-tag.jie{background:#8E24AA}
  .crowd-tag.lao{background:#757575}
  .crowd-tag.guan{background:#00838F}

  /* 个人档案情况 */
  .full-ok{color:var(--success);font-weight:var(--font-weight-medium)}
  .full-mid{color:var(--warning)}
  .full-low{color:var(--danger)}

  /* 状态圆点（个人档案情况/管辖行政区/锁定状态） */
  .st-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .st-dot.ok{background:var(--success)}
  .st-dot.warn{background:#FF9500}
  .st-dot.info{background:var(--info)}

  /* 操作列 */
  .op-link{color:var(--primary);cursor:pointer;font-size:13px}
  .op-link:hover{text-decoration:underline}
  .op-gap{display:inline-block;width:8px}
  .op-more{position:relative;display:inline-flex;align-items:center}
  .op-more .more-btn{display:inline-flex;align-items:center;gap:2px;color:var(--primary);cursor:pointer;font-size:13px}
  .op-more .more-btn:hover{text-decoration:underline}
  .op-more .more-btn svg{transition:transform var(--transition-fast)}
  .op-more.open .more-btn svg{transform:rotate(180deg)}
  .op-menu{position:absolute;top:calc(100% + 6px);right:-8px;min-width:110px;background:var(--bg-white);border:1px solid var(--color-neutral-200);border-radius:var(--r-sm);box-shadow:var(--shadow-md);padding:4px 0;display:none;z-index:30}
  .op-more.open .op-menu{display:block}
  .op-menu .mi{display:block;width:100%;text-align:left;padding:7px 14px;font-size:13px;color:var(--text-secondary);line-height:1.4}
  .op-menu .mi:hover{background:var(--primary-bg);color:var(--primary)}

  /* ===== 新建服务 全局下拉浮层 ===== */
  #opMenu{position:fixed;top:-9999px;left:-9999px;display:none;min-width:118px;background:var(--bg-white);border:1px solid var(--color-neutral-200);border-radius:var(--r-sm);box-shadow:var(--shadow-md);padding:4px 0;z-index:999999}
  #opMenu .mi{display:block;width:100%;text-align:left;padding:7px 14px;font-size:13px;color:var(--text-secondary);line-height:1.4;white-space:nowrap;cursor:pointer;background:none;border:0}
  #opMenu .mi:hover{background:var(--primary-bg);color:var(--primary)}

  /* ===== 分页 ===== */
  .page-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;height:52px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .pg-size select{height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 22px 0 8px;font-size:13px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer}
  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}
  .pg-btn:hover{border-color:var(--primary);color:var(--primary)}
  .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .pg-ellipsis{display:inline-block;padding:0 4px;line-height:26px;color:var(--text-tertiary)}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
  .pg-jump input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}

  /* ===== 新建妇女档案弹框 ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--transition-normal)}
  .modal-overlay.show{opacity:1;pointer-events:auto}
  .modal{width:860px;max-width:92vw;background:var(--bg-white);border-radius:var(--r-md);box-shadow:0 8px 32px rgba(0,0,0,0.18);display:flex;flex-direction:column;overflow:hidden;transform:translateY(10px);transition:transform var(--transition-normal)}
  .modal-overlay.show .modal{transform:translateY(0)}
  .modal-head{height:48px;display:flex;align-items:center;padding:0 16px;flex-shrink:0}
  .modal-head h3{font-size:15px;font-weight:var(--font-weight-semibold);color:var(--primary)}
  .modal-close{margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);border-radius:var(--r-sm);font-size:16px}
  .modal-close:hover{background:var(--primary-bg);color:var(--primary)}
  .modal-body{padding:16px 16px 4px}
  .modal-cols{display:flex;gap:16px;align-items:flex-start}
  .modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:18px 20px 20px}

  /* 左侧表单 */
  .fm-form{width:316px;flex-shrink:0}
  .fm-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .fm-row label{width:88px;text-align:right;font-size:14px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .fm-row label i{color:var(--danger);font-style:normal;margin-right:2px}
  .fm-ctl-wrap{position:relative}
  .fm-ctl{width:220px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fm-ctl.has-cnt{padding-right:40px}
  .fm-select{width:220px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fm-ctl:focus,.fm-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fm-ctl::placeholder{color:var(--text-placeholder)}
  .cnt{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-placeholder);pointer-events:none}
  .fm-readcard{height:32px;padding:0 10px;border:1px solid var(--primary);color:var(--primary);background:var(--bg-white);border-radius:var(--r-sm);font-size:13px;white-space:nowrap;flex-shrink:0;transition:all var(--transition-fast)}
  .fm-readcard:hover{background:var(--primary-bg)}

  /* 右侧：证件号行 + 信息回显卡 */
  .pv-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .pv-side .fm-row{margin-bottom:0}
  .pv-side .fm-ctl-wrap{flex:1;min-width:0}
  .pv-side .fm-ctl{width:100%}
  /* 右侧信息回显卡 */
  .pv-card{flex:1;min-width:0;background:var(--primary-bg);border:1px dashed #9EC3F5;border-radius:var(--r-md);padding:22px 18px;display:grid;grid-template-columns:1fr 1fr;row-gap:26px;column-gap:12px;font-size:13px;min-height:210px;align-content:start}
  /* 联系地址整行铺底 */
  .fm-addr-row{margin:14px 0 0}
  .fm-addr-row .fm-ctl-wrap{flex:1;min-width:0}
  .fm-addr-row .fm-ctl{width:100%}

  /* ===== 联系地址：五级级联（省 / 市 / 区县 / 乡镇街道 / 村社区） ===== */
  .addr-cas{position:relative;flex-shrink:0}
  .addr-cas-box{width:204px;height:32px;display:flex;align-items:center;padding:0 26px 0 10px;position:relative;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);background:var(--bg-white);cursor:pointer;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
  .addr-cas-box:hover{border-color:#B4BCC8}
  .addr-cas.open .addr-cas-box{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .addr-cas-text{flex:1;min-width:0;font-size:14px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr-cas-text.is-ph{color:var(--text-placeholder)}
  .addr-cas-caret{position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:1.4px solid #8C8C8C;border-bottom:1.4px solid #8C8C8C;transform:translate(0,-70%) rotate(45deg);transition:transform var(--transition-fast),border-color var(--transition-fast)}
  .addr-cas.open .addr-cas-caret{transform:translate(0,-25%) rotate(-135deg);border-color:var(--primary)}
  /* 级联面板：fixed 定位，避免被弹框 overflow:hidden 裁剪 */
  .addr-panel{position:fixed;z-index:1500;display:none;padding:6px 0;background:var(--bg-white);border:1px solid #E5E7EB;border-radius:6px;box-shadow:0 8px 24px rgba(15,23,42,0.16);max-width:calc(100vw - 16px);overflow-x:auto}
  .addr-panel.show{display:flex}
  .addr-col{position:relative;width:176px;flex-shrink:0;max-height:240px;overflow-y:auto;padding:0 6px}
  .addr-col::-webkit-scrollbar{width:6px}
  .addr-col::-webkit-scrollbar-thumb{background:#DCDFE6;border-radius:3px}
  .addr-n{display:flex;align-items:center;height:30px;padding:0 10px;border-radius:4px;font-size:14px;color:var(--text-primary);white-space:nowrap;cursor:pointer;transition:background var(--transition-fast),color var(--transition-fast)}
  .addr-n .addr-tx{overflow:hidden;text-overflow:ellipsis}
  .addr-n:hover{background:#EAF3FF;color:var(--primary)}
  .addr-n.on{color:var(--primary)}
  .addr-n .addr-arrow{margin-left:auto;padding-left:8px;color:#C5CAD3;font-size:13px;line-height:1}
  .addr-n:hover .addr-arrow{color:var(--primary)}
  .addr-empty{padding:6px 10px;font-size:13px;color:var(--text-placeholder)}
  .pv-row{display:flex;min-width:0}
  .pv-row.wide{grid-column:1 / -1}
  .pv-label{color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .pv-val{color:var(--primary);word-break:break-all}

  /* ===== 档案选择弹框（新建妇女档案第一步：选择居民档案） ===== */
  .modal.select-modal .modal{width:980px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
  .modal.select-modal .modal-body{padding:12px 0 0;display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
  .select-filter{padding:0 16px 10px;border-bottom:1px solid #E8E8E8;flex-shrink:0}
  .select-filter .filter-row{margin-bottom:10px}
  .select-filter .fi-ctl{width:150px;height:30px;font-size:13px}
  .select-filter .fi-select{width:130px;height:30px;font-size:13px}
  .select-filter .fi-select.w-lg{width:170px}
  .select-filter .btn{height:28px;padding:0 12px;font-size:13px}
  .select-filter .btn-plain{height:28px;padding:0 6px;font-size:13px;color:var(--primary);background:none;border:none;cursor:pointer}
  .select-filter .btn-plain:hover{text-decoration:underline}
  .select-table-wrap{flex:1;overflow:auto;min-height:0;min-width:0}
  .select-tbl{width:100%;min-width:1268px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .select-tbl th{position:sticky;top:0;z-index:5;height:34px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .select-tbl td{height:34px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 横向滚动时前 3 列（序号/档案编号/姓名）冻结在左侧 */
  .select-tbl th:nth-child(-n+3),.select-tbl td:nth-child(-n+3){position:sticky}
  .select-tbl td:nth-child(-n+3){z-index:2;background:var(--bg-white)}
  .select-tbl th:nth-child(-n+3){z-index:6}
  .select-tbl th:nth-child(1),.select-tbl td:nth-child(1){left:0}
  .select-tbl th:nth-child(2),.select-tbl td:nth-child(2){left:50px}
  .select-tbl th:nth-child(3),.select-tbl td:nth-child(3){left:210px}
  .select-tbl th:nth-child(3),.select-tbl td:nth-child(3){box-shadow:6px 0 8px -6px rgba(0,0,0,0.2)}
  /* 操作列（末列）冻结在右侧 */
  .select-tbl th:last-child,.select-tbl td:last-child{position:sticky;right:0}
  .select-tbl td:last-child{z-index:2;background:var(--bg-white)}
  .select-tbl th:last-child{z-index:6}
  .select-tbl th:last-child,.select-tbl td:last-child{box-shadow:-6px 0 8px -6px rgba(0,0,0,0.2)}
  .select-tbl tr.empty-row td:last-child{position:static;box-shadow:none}
  .select-tbl tbody tr:hover td{background:var(--primary-bg)}
  .select-tbl th.center,.select-tbl td.center{text-align:center}
  .select-tbl .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .select-tbl .op-create{color:var(--primary);cursor:pointer;font-size:13px}
  .select-tbl .op-create:hover{text-decoration:underline}
  .select-tbl .op-enter{color:var(--primary);cursor:pointer;font-size:13px}
  .select-tbl .op-enter:hover{text-decoration:underline}
  .select-tbl .op-none{color:var(--text-tertiary);font-size:13px}
  .select-tbl .crowd-tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .select-pagefoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;height:44px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .select-pagefoot .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .select-pagefoot .pg-size select{height:24px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 20px 0 6px;font-size:12px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 5px center;cursor:pointer}
  .select-pagefoot .pg-pager{display:flex;align-items:center;gap:3px}
  .select-pagefoot .pg-btn{min-width:24px;height:24px;padding:0 5px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:12px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
  .select-pagefoot .pg-btn:hover{border-color:var(--primary);color:var(--primary)}
  .select-pagefoot .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .select-pagefoot .pg-ellipsis{display:inline-block;padding:0 3px;line-height:24px;color:var(--text-tertiary)}
  .select-pagefoot .pg-jump input{width:36px;height:24px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 5px;font-size:12px;text-align:center;color:var(--text-primary);outline:none}
  .select-pagefoot .pg-jump input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}

</style>
</head>
<body>

<!-- ===== 主内容区（顶部导航栏与左侧菜单栏由 框架.js 注入） ===== -->
<div class="main-area">

  <!-- 页面标签条（嵌入模式下隐藏，由壳子统一管理） -->
  <div class="tabbar">
    <div class="tab-item dashboard active" onclick="toast('当前已在「妇女管理」页','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      妇女管理
    </div>
  </div>

  <div class="content">
    <div class="content-card">

      <!-- 页头 -->
      <div class="page-head">
        <h1>妇女管理</h1>
        <div class="right">
          <button class="btn btn-default" onclick="toast('导出功能建设中','info')">导出</button>
          <button class="btn btn-default" onclick="toast('请连接身份证读卡器','info')">身份证读卡</button>
          <button class="btn btn-primary" onclick="openCreateModal()">新建</button>
        </div>
      </div>

      <!-- 筛选区 -->
      <div class="filter-panel">
        <div class="filter-row">
          <div class="filter-item"><label>管理机构：</label>
            <div class="fcp-ms" data-fcp="ms">
              <div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>
              <div class="fcp-panel"></div>
              <input type="hidden" class="fcp-val" id="fOrg">
            </div>
          </div>
          <div class="filter-item"><label>姓名：</label><input id="fName" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item"><label>证件号：</label><input id="fIdcard" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item"><label>婚姻状况：</label>
            <select id="fMarriage" class="fi-select">
              <option value="" selected>请选择</option>
              <option value="未婚">未婚</option>
              <option value="已婚">已婚</option>
              <option value="初婚">初婚</option>
              <option value="再婚">再婚</option>
              <option value="复婚">复婚</option>
              <option value="丧偶">丧偶</option>
              <option value="离婚">离婚</option>
              <option value="未说明的婚姻状况">未说明的婚姻状况</option>
            </select>
          </div>
        </div>
        <div class="filter-row">
          <div class="filter-item"><label>建档日期：</label>
            <span class="fi-range">
              <input id="fCreateStart" type="text" placeholder="开始日期" onfocus="this.type='date';try{this.showPicker()}catch(e){}" onblur="if(!this.value){this.type='text'}">
              <span class="fi-tilde">~</span>
              <input id="fCreateEnd" type="text" placeholder="结束日期" onfocus="this.type='date';try{this.showPicker()}catch(e){}" onblur="if(!this.value){this.type='text'}">
              <span class="fi-cal"></span>
            </span>
          </div>
          <div class="filter-item"><label>档案编号：</label><input id="fArchNo" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item"><label>电话号码：</label><input id="fPhone" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item"><label>个人档案情况：</label>
            <select id="fArchStatus" class="fi-select">
              <option value="" selected>全部</option>
              <option value="已关联">已关联</option>
              <option value="未关联">未关联</option>
            </select>
          </div>
          <div class="filter-btns">
            <button class="btn btn-default" onclick="resetFilter()">重置</button>
            <button class="btn btn-primary" onclick="applyFilter()">查询</button>
            <button class="btn-plain" id="btnExpand" onclick="toggleExtra()">展开 ▼</button>
          </div>
        </div>
        <div class="filter-row extra">
          <div class="filter-item"><label>管辖行政区：</label>
            <div class="fcp-cas" data-fcp="cas" data-caret>
              <div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>
              <div class="fcp-panel"></div>
              <input type="hidden" class="fcp-val" id="fRegion">
            </div>
          </div>
          <div class="filter-item"><label>重点人群类型：</label>
            <div class="fcp-ms" data-fcp="ms" data-options="高血压|糖尿病|慢阻肺病|老年人|肺结核|严重精神障碍|脑卒中|冠心病">
              <div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>
              <div class="fcp-panel"></div>
              <input type="hidden" class="fcp-val" id="fCrowd">
            </div>
          </div>
          <div class="filter-item"><label>出生日期：</label>
            <span class="fi-range">
              <input id="fBirthStart" type="text" placeholder="开始日期" onfocus="this.type='date';try{this.showPicker()}catch(e){}" onblur="if(!this.value){this.type='text'}">
              <span class="fi-tilde">~</span>
              <input id="fBirthEnd" type="text" placeholder="结束日期" onfocus="this.type='date';try{this.showPicker()}catch(e){}" onblur="if(!this.value){this.type='text'}">
              <span class="fi-cal"></span>
            </span>
          </div>
          <div class="filter-item"><label>锁定状态：</label>
            <select id="fLock" class="fi-select">
              <option value="" selected>请选择</option>
              <option value="未上锁">未上锁</option>
              <option value="已上锁">已上锁</option>
            </select>
          </div>
        </div>
        <div class="filter-row extra">
          <div class="filter-item"><label class="fi-check"><input type="checkbox" id="fMine"> 只看个人管理档案</label></div>
        </div>
      </div>


      <!-- 数据表格 -->
      <div class="table-wrap">
        <table class="list-tbl">
          <colgroup>
            <col style="width:44px"><col style="width:150px"><col style="width:76px"><col style="width:148px"><col style="width:82px"><col style="width:44px"><col style="width:44px"><col style="width:96px"><col style="width:76px"><col style="width:120px"><col style="width:104px"><col style="width:100px"><col style="width:130px"><col style="width:104px"><col style="width:96px"><col style="width:100px"><col style="width:76px"><col style="width:130px">
          </colgroup>
          <thead>
            <tr>
              <th class="center">序号</th>
              <th>管理机构</th>
              <th>姓名</th>
              <th>证件号</th>
              <th>证件类型</th>
              <th class="center">性别</th>
              <th class="center">年龄</th>
              <th>出生日期</th>
              <th>婚姻状况</th>
              <th>重点人群类型</th>
              <th>联系电话</th>
              <th>详细地址</th>
              <th>档案编号</th>
              <th>管辖行政区</th>
              <th>建档日期</th>
              <th>责任医生</th>
              <th>锁定状态</th>
              <th class="center">操作</th>
            </tr>
          </thead>
          <tbody id="tbBody"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="page-foot">
        <span class="pg-total">共 <b id="pgTotal">0</b> 条</span>
        <span class="pg-size">
          <select onchange="toast('原型演示：每页条数固定 20 条','info')">
            <option selected>20条/页</option>
            <option>50条/页</option>
            <option>100条/页</option>
          </select>
        </span>
        <span class="pg-pager" id="pgPager"></span>
        <span class="pg-jump">前往 <input id="pgJump" value="1" onkeydown="if(event.key==='Enter'){jumpPage()}"> 页</span>
      </div>

    </div>
  </div>
</div>

<!-- ===== 档案选择弹框（新建专项第一步：选择居民档案） ===== -->
<div class="modal-overlay select-modal" id="selectModal">
  <div class="modal">
    <div class="modal-head">
      <h3>新建妇女档案</h3>
      <span class="modal-close" onclick="closeSelectModal()">×</span>
    </div>
    <div class="modal-body">
      <!-- 筛选区 -->
      <div class="select-filter">
        <div class="filter-row">
          <div class="filter-item"><label>姓名</label><input id="sfName" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item"><label>证件类型</label>
            <select id="sfIdType" class="fi-select">
              <option value="" selected>请选择</option>
              <option value="居民身份证">居民身份证</option>
              <option value="居民户口簿">居民户口簿</option>
              <option value="护照">护照</option>
            </select>
          </div>
          <div class="filter-item"><label>证件号</label><input id="sfIdcard" class="fi-ctl" placeholder="请输入"></div>
        </div>
        <div class="filter-row">
          <div class="filter-item"><label>管理机构</label>
            <div class="fcp-ms" data-fcp="ms">
              <div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>
              <div class="fcp-panel"></div>
              <input type="hidden" class="fcp-val" id="sfOrg">
            </div>
          </div>
          <div class="filter-item"><label>管辖网格</label>
            <div class="fcp-tree" data-fcp="tree">
              <div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>
              <div class="fcp-panel"></div>
              <input type="hidden" class="fcp-val" id="sfGrid">
            </div>
          </div>
          <div class="filter-btns">
            <button class="btn btn-default" onclick="resetSelectFilter()">重置</button>
            <button class="btn btn-primary" onclick="applySelectFilter()">查询</button>
            <button class="btn-plain" id="sfExpand" onclick="toggleSelectExtra()">展开 ▼</button>
          </div>
        </div>
        <div class="filter-row" id="sfExtraRow" style="display:none">
          <div class="filter-item"><label>性别</label>
            <select id="sfGender" class="fi-select">
              <option value="" selected>请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="filter-item"><label>年龄</label><input id="sfAge" class="fi-ctl" placeholder="如：60"></div>
          <div class="filter-item"><label>人群类型</label>
            <select id="sfCrowd" class="fi-select">
              <option value="" selected>请选择</option>
              <option value="老年人">老年人</option>
              <option value="孕产妇">孕产妇</option>
              <option value="糖尿病">糖尿病</option>
              <option value="儿童">儿童</option>
            </select>
          </div>
          <div class="filter-item"><label>管辖行政村</label><input id="sfRegion" class="fi-ctl" placeholder="请输入"></div>
        </div>
      </div>
      <!-- 档案列表表格 -->
      <div class="select-table-wrap">
        <table class="select-tbl">
          <colgroup>
            <col style="width:50px"><col style="width:160px"><col style="width:72px"><col style="width:48px"><col style="width:48px"><col style="width:92px"><col style="width:168px"><col style="width:100px"><col style="width:90px"><col style="width:200px"><col style="width:80px"><col style="width:80px"><col style="width:80px">
          </colgroup>
          <thead>
            <tr>
              <th class="center">序号</th>
              <th>档案编号</th>
              <th>姓名</th>
              <th class="center">性别</th>
              <th class="center">年龄</th>
              <th>证件类型</th>
              <th>证件号</th>
              <th>人群类型</th>
              <th>管辖行政村</th>
              <th>管辖机构</th>
              <th>个人档案情况</th>
              <th>锁定状态</th>
              <th class="center">操作</th>
            </tr>
          </thead>
          <tbody id="sfTbBody"></tbody>
        </table>
      </div>
      <!-- 分页 -->
      <div class="select-pagefoot">
        <span class="pg-total">共 <b id="sfTotal">409</b> 条</span>
        <span class="pg-size">
          <select onchange="toast('原型演示：每页条数固定 20 条','info')">
            <option selected>20条/页</option>
            <option>50条/页</option>
          </select>
        </span>
        <span class="pg-pager" id="sfPager"></span>
        <span class="pg-jump">跳至第 <input id="sfJump" value="1" onkeydown="if(event.key==='Enter'){sfJumpPage()}"> 页</span>
      </div>
    </div>
  </div>
</div>

<!-- ===== 新建妇女档案弹框（版式与「居民档案列表」的新建弹框保持一致） ===== -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-head">
      <h3>新建妇女档案</h3>
      <span class="modal-close" onclick="closeCreateModal()">×</span>
    </div>
    <div class="modal-body">
      <div class="modal-cols">
        <!-- 左侧表单 -->
        <div class="fm-form">
          <div class="fm-row">
            <label><i>*</i>证件类型：</label>
            <select id="cmIdType" class="fm-select">
              <option value="居民身份证" selected>居民身份证</option>
              <option value="居民户口簿">居民户口簿</option>
              <option value="护照">护照</option>
              <option value="港澳居民来往内地通行证">港澳居民来往内地通行证</option>
              <option value="台湾居民来往大陆通行证">台湾居民来往大陆通行证</option>
            </select>
          </div>
          <div class="fm-row">
            <label><i>*</i>姓名：</label>
            <div class="fm-ctl-wrap">
              <input id="cmName" class="fm-ctl has-cnt" maxlength="8" placeholder="请输入">
              <span class="cnt" id="cntName">0/8</span>
            </div>
          </div>
          <div class="fm-row">
            <label><i>*</i>性别：</label>
            <select id="cmGender" class="fm-select">
              <option value="" selected>请选择</option>
              <option value="男性">男性</option>
              <option value="女性">女性</option>
            </select>
          </div>
          <div class="fm-row">
            <label><i>*</i>民族：</label>
            <select id="cmNation" class="fm-select">
              <option value="汉族" selected>汉族</option>
              <option value="蒙古族">蒙古族</option>
              <option value="回族">回族</option>
              <option value="藏族">藏族</option>
              <option value="维吾尔族">维吾尔族</option>
              <option value="苗族">苗族</option>
              <option value="彝族">彝族</option>
              <option value="壮族">壮族</option>
              <option value="满族">满族</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="fm-row">
            <label><i>*</i>联系电话：</label>
            <input id="cmPhone" class="fm-ctl" maxlength="11" placeholder="请输入联系电话">
          </div>
          <div class="fm-row">
            <label><i>*</i>出生日期：</label>
            <input id="cmBirth" class="fm-ctl" type="text" placeholder="请选择日期"
                   onfocus="this.type='date';try{this.showPicker()}catch(e){}"
                   onblur="if(!this.value){this.type='text'}">
          </div>
        </div>
        <!-- 右侧：证件号 + 信息回显卡 -->
        <div class="pv-side">
          <div class="fm-row">
            <label><i>*</i>证件号：</label>
            <div class="fm-ctl-wrap">
              <input id="cmIdcard" class="fm-ctl has-cnt" maxlength="18" placeholder="请输入证件号">
              <span class="cnt" id="cntIdcard">0/18</span>
            </div>
            <button class="fm-readcard" onclick="toast('请连接身份证读卡器','info')">身份证读卡</button>
          </div>
          <div class="pv-card" id="pvCard"></div>

  /* ================= 工具函数 ================= */
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function $(id) { return document.getElementById(id); }

  /* ================= 分页状态 ================= */
  var PAGE_SIZE = 20;
  var curPage = 1;
  var lastList = [];

  /* ================= 表格渲染（按筛选条件实时过滤 + 分页） ================= */
  function renderTable() {
    var org = $('fOrg').value, name = $('fName').value.trim(), idcard = $('fIdcard').value.trim();
    var region = $('fRegion').value, lock = $('fLock').value;
    var marriage = $('fMarriage').value, crowd = $('fCrowd').value;
    var phone = $('fPhone').value.trim(), archNo = $('fArchNo').value.trim();
    var archStatus = $('fArchStatus').value;
    var birthStart = $('fBirthStart').value, birthEnd = $('fBirthEnd').value;
    var createStart = $('fCreateStart').value, createEnd = $('fCreateEnd').value;
    var own = $('fMine').checked;

    lastList = womenData.filter(function (r) {
      if (org && org.split(',').indexOf(r.org) === -1) return false;
      if (name && r.name.indexOf(name) === -1) return false;
      if (idcard && r.idcard.indexOf(idcard) === -1) return false;
      if (region && r.region !== region) return false;
      if (lock && r.lock !== lock) return false;
      if (marriage && r.marriage !== marriage) return false;
      /* 重点人群类型：多选，任一所选标签命中即通过 */
      if (crowd) {
        var cs = crowd.split(',');
        if (!cs.some(function (c) { return (r.crowd || []).indexOf(c) !== -1; })) return false;
      }
      if (phone && r.phone.indexOf(phone) === -1) return false;
      if (archNo && r.archNo.indexOf(archNo) === -1) return false;
      if (archStatus && (r.archStatus || '已关联') !== archStatus) return false;
      if (birthStart && r.birth < birthStart) return false;
      if (birthEnd && r.birth > birthEnd) return false;
      if (createStart && r.createDate < createStart) return false;
      if (createEnd && r.createDate > createEnd) return false;
      if (own && !r.mine) return false;
      return true;
    });

    var total = Math.max(1, Math.ceil(lastList.length / PAGE_SIZE));
    if (curPage > total) curPage = total;
    var start = (curPage - 1) * PAGE_SIZE;
    var slice = lastList.slice(start, start + PAGE_SIZE);

    var crowdMap = { '高血压':'yun', '糖尿病':'can', '慢阻肺病':'di', '老年人':'te', '肺结核':'jing', '严重精神障碍':'jie', '脑卒中':'lao', '冠心病':'guan' };
    var html = '';
    if (slice.length === 0) {
      html = '<tr class="empty-row"><td colspan="18"><div class="ico">📭</div>暂无符合条件的妇女管理档案</td></tr>';
    } else {
      slice.forEach(function (r, i) {
        var lkDot = r.lock === '未上锁' ? 'ok' : 'warn';
        var crowdHtml = '';
        (r.crowd || []).forEach(function (c) {
          if (crowdMap[c]) crowdHtml += '<span class="crowd-tag ' + crowdMap[c] + '">' + c + '</span>';
        });
        html += '<tr>'
          + '<td class="center">' + (start + i + 1) + '</td>'
          + '<td title="' + esc(r.org) + '"><span class="cell">' + esc(r.org) + '</span></td>'
          + '<td><a class="op-link" onclick="goArchive(\'' + esc(r.archNo) + '\')" title="查看妇女档案">' + esc(r.name) + '</a></td>'
          + '<td title="' + esc(r.idcard) + '"><span class="cell">' + esc(r.idcard) + '</span></td>'
          + '<td>' + esc(r.idType) + '</td>'
          + '<td class="center">' + esc(r.gender) + '</td>'
          + '<td class="center">' + r.age + '</td>'
          + '<td>' + esc(r.birth) + '</td>'
          + '<td>' + esc(r.marriage || '') + '</td>'
          + '<td><span class="crowd-tags">' + crowdHtml + '</span></td>'
          + '<td title="' + esc(r.phone) + '"><span class="cell">' + esc(r.phone) + '</span></td>'
          + '<td title="' + esc(r.address) + '"><span class="cell">' + esc(r.address) + '</span></td>'
          + '<td title="' + esc(r.archNo) + '"><span class="cell">' + esc(r.archNo) + '</span></td>'
          + '<td>' + esc(r.region) + '</td>'
          + '<td>' + esc(r.createDate) + '</td>'
          + '<td>' + esc(r.dutyDoc) + '</td>'
          + '<td><span class="st-dot ' + lkDot + '"></span>' + esc(r.lock) + '</td>'
          + '<td class="center">'
          +   '<a class="op-link" onclick="goArchive(\'' + esc(r.archNo) + '\')">编辑</a>'
          +   '<span class="op-gap"></span>'
          +   '<span class="op-more">'
          +     '<a class="more-btn" onclick="showOpMenu(this,event,\'' + esc(r.archNo) + '\')">新建服务<svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="6 9 12 15 18 9"/></svg></a>'
          +   '</span>'
          +   '<span class="op-gap"></span>'
          +   '<a class="op-link" style="color:#FF4D4F" onclick="opAction(\'注销\',\'' + esc(r.name) + '\')">注销</a>'
          + '</td>'
          + '</tr>';
      });
    }
    $('tbBody').innerHTML = html;
    $('pgTotal').textContent = lastList.length;
    renderPager(total);
    $('pgJump').value = curPage;
  }

  /* ================= 分页器 ================= */
  function renderPager(total) {
    var nums = [];
    if (total <= 7) {
      for (var i = 1; i <= total; i++) nums.push(i);
    } else {
      nums.push(1);
      if (curPage > 3) nums.push('…');
      for (var j = Math.max(2, curPage - 1); j <= Math.min(total - 1, curPage + 1); j++) nums.push(j);
      if (curPage < total - 2) nums.push('…');
      nums.push(total);
    }
    var h = '<button class="pg-btn" onclick="gotoPage(' + (curPage - 1) + ')">‹</button>';
    nums.forEach(function (n) {
      h += n === '…'
        ? '<span class="pg-ellipsis">…</span>'
        : '<button class="pg-btn' + (n === curPage ? ' active' : '') + '" onclick="gotoPage(' + n + ')">' + n + '</button>';
    });
    h += '<button class="pg-btn" onclick="gotoPage(' + (curPage + 1) + ')">›</button>';
    $('pgPager').innerHTML = h;
  }

  function gotoPage(p) {
    var total = Math.max(1, Math.ceil(lastList.length / PAGE_SIZE));
    if (p < 1) { toast('已是第一页', 'info'); return; }
    if (p > total) { toast('已是最后一页', 'info'); return; }
    if (p === curPage) { toast('已在第 ' + p + ' 页', 'info'); return; }
    curPage = p;
    renderTable();
  }

  function jumpPage() {
    var v = parseInt($('pgJump').value, 10);
    if (isNaN(v)) { toast('请输入页码', 'warning'); return; }
    gotoPage(v);
  }

  /* ================= 交互 ================= */
  function resetFilter() {
    ['fName', 'fIdcard', 'fArchNo', 'fPhone'].forEach(function (id) { $(id).value = ''; });
    ['fOrg', 'fRegion', 'fMarriage', 'fCrowd', 'fArchStatus', 'fLock'].forEach(function (id) { $(id).value = ''; });
    ['fBirthStart', 'fBirthEnd', 'fCreateStart', 'fCreateEnd'].forEach(function (id) { var el = $(id); el.value = ''; el.type = 'text'; });
    $('fMine').checked = false;
    curPage = 1;
    renderTable();
    toast('筛选条件已重置', 'success');
  }

  function applyFilter() {
    curPage = 1;
    renderTable();
    toast('查询完成，共 ' + $('pgTotal').textContent + ' 条记录', 'success');
  }

  function toggleExtra() {
    var rows = document.querySelectorAll('.filter-panel .filter-row.extra');
    var btn = $('btnExpand');
    var show = !rows[0].classList.contains('show');
    rows.forEach(function (row) { row.classList.toggle('show', show); });
    btn.textContent = show ? '收起 ▲' : '展开 ▼';
    /* 展开：按钮组移到最后一行筛选条件右侧；收起：移回第二行末尾 */
    var btns = document.querySelector('.filter-panel .filter-btns');
    var mainRows = document.querySelectorAll('.filter-panel .filter-row:not(.extra)');
    if (show) {
      rows[rows.length - 1].appendChild(btns);
    } else {
      mainRows[mainRows.length - 1].appendChild(btns);
    }
  }

  function showOpMenu(el, ev, archNo) {
    if (ev) ev.stopPropagation();
    closeAllOpMenus();
    var m = $('opMenu');
    if (!m) return;
    m.innerHTML =
      '<button class="mi" onclick="opAction(\'婚前医学检查\',\'' + archNo + '\')">婚前医学检查</button>' +
      '<button class="mi" onclick="opAction(\'孕前医学检查\',\'' + archNo + '\')">孕前医学检查</button>' +
      '<button class="mi" onclick="opAction(\'常见妇女病检查\',\'' + archNo + '\')">常见妇女病检查</button>' +
      '<button class="mi" onclick="opAction(\'叶酸发放登记表\',\'' + archNo + '\')">叶酸发放登记表</button>';
    m.style.display = 'block';
    var r = el.getBoundingClientRect();
    var gap = 6, top = r.bottom + gap;
    var left = r.right - m.offsetWidth;
    if (left < 8) left = r.left;
    if (left + m.offsetWidth > window.innerWidth - 8) left = window.innerWidth - m.offsetWidth - 8;
    m.style.top = top + 'px';
    m.style.left = left + 'px';
  }

  function closeAllOpMenus() {
    var m = $('opMenu');
    if (m) { m.style.display = 'none'; m.innerHTML = ''; }
  }

  function opAction(action, key) {
    closeAllOpMenus();
    if (action === '注销') { toast('注销：' + key + '（功能建设中）', 'info'); return; }
    var viewMap = {
      '婚前医学检查': 'preMarital',
      '孕前医学检查': 'prePregnancy',
      '常见妇女病检查': 'womanDisease',
      '叶酸发放登记表': 'folicAcid'
    };
    var view = viewMap[action];
    if (!view) { toast(action + '：功能建设中', 'info'); return; }
    var r = null, i;
    for (i = 0; i < womenData.length; i++) {
      if (womenData[i].archNo === key) { r = womenData[i]; break; }
    }
    if (!r) { toast('未找到档案：' + key, 'warning'); return; }
    var params = [
      'view=' + view,
      'edit=1',
      'name=' + encodeURIComponent(r.name),
      'gender=' + encodeURIComponent(r.gender === '男' ? '男性' : '女性'),
      'idcard=' + encodeURIComponent(r.idcard),
      'idType=' + encodeURIComponent(r.idType || '居民身份证'),
      'archNo=' + encodeURIComponent(r.archNo)
    ];
    if (r.birth) params.push('birth=' + encodeURIComponent(r.birth));
    if (r.phone) params.push('phone=' + encodeURIComponent(r.phone));
    if (r.marriage) params.push('marriage=' + encodeURIComponent(r.marriage));
    if (r.crowd) params.push('crowd=' + encodeURIComponent(r.crowd));
    if (r.region) params.push('region=' + encodeURIComponent(r.region));
    if (r.address) params.push('addr=' + encodeURIComponent(r.address));
    if (r.dutyDoc) params.push('dutyDoc=' + encodeURIComponent(r.dutyDoc));
    if (r.createDate) params.push('createDate=' + encodeURIComponent(r.createDate));
    location.href = '档案维护.html?' + params.join('&');
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.op-more')) closeAllOpMenus();
  });

  /* 筛选控件输入即实时过滤（并回到第一页） */
  ['fName', 'fIdcard', 'fPhone', 'fArchNo'].forEach(function (id) {
    $(id).addEventListener('input', function () { curPage = 1; renderTable(); });
  });
  ['fOrg', 'fRegion', 'fLock', 'fMarriage', 'fCrowd', 'fArchStatus', 'fMine'].forEach(function (id) {
    $(id).addEventListener('change', function () { curPage = 1; renderTable(); });
  });
  ['fBirthStart', 'fBirthEnd', 'fCreateStart', 'fCreateEnd'].forEach(function (id) {
    $(id).addEventListener('input', function () { curPage = 1; renderTable(); });
  });

  /* 复合筛选控件（管理机构/重点人群类型/管辖行政区）选择后实时过滤 */
  document.querySelectorAll('.filter-panel [data-fcp]').forEach(function (el) {
    el.addEventListener('click', function (e) {
      if (e.target.closest('.fcp-opt,.fcp-n,.fcp-clear')) {
        setTimeout(function () { curPage = 1; renderTable(); }, 0);
      }

  var SF_PAGE_SIZE = 20;
  var sfCurPage = 1;
  var sfLastList = [];

  function renderSelectTable() {
    var name = $('sfName').value.trim(), idType = $('sfIdType').value, idcard = $('sfIdcard').value.trim();
    var org = $('sfOrg').value, grid = $('sfGrid').value.trim();
    var gender = $('sfGender').value, age = $('sfAge').value.trim(), crowd = $('sfCrowd').value, region = $('sfRegion').value.trim();

    sfLastList = selectArchiveData.filter(function (r) {
      if (name && r.name.indexOf(name) === -1) return false;
      if (idType && r.idType !== idType) return false;
      if (idcard && r.idcard.indexOf(idcard) === -1) return false;
      if (gender && r.gender !== gender) return false;
      if (age && String(r.age) !== age) return false;
      if (crowd && r.crowd.indexOf(crowd) === -1) return false;
      if (region && r.region.indexOf(region) === -1) return false;
      return true;
    });

    var total = Math.max(1, Math.ceil(sfLastList.length / SF_PAGE_SIZE));
    if (sfCurPage > total) sfCurPage = total;
    var start = (sfCurPage - 1) * SF_PAGE_SIZE;
    var slice = sfLastList.slice(start, start + SF_PAGE_SIZE);

    var html = '';
    if (slice.length === 0) {
      html = '<tr class="empty-row"><td colspan="13" style="text-align:center;padding:24px;color:var(--text-tertiary)">暂无符合条件的居民档案</td></tr>';
    } else {
      slice.forEach(function (r, i) {
        var opHtml = '';
        if (r.op === 'create') {
          opHtml = '<a class="op-create" onclick="selectArchive(\'' + esc(r.archNo) + '\')">新建</a>';
        } else if (r.op === 'enter') {
          opHtml = '<a class="op-enter" onclick="enterArchive(\'' + esc(r.name) + '\')">进入专项</a>';
        } else {
          opHtml = '<span class="op-none">-</span>';
        }
        var crowdHtml = r.crowd ? '<span class="crowd-tag" title="' + esc(r.crowd) + '">' + esc(r.crowd) + '</span>' : '<span class="op-none">-</span>';
        var rsDot = r.rStatus === '正常' ? 'ok' : 'warn';
        var lkDot = r.lock === '未上锁' ? 'ok' : 'warn';
        html += '<tr>'
          + '<td class="center">' + (start + i + 1) + '</td>'
          + '<td title="' + esc(r.archNo) + '"><span class="cell">' + esc(r.archNo) + '</span></td>'
          + '<td>' + esc(r.name) + '</td>'
          + '<td class="center">' + esc(r.gender) + '</td>'
          + '<td class="center">' + r.age + '</td>'
          + '<td>' + esc(r.idType) + '</td>'
          + '<td title="' + esc(r.idcard) + '"><span class="cell">' + (r.idcard || '-') + '</span></td>'
          + '<td>' + crowdHtml + '</td>'
          + '<td>' + esc(r.region) + '</td>'
          + '<td title="' + esc(r.org) + '"><span class="cell">' + esc(r.org) + '</span></td>'
          + '<td><span class="st-dot ' + rsDot + '"></span>' + esc(r.rStatus) + '</td>'
          + '<td><span class="st-dot ' + lkDot + '"></span>' + esc(r.lock) + '</td>'
          + '<td class="center">' + opHtml + '</td>'
          + '</tr>';
      });
    }
    $('sfTbBody').innerHTML = html;
    $('sfTotal').textContent = sfLastList.length;
    renderSelectPager(total);
    $('sfJump').value = sfCurPage;
  }

  function renderSelectPager(total) {
    var nums = [];
    if (total <= 7) {
      for (var i = 1; i <= total; i++) nums.push(i);
    } else {
      nums.push(1);
      if (sfCurPage > 3) nums.push('…');
      for (var j = Math.max(2, sfCurPage - 1); j <= Math.min(total - 1, sfCurPage + 1); j++) nums.push(j);
      if (sfCurPage < total - 2) nums.push('…');
      nums.push(total);
    }
    var h = '<button class="pg-btn" onclick="sfGotoPage(' + (sfCurPage - 1) + ')">‹</button>';
    nums.forEach(function (n) {
      h += n === '…'
        ? '<span class="pg-ellipsis">…</span>'
        : '<button class="pg-btn' + (n === sfCurPage ? ' active' : '') + '" onclick="sfGotoPage(' + n + ')">' + n + '</button>';
    });
    h += '<button class="pg-btn" onclick="sfGotoPage(' + (sfCurPage + 1) + ')">›</button>';
    $('sfPager').innerHTML = h;
  }

  function sfGotoPage(p) {
    var total = Math.max(1, Math.ceil(sfLastList.length / SF_PAGE_SIZE));
    if (p < 1 || p > total || p === sfCurPage) return;
    sfCurPage = p;
    renderSelectTable();
  }

  function sfJumpPage() {

  function selectArchive(archNo) {
    var r = null;
    for (var i = 0; i < selectArchiveData.length; i++) {
      if (selectArchiveData[i].archNo === archNo) { r = selectArchiveData[i]; break; }
    }
    if (!r) return;
    closeSelectModal();
    var params = [
      'view=womanArchive',
      'edit=1',
      'name=' + encodeURIComponent(r.name),
      'gender=' + encodeURIComponent(r.gender === '男' ? '男性' : '女性'),
      'idcard=' + encodeURIComponent(r.idcard),
      'idType=' + encodeURIComponent(r.idType),
      'archNo=' + encodeURIComponent(r.archNo)
    ];
    if (r.idcard && /^\d{17}[\dXx]$/.test(r.idcard)) {
      params.push('birth=' + r.idcard.slice(6, 10) + '-' + r.idcard.slice(10, 12) + '-' + r.idcard.slice(12, 14));
    }
    location.href = '档案维护.html?' + params.join('&');
  }

        '西湖区': { '北山街道': ['北山社区','曙光社区'], '转塘街道': ['转塘社区','龙坞村'] }
      },
      '宁波市': {
        '海曙区': { '南门街道': ['南门社区','郎官社区'], '高桥镇': ['高桥社区','望春村'] }
      }
    },
    '山东省': {
      '济南市': {
        '历下区': { '解放路街道': ['解放路社区','十亩园社区'], '姚家街道': ['姚家社区','丁家村'] },
        '市中区': { '舜玉路街道': ['舜玉社区','玉函路社区'], '十六里河街道': ['十六里河社区','大涧沟村'] }
      },
      '青岛市': {
        '市南区': { '八大峡街道': ['八大峡社区','团岛社区'], '珠海路街道': ['珠海路社区','燕儿岛社区'] }
      }
    }
  };

  var addrPath = [];   /* 当前下钻路径（面板展开到第几级） */
  var addrSel = [];    /* 已选定的完整五级路径 */

  /* 取某路径下的子节点名称（第 5 级为字符串数组） */
  function addrNames(path) {
    var node = ADDR_TREE;
    for (var i = 0; i < path.length; i++) { node = node ? node[path[i]] : null; }
    if (Array.isArray(node)) return node;
    return node ? Object.keys(node) : [];
  }

  function addrColHtml(names, level) {
    if (!names.length) return '<div class="addr-col"><div class="addr-empty">暂无数据</div></div>';
    var parents = addrPath.slice(0, level);
    return '<div class="addr-col">' + names.map(function (n) {
      var path = parents.concat([n]);
      var on = (n === addrPath[level]) ||
        (addrSel[level] === n && addrSel.slice(0, level).join('/') === parents.join('/'));
      var hasKid = addrNames(path).length > 0;
      return '<div class="addr-n' + (on ? ' on' : '') + '" data-lv="' + level + '" data-nm="' + esc(n) + '">'
        + '<span class="addr-tx">' + esc(n) + '</span>'
        + (hasKid ? '<span class="addr-arrow">›</span>' : '')
        + '</div>';
    }).join('') + '</div>';
  }

  function renderAddrPanel() {
    var html = addrColHtml(addrNames([]), 0);
    for (var k = 0; k < addrPath.length; k++) {
      var names = addrNames(addrPath.slice(0, k + 1));
      if (!names.length) break;
      html += addrColHtml(names, k + 1);
    }
    $('addrPanel').innerHTML = html;
    positionAddrPanel();
    scrollActiveIntoView();
  }

  /* 已选项超出列可视区时，列内滚动使其居中可见（如扬州市排在市列表末尾） */
  function scrollActiveIntoView() {
    Array.prototype.forEach.call(document.querySelectorAll('#addrPanel .addr-col'), function (col) {
      var on = col.querySelector('.addr-n.on');
      if (!on) return;
      var top = on.offsetTop, h = on.offsetHeight;
      if (top < col.scrollTop || top + h > col.scrollTop + col.clientHeight) {
        col.scrollTop = Math.max(0, top - (col.clientHeight - h) / 2);
      }
    });
  }

  /* 面板跟随触发框定位：始终自选择框向下展开，高度自适应视口剩余空间，右侧越界则左移 */
  function positionAddrPanel() {
    var panel = $('addrPanel'), box = $('addrCasBox');
    if (!box || !panel.classList.contains('show')) return;
    var r = box.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    var below = vh - (r.bottom + 4) - 10;   /* 选择框下方可用空间 */
    var above = r.top - 14;                 /* 上方可用空间（下方极小时才向上） */
    var up = below < 150 && above > below;
    var avail = Math.max(120, Math.min(268, up ? above : below));

    panel.style.maxHeight = avail + 'px';
    var cols = panel.querySelectorAll('.addr-col');
    Array.prototype.forEach.call(cols, function (c) { c.style.maxHeight = ''; });
    var ph = panel.offsetHeight;            /* 面板被 max-height 收敛后的实际高度 */
    Array.prototype.forEach.call(cols, function (c) { c.style.maxHeight = Math.max(90, ph - 12) + 'px'; });

    var left = r.left, top = up ? (r.top - 4 - ph) : (r.bottom + 4);
    if (left + panel.offsetWidth > vw - 8) left = vw - 8 - panel.offsetWidth;
    if (left < 8) left = 8;
    if (top < 8) top = 8;
    panel.style.left = Math.round(left) + 'px';
    panel.style.top = Math.round(top) + 'px';
  }

  /* 回填：隐藏域存完整地址（无缝拼接），触发框显示末三级便于识别 */
  function setAddrValue(path) {
    $('cmRegion').value = path.join('');
    var txt = $('cmRegionText');
    txt.textContent = path.length ? path.slice(-3).join(' / ') : '请选择现住址';
    txt.classList.toggle('is-ph', !path.length);
    txt.title = path.length ? path.join(' / ') : '请选择现住址';
    $('addrCas').classList.toggle('has-val', path.length > 0);
    renderPreview();
  }

  function openAddrPanel() {
    addrPath = addrSel.slice();
    $('addrCas').classList.add('open');
    $('addrPanel').classList.add('show');
    renderAddrPanel();
  }
  function closeAddrPanel() {
    $('addrCas').classList.remove('open');
    $('addrPanel').classList.remove('show');
  }
  function toggleAddrPanel() {
    if ($('addrPanel').classList.contains('show')) closeAddrPanel();
    else openAddrPanel();
  }

  /* 点击：有下级则下钻，末级（村社区）则选中并回填 */
  document.addEventListener('click', function (e) {
    if (e.target.closest('#addrCasBox')) { toggleAddrPanel(); return; }
    var node = e.target.closest('#addrPanel .addr-n');
    if (node) {
      var lv = parseInt(node.getAttribute('data-lv'), 10), nm = node.getAttribute('data-nm');
      var path = addrPath.slice(0, lv).concat([nm]);
      if (addrNames(path).length) { addrPath = path; renderAddrPanel(); }
      else { addrSel = path; setAddrValue(path); closeAddrPanel(); }
      return;
    }
    if (!e.target.closest('#addrPanel')) closeAddrPanel();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAddrPanel(); });
  window.addEventListener('resize', positionAddrPanel);
  window.addEventListener('scroll', function (e) {
    /* 面板内各列自身滚动不关闭，其它滚动一律收起 */
    if (e.target && e.target.classList && e.target.classList.contains('addr-col')) return;
    closeAddrPanel();
  }, true);

  /* ================= 新建妇女档案弹框（版式与「居民档案列表」的新建弹框一致） ================= */
  function pvRow(label, val, wide) {
    return '<div class="pv-row' + (wide ? ' wide' : '') + '"><span class="pv-label">' + label + '</span><span class="pv-val">' + esc(val || '') + '</span></div>';
  }

  /* 回显卡渲染：左侧表单实时联动 */
  function renderPreview() {
    var region = $('cmRegion').value, detail = $('cmAddr').value.trim();
    var addr = region ? region + detail : detail;
    $('pvCard').innerHTML =
      pvRow('姓名：', $('cmName').value.trim()) +
      pvRow('民族：', $('cmNation').value) +
      pvRow('出生年月：', $('cmBirth').value, true) +
      pvRow('证件类型：', $('cmIdType').value) +
      pvRow('证件号：', $('cmIdcard').value.trim()) +
      pvRow('联系地址：', addr, true);
  }

  /* 点击「新建」：直接打开新建妇女档案弹框（证件类型 / 民族带默认值，回显卡同步显示） */
  function openCreateModal() {
    $('cmIdType').value = '居民身份证';
    $('cmIdcard').value = ''; $('cntIdcard').textContent = '0/18';
    $('cmName').value = '';   $('cntName').textContent = '0/8';
    $('cmGender').value = '';
    $('cmNation').value = '汉族';
    $('cmPhone').value = '';
    var birth = $('cmBirth'); birth.type = 'text'; birth.value = '';
    $('cmRegion').value = '';
    addrPath = []; addrSel = []; setAddrValue([]);
    $('cmAddr').value = ''; $('cntAddr').textContent = '0/50';
    renderPreview();
    $('createModal').classList.add('show');
  }

  function closeCreateModal() {
    closeAddrPanel();
    $('createModal').classList.remove('show');
  }

  /* 证件号满 18 位：自动解析出生日期与性别（身份证第 7-14 位出生段、第 17 位奇偶判性别） */
  function parseIdcard() {
    var v = $('cmIdcard').value.trim();
    if (!/^\d{17}[\dXx]$/.test(v)) return;
    $('cmBirth').value = v.slice(6, 10) + '-' + v.slice(10, 12) + '-' + v.slice(12, 14);
    $('cmGender').value = (parseInt(v[16], 10) % 2 === 1) ? '男性' : '女性';
    toast('已根据证件号自动填充出生日期与性别', 'success');
  }

  /* 下一步：校验必填项 → 携带信息进入档案维护界面的「妇女档案」菜单 */
  function submitCreate() {
    var missing = [];
    if (!$('cmIdType').value) missing.push('证件类型');
    var idcard = $('cmIdcard').value.trim();
    if (!idcard) missing.push('证件号');
    else if (!/^\d{17}[\dXx]$/.test(idcard)) { toast('证件号格式不正确，需为 18 位', 'warning'); return; }
    if (!$('cmName').value.trim()) missing.push('姓名');
    if (!$('cmGender').value) missing.push('性别');
    if (!$('cmNation').value) missing.push('民族');
    if (!$('cmPhone').value.trim()) missing.push('联系电话');
    if (!$('cmBirth').value) missing.push('出生日期');
    if (!$('cmRegion').value || !$('cmAddr').value.trim()) missing.push('联系地址');
    if (missing.length) { toast('请完善必填项：' + missing.join('、'), 'warning'); return; }
    closeCreateModal();
    var p = new URLSearchParams();
    p.set('view', 'womanArchive');
    p.set('edit', '1');
    p.set('name', $('cmName').value.trim());
    p.set('gender', $('cmGender').value);
    p.set('idType', $('cmIdType').value);
    p.set('idcard', $('cmIdcard').value.trim());
    p.set('birth', $('cmBirth').value);
    p.set('phone', $('cmPhone').value.trim());
    p.set('nation', $('cmNation').value);
    p.set('region', $('cmRegion').value);
    p.set('addr', $('cmAddr').value.trim());
    location.href = '档案维护.html?' + p.toString();
  }

  /* 弹框联动事件（联系地址由级联控件回填时主动触发 renderPreview） */
  ['cmIdType', 'cmGender', 'cmNation', 'cmBirth'].forEach(function (id) {
    $(id).addEventListener('change', renderPreview);
  });
  $('cmPhone').addEventListener('input', renderPreview);
  $('cmIdcard').addEventListener('input', function () {
    $('cntIdcard').textContent = this.value.length + '/18';
    if (this.value.length === 18) parseIdcard();
    renderPreview();
  });
  $('cmName').addEventListener('input', function () {
    $('cntName').textContent = this.value.length + '/8';
    renderPreview();
  });
  $('cmAddr').addEventListener('input', function () {
    $('cntAddr').textContent = this.value.length + '/50';
    renderPreview();
  });

  /* 初始渲染 */
  renderTable();
</script>

<div id="opMenu"></div>
<!-- 联系地址五级级联面板（挂在 body 下，避免被弹框的 overflow:hidden 裁剪） -->
<div class="addr-panel" id="addrPanel"></div>
</body>
</html>
