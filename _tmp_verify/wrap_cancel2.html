<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  .fake-top{height:72px;background:#007AFF}
  iframe{width:100%;height:calc(100% - 72px);border:0;display:block}
</style>
</head>
<body>
<div class="fake-top"></div>
<iframe id="f" src="../01-%E5%85%AC%E5%85%B1%E5%8D%AB%E7%94%9F%E6%9C%8D%E5%8A%A1%E7%B3%BB%E7%BB%9F%E4%BA%A7%E5%93%81%E6%96%87%E6%A1%A3/V1.0/02.%E9%9C%80%E6%B1%82%E8%AE%BE%E8%AE%A1/%E5%8E%9F%E5%9E%8B%E8%AE%BE%E8%AE%A1/%E5%AE%B6%E5%BA%AD%E6%A1%A3%E6%A1%88.html?embed=1" onload="onFrame()"></iframe>
<script>
function onFrame() {
  try {
    var w = document.getElementById('f').contentWindow;
    var d = w.document;
    if (typeof w.openCreateView !== 'function') { document.title = 'NOFUNC'; return; }
    w.openCreateView();
    w.pickMember('32101211811812487');
    w.saveFamily();
    w.tipGotoMember();
    function addMember(no, rel, blood) {
      w.openMemberModal('member');
      w.memberRowClick(no);
      d.getElementById('mmRel').value = rel;
      d.getElementById('mmBlood').value = blood;
      w.saveMemberRow();
    }
    addMember('32101211811812486', '配偶', '直系血缘关系');
    addMember('32101210010000308', '之子', '直系血缘关系');
    var row2 = d.querySelectorAll('#memTbody tr')[1];
    row2.querySelector('.op-act.danger').click();
    w.confirmCancelMember();
    
    var rows = d.querySelectorAll('#memTbody tr');
    var nums = [];
    rows.forEach(function (r) { nums.push(r.children[0].textContent + '.' + r.children[1].textContent); });
    var div = d.createElement('div');
    div.style.cssText = 'position:fixed;left:0;bottom:0;background:#000;color:#0f0;font:12px monospace;z-index:99999;padding:3px 8px;max-width:100%';
    div.textContent = 'rows=' + rows.length + ' [' + nums.join(' | ') + ']'
      + ' modalShown=' + d.getElementById('cancelModal').classList.contains('show')
      + ' modalText=' + d.getElementById('cancelText').textContent.replace(/注销后该成员将从本家庭档案中移除/, '');
    d.body.appendChild(div);
    document.title = 'OK';
  } catch (e) { document.title = 'ERR:' + e.message; }
}
</script>
</body>
</html>
