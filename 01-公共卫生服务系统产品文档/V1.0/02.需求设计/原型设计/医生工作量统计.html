<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医生工作量统计 - 业务统计</title>
<link rel="stylesheet" href="框架.css">
<style>
  html.embed-mode .main-area{height:100%}
  html.embed-mode .tabbar{display:none}
  html.embed-mode .toast{top:24px}

  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}

  /* ===== 页头 ===== */
  .page-head .right .btn{height:30px;padding:0 14px;font-size:13px}

  /* ===== 统计 TAB（卡片式标签：底部基准线 + 选中项描边并与内容区连通） ===== */
  /* align-items:flex-end 让选中项凭 margin-bottom:-1px 真正压住基准线，实现「与内容区连通」 */
  .stat-tabs{display:flex;flex-wrap:wrap;padding:14px 16px 0;border-bottom:1px solid var(--color-neutral-300);flex-shrink:0;background:var(--bg-white);align-items:flex-end}
  .stat-tab{height:32px;padding:0 18px;margin-right:-1px;border:1px solid var(--color-neutral-300);border-bottom:0;border-radius:3px 3px 0 0;background:var(--bg-white);color:#404040;font-size:14px;cursor:pointer;transition:color var(--transition-fast),border-color var(--transition-fast);display:inline-flex;align-items:center;white-space:nowrap}
  .stat-tab:hover{color:var(--primary);border-color:var(--primary)}
  .stat-tab.active{position:relative;z-index:1;margin-bottom:-1px;color:var(--primary);border-color:var(--primary)}

  /* ===== 筛选区 ===== */
  .filter-panel{padding:14px 16px 0;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 26px;margin-bottom:10px}
  /* 折叠行：隐藏声明必须排在 .filter-row 之后 */
  .filter-row.extra{display:none}
  .filter-row.extra.show{display:flex}
  /* 标签与控件之间不留 gap：设计稿的视觉留白来自全角冒号的字宽 */
  .filter-item{display:flex;align-items:center}
  .filter-item label{font-size:14px;color:var(--text-secondary);white-space:nowrap}
  .fi-ctl{width:180px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-select{width:180px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fi-ctl:focus,.fi-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  .fi-select.is-placeholder{color:var(--text-placeholder)}
  /* 日期区间：单一外框（开始日期 ~ 结束日期 + 日历图标），默认值 2026-01-01 ~ 2026-12-31 */
  .fi-range{display:flex;align-items:center;gap:6px;width:232px;height:32px;padding:0 8px 0 10px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);background:var(--bg-white);transition:all var(--transition-fast)}
  .fi-range:hover{border-color:var(--primary)}
  .fi-range:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-range input{flex:1 1 0;min-width:0;height:30px;border:none;background:transparent;outline:none;padding:0;font-size:14px;color:var(--text-primary);font-family:inherit}
  .fi-range input::placeholder{color:var(--text-placeholder)}
  .fi-range input::-webkit-calendar-picker-indicator{display:none}
  .fi-tilde{flex-shrink:0;font-size:14px;color:var(--text-placeholder)}
  .fi-cal{width:14px;height:14px;flex-shrink:0;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14' fill='none' stroke='%23bfbfbf' stroke-width='1.2'%3E%3Crect x='1.4' y='2.4' width='11.2' height='10.2' rx='1.6'/%3E%3Cpath d='M1.4 5.6h11.2M4.6 1.4v2M9.4 1.4v2'/%3E%3C/svg%3E") no-repeat center/contain}
  /* 比较符（86px，设计稿实测 96 ÷ 1.094）+ 数值框（180px，单位内嵌右对齐） */
  .fi-pair{display:flex;align-items:center;gap:6px}
  .fi-cmp{width:86px}
  .fi-suffix{position:relative;display:flex;align-items:center}
  .fi-suffix .fi-ctl{width:180px;padding-right:56px}
  .fi-suffix>span{position:absolute;right:10px;font-size:14px;color:var(--text-placeholder);pointer-events:none;white-space:nowrap}
  /* 复合控件（机构多选 / 管辖网格树 / 管辖行政区级联）：框架默认 190 → 180 */
  .filter-panel .fcp-ms,.filter-panel .fcp-tree,.filter-panel .fcp-cas{width:180px}
  /* 面板宽度：网格树与行政区级联按设计稿=框宽起算（框架分别为 232 / 内容宽） */
  .filter-panel .fcp-tree .fcp-panel{width:auto;min-width:100%}
  .filter-panel .fcp-cas .fcp-panel{min-width:100%}
  /* 面板选项行高对齐设计稿（约 33px；框架默认 35px） */
  .filter-panel .fcp-opt{padding:6px 12px}
  /* 末行右侧操作区：重置 / 查询 /（存在折叠行时）展开·收起 */
  .filter-tail{margin-left:auto;display:flex;flex:0 0 auto;align-items:center;gap:16px}
  .filter-btns{display:flex;gap:8px;align-items:center}
  /* 「展开 ▼ / 收起 ▲」为纯文字按钮（设计稿无描边、蓝字） */
  .btn-link{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 2px;border:none;background:none;font-family:inherit;font-size:14px;color:var(--primary);cursor:pointer}
  .btn-link:hover{opacity:.8}
  .btn-link .caret{font-size:10px;line-height:1}

  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}
  .list-tbl th:last-child,.list-tbl td:last-child{position:sticky;right:0}
  .list-tbl td:last-child{z-index:2;background-color:var(--bg-white)}
  .list-tbl th:last-child{z-index:6}
  .list-tbl{width:100%;min-width:1500px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:36px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:36px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:nth-child(even) td{background:var(--bg-table-even)}
  .list-tbl tbody tr:hover td{background:var(--primary-bg)}
  .list-tbl tbody tr.sel td{background:#EAF3FF}
  .table-wrap.hs-scrolled .list-tbl thead th:last-child,
  .table-wrap.hs-scrolled .list-tbl tbody tr td:last-child{
    background-image:linear-gradient(to right,rgba(0,0,0,0.10),rgba(0,0,0,0));
    background-repeat:no-repeat;background-size:9px 100%;background-position:left center;
  }
  .list-tbl .center{text-align:center}
  .list-tbl .num{font-family:Consolas,'Microsoft YaHei',monospace;text-align:right}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 状态点 / 标签 */
  .st-dot{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .st-dot i{width:7px;height:7px;border-radius:50%;flex:none}
  .st-green i{background:#52C41A}
  .st-yellow i{background:#F5A623}
  .st-red i{background:#F5222D}
  .st-gray i{background:#C0C4CC}
  .st-blue i{background:#1890FF}
  .type-tag{display:inline-block;padding:0 8px;height:18px;line-height:18px;border-radius:9px;font-size:12px}
  .type-tag.in{background:#E6F7FF;color:#1890FF}
  .type-tag.out{background:#F9F0FF;color:#7A3FF2}

  .op-link{color:var(--primary);cursor:pointer;font-size:13px}
  .op-link:hover{text-decoration:underline}
  .op-gap{display:inline-block;width:8px}

  /* 空状态 */
  .empty-td{height:200px;text-align:center;color:var(--text-tertiary)}
  .empty-box{display:inline-flex;flex-direction:column;align-items:center;gap:10px}
  .empty-box svg{width:56px;height:56px;stroke:#C9CFD8;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .empty-box p{font-size:13px;color:var(--text-placeholder)}

  /* ===== 分页 ===== */
  .page-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;height:44px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .pg-size select{height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 22px 0 8px;font-size:13px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer}
  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}
  .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .pg-btn.disabled{color:var(--text-disabled);cursor:not-allowed;border-color:#EBEBEB}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
</style>
</head>

      <div class="stat-tabs" id="statTabs"></div>
      <div class="filter-panel" id="filterPanel"></div>

          <tbody id="tbody"></tbody>

      </div>
      <div class="page-foot">

        <div class="pg-size">

          <button class="pg-btn disabled">&gt;</button>
        </div>

    </div>
  </div>

</div>

        ] },
        { items: [
          { type: 'select', label: '主要疾病', key: 'dis', opts: DIS1 },
          { type: 'input',  label: '姓名', key: 'name', ph: '请输入' },
          { type: 'input',  label: '证件号', key: 'id',  ph: '请输入' }
        ] }
      ],
      cols: [
        { label: '序号', w: 52,  c: 1, t: function (r, i) { return i + 1; } },
        { label: '指导机构', w: 210, render: function (r) { return r.org; } },
        { label: '姓名', w: 84,  render: function (r) { return r.name; } },
        { label: '证件号', w: 150, render: function (r) { return r.id; } },
        { label: '证件类型', w: 90,  render: function (r) { return r.idType; } },
        { label: '性别', w: 58,  c: 1, render: function (r) { return r.sex; } },
        { label: '年龄', w: 58,  c: 1, render: function (r) { return r.age; } },
        { label: '联系电话', w: 118, render: function (r) { return r.phone; } },
        { label: '主要疾病', w: 120, render: function (r) { return r.dis; } },
        { label: '指导日期', w: 108, render: function (r) { return r.ddate; } },
        { label: '指导医生', w: 90,  render: function (r) { return r.doc; } },
        { label: '指导来源', w: 90,  render: function (r) { return r.src; } },
        { label: '居民状态', w: 100, render: function (r) { return '<span class="st-dot st-green"><i></i>' + esc(r.st) + '</span>'; } },
        { label: '操作', w: 80,  c: 1, render: function (r) { return '<a class="op-link" onclick="toast(\'查看 ' + esc(r.name) + ' 膳食处方\',\'info\')">查看</a>'; } }
      ]
    }
  };

  /* ================= 渲染 ================= */
  var curTab = 'summary';
  var curRows = [];

  function renderTabs() {
    $('statTabs').innerHTML = Object.keys(TABS).map(function (k) {
      var t = TABS[k];
      return '<span class="stat-tab' + (k === curTab ? ' active' : '') + '" onclick="switchTab(\'' + k + '\')">' + esc(t.label) + '</span>';
    }).join('');
  }

  /* 日期区间内的输入框：聚焦时切原生 date 并唤起选择器，失焦且为空则还原为文本占位 */
  function pickDate(el) { el.type = 'date'; try { el.showPicker(); } catch (e) { } }
  function blurDate(el) { if (!el.value) el.type = 'text'; }

  /* 数值框：单位（% / mmHg / mmol/L）内嵌在框内右对齐、浅灰、不可点 */
  function numCtl(f) {
    return '<span class="fi-suffix"><input class="fi-ctl fi-num" placeholder="' + (f.ph || '请输入') + '" data-k="' + f.key + '-val" oninput="filterRows()">'
      + (f.unit ? '<span class="fi-unit">' + f.unit + '</span>' : '')
      + '</span>';
  }

  function filterItemHtml(f) {
    var ph = f.ph || '';
    var label = f.noLabel ? '' : f.label + '：';
    if (f.type === 'select') {
      return '<div class="filter-item"><label>' + label + '</label><select class="fi-select is-placeholder" data-k="' + f.key + '" onchange="markSelect(this);filterRows()">' + opts(f.opts) + '</select></div>';
    }
    /* 日期区间：单一外框（开始 ~ 结束 + 日历图标），带默认值 2026-01-01 ~ 2026-12-31 */
    if (f.type === 'daterange') {
      return '<div class="filter-item"><label>' + f.label + '：</label>'
        + '<span class="fi-range">'
        + '<input type="text" value="' + (f.start || '') + '" data-def="' + (f.start || '') + '" placeholder="开始日期" data-k="' + f.key + '-start" onfocus="pickDate(this)" onblur="blurDate(this)" oninput="filterRows()">'
        + '<span class="fi-tilde">~</span>'
        + '<input type="text" value="' + (f.end || '') + '" data-def="' + (f.end || '') + '" placeholder="结束日期" data-k="' + f.key + '-end" onfocus="pickDate(this)" onblur="blurDate(this)" oninput="filterRows()">'
        + '<span class="fi-cal"></span>'
        + '</span></div>';
    }
    /* 比较符 + 数值 + 单位（收缩压 / 舒张压 / 空腹血糖 / 档案完整度） */
    if (f.type === 'cmpnum') {
      return '<div class="filter-item"><label>' + label + '</label>'
        + '<span class="fi-pair">'
        + '<select class="fi-select fi-cmp is-placeholder" data-k="' + f.key + '-cmp" onchange="markSelect(this);filterRows()">' + opts(CMP) + '</select>'
        + numCtl(f)
        + '</span></div>';
    }
    /* 机构多选（复选框）；面板选项默认取框架机构池 */
    if (f.type === 'fcpms') {
      var dopts = f.opts ? ' data-options="' + f.opts.join('|') + '"' : '';
      return '<div class="filter-item"><label>' + label + '</label>'
        + '<div class="fcp-ms" data-fcp="ms"' + dopts + '>'
        + '<div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>'
        + '<div class="fcp-panel"></div>'
        + '<input type="hidden" class="fcp-val" data-k="' + f.key + '">'
        + '</div></div>';
    }
    /* 管辖网格（树形，叶子可选） */
    if (f.type === 'fcptree') {
      return '<div class="filter-item"><label>' + label + '</label>'
        + '<div class="fcp-tree" data-fcp="tree" data-tree=\'' + GRID_TREE_JSON + '\'>'
        + '<div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>'
        + '<div class="fcp-panel"></div>'
        + '<input type="hidden" class="fcp-val" data-k="' + f.key + '">'
        + '</div></div>';
    }
    /* 管辖行政区（省 / 市 / 区 级联，取末级节点为值） */
    if (f.type === 'fcpcas') {
      return '<div class="filter-item"><label>' + label + '</label>'
        + '<div class="fcp-cas" data-fcp="cas" data-caret>'
        + '<div class="fcp-box"><span class="fcp-text is-ph">请选择</span><span class="fcp-clear" title="清空">×</span></div>'
        + '<div class="fcp-panel"></div>'
        + '<input type="hidden" class="fcp-val" data-k="' + f.key + '">'
        + '</div></div>';
    }
    return '<div class="filter-item"><label>' + label + '</label><input class="fi-ctl" placeholder="' + ph + '" data-k="' + f.key + '" oninput="filterRows()"></div>';
  }

  /* 末行右侧操作区：重置 / 查询 /（存在折叠行时）展开·收起 */
  function tailHtml() {
    var hasExtra = TABS[curTab].filters.some(function (r) { return r.extra; });
    return '<div class="filter-tail">'
      + '<div class="filter-btns">'
      + '<button class="btn btn-default" onclick="resetFilter()">重置</button>'
      + '<button class="btn btn-primary" onclick="queryFilter()">查询</button>'
      + '</div>'
      + (hasExtra ? '<button type="button" class="btn-link btn-toggle" onclick="toggleExtra()">展开 <span class="caret">▼</span></button>' : '')
      + '</div>';
  }

  /* 操作区始终贴在「最后一个可见行」右侧：折叠时随之移到上一行 */
  function placeTail() {
    var panel = $('filterPanel');
    var tail = panel.querySelector('.filter-tail');
    if (!tail) return;
    var target = null;
    panel.querySelectorAll('.filter-row').forEach(function (row) {
      if (row.classList.contains('extra') && !row.classList.contains('show')) return;
      target = row;
    });
    if (target && tail.parentNode !== target) target.appendChild(tail);
  }

  /* 展开 / 收起折叠行，并同步按钮文案（收起 ▲ / 展开 ▼） */
  function toggleExtra() {
    var panel = $('filterPanel');
    var rows = panel.querySelectorAll('.filter-row.extra');
    if (!rows.length) return;
    var show = !rows[0].classList.contains('show');
    rows.forEach(function (row) { row.classList.toggle('show', show); });
    var btn = panel.querySelector('.btn-toggle');
    if (btn) btn.innerHTML = show ? '收起 <span class="caret">▲</span>' : '展开 <span class="caret">▼</span>';
    placeTail();
  }

  function renderFilter() {
    var t = TABS[curTab];
    var html = '';
    t.filters.forEach(function (rowDef) {
      html += '<div class="filter-row' + (rowDef.extra ? ' extra' : '') + '">';
      rowDef.items.forEach(function (f) { html += filterItemHtml(f); });
      html += '</div>';
    });
    html += tailHtml();
    $('filterPanel').innerHTML = html;
    /* 面板每次重建，需重新初始化复合控件并重绑实时过滤
       （复选框走 change；点整行对勾 / 树节点 / 下钻 / 清空走 click） */
    if (window.fcpInit) window.fcpInit();
    $('filterPanel').querySelectorAll('[data-fcp]').forEach(function (el) {
      el.addEventListener('change', function () { setTimeout(filterRows, 0); });
      el.addEventListener('click', function (e) {
        if (e.target.closest('.fcp-opt,.fcp-n,.fcp-clear,.fcp-box')) setTimeout(filterRows, 0);
      });
    });
    placeTail();
  }

  function renderTable() {
    var t = TABS[curTab];
    var cols = t.cols;
    var colgroup = cols.map(function (c) { return '<col style="width:' + c.w + 'px">'; }).join('');
    var thead = '<tr>' + cols.map(function (c) {
      return '<th class="' + (c.c ? 'center' : '') + '">' + esc(c.label) + '</th>';
    }).join('') + '</tr>';

    if (!curRows.length) {
      $('colgroup').innerHTML = colgroup;
      $('thead').innerHTML = thead;
      $('tbody').innerHTML = '<tr><td class="empty-td" colspan="' + cols.length + '"><div class="empty-box">'
        + '<svg viewBox="0 0 24 24"><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M3 8h18l-2.5-4h-13z"/><line x1="10" y1="12" x2="14" y2="12"/></svg>'
        + '<p>暂无数据</p></div></td></tr>';
      $('total').textContent = 0;
      return;
    }

    var body = curRows.map(function (r, i) {
      return '<tr>' + cols.map(function (c, ci) {
        var v = c.t ? c.t(r, i) : (c.render ? c.render(r) : '-');
        var cls = c.c ? 'center' : (c.num ? 'num' : '');
        return '<td class="' + cls + '">' + v + '</td>';
      }).join('') + '</tr>';
    }).join('');

    $('colgroup').innerHTML = colgroup;
    $('thead').innerHTML = thead;
    $('tbody').innerHTML = body;
    $('total').textContent = curRows.length;
  }

  /* 按 data-k 逐控件取值再过滤：避免「日期区间占两个输入」造成的下标错位 */
  function filterRows() {
    var t = TABS[curTab];
    var v = {};
    $('filterPanel').querySelectorAll('[data-k]').forEach(function (el) {
      v[el.getAttribute('data-k')] = el.value ? String(el.value).trim() : '';
    });
    var defs = [];
    t.filters.forEach(function (rd) { rd.items.forEach(function (f) { defs.push(f); }); });

    curRows = t.rows.filter(function (r) {
      return defs.every(function (f) {
        var rv = r[f.field || f.key];
        /* 机构多选：任一命中即保留（机构名在不同维度下写法不同，按双向包含匹配） */
        if (f.type === 'fcpms') {
          var orgs = (v[f.key] || '').split(',').filter(Boolean);
          if (!orgs.length) return true;
          if (rv === undefined || rv === null) return true;
          var os = String(rv);
          if (os === '') return false;
          return orgs.some(function (x) { return os === x || os.indexOf(x) !== -1 || x.indexOf(os) !== -1; });
        }
        /* 管辖网格（树形多选，叶子为「镇 + 第N网格」） */
        if (f.type === 'fcptree') {
          var gsel = (v[f.key] || '').split(',').filter(Boolean);
          if (!gsel.length) return true;
          if (rv === undefined || rv === null) return true;
          var gs = String(rv);
          if (gs === '') return false;
          return gsel.some(function (x) { return gs === x || gs.indexOf(x) !== -1; });
        }
        /* 管辖行政区（级联，值为末级节点名） */
        if (f.type === 'fcpcas') {
          var cq = v[f.key] || '';
          if (!cq) return true;
          if (rv === undefined || rv === null) return true;
          var cs = String(rv);
          if (cs === '') return false;
          return cs === cq || cs.indexOf(cq) !== -1 || cq.indexOf(cs) !== -1;
        }
        /* 比较符 + 数值：两者都填才生效（只填数值不比较，避免误筛成 0 条） */
        if (f.type === 'cmpnum') {
          var cop = v[f.key + '-cmp'] || '', cnum = v[f.key + '-val'] || '';
          if (!cop || !cnum) return true;
          var nv = parseFloat(cnum), dv = parseFloat(rv);
          if (isNaN(nv)) return true;
          if (isNaN(dv)) return false;
          if (cop === '≥') return dv >= nv;
          if (cop === '≤') return dv <= nv;
          return dv === nv;
        }
        /* 日期区间：单外框两个输入，按 key-start / key-end 取值 */
        if (f.type === 'daterange') {
          var s = v[f.key + '-start'] || '', e = v[f.key + '-end'] || '';
          if (!s && !e) return true;
          if (rv === undefined || rv === null || rv === '') return true;   /* 该行无此日期字段则不参与 */
          var ds = String(rv);
          if (s && ds < s) return false;
          if (e && ds > e) return false;
          return true;
        }
        var q = v[f.key] || '';
        if (!q) return true;
        if (rv === undefined || rv === null) return true;
        var rs = String(rv);
        if (rs === '') return false;
        if (f.type === 'input') return rs.toLowerCase().indexOf(q.toLowerCase()) !== -1;
        return rs === q || rs.indexOf(q) !== -1 || q.indexOf(rs) !== -1;
      });
    });
    renderTable();
  }

  function resetFilter() {
    $('filterPanel').querySelectorAll('[data-k]').forEach(function (el) {
      if (el.classList.contains('fcp-val')) { el.value = ''; return; }   /* 复合控件：赋值后视图同步回「请选择」 */
      if (el.tagName === 'SELECT') { el.value = ''; markSelect(el); }
      else { el.value = el.getAttribute('data-def') || ''; if (el.type === 'date') el.type = 'text'; }
    });
    filterRows();
    toast('已重置', 'info');
  }

  function queryFilter() {
    filterRows();
    toast('查询完成，共 ' + $('total').textContent + ' 条记录', 'success');
  }

  function switchTab(k) {
    curTab = k;
    curRows = TABS[k].rows.slice();
    renderTabs();
    renderFilter();
    renderTable();
    var wrap = $('tableWrap');
    if (wrap.scrollLeft) { wrap.scrollLeft = 0; updShadow(); }
  }

  /* ================= 操作列冻结阴影 ================= */
  function updShadow() {
    var wrap = $('tableWrap');
    wrap.classList.toggle('hs-scrolled', wrap.scrollLeft > 0);
  }

  /* ================= 初始化 ================= */
  switchTab('summary');
  (function () {
    var wrap = $('tableWrap');
    wrap.addEventListener('scroll', updShadow, { passive: true });
    window.addEventListener('resize', updShadow);
    updShadow();
  })();

  /* 便于评审 / 截图：?tab=summary|hyp|dm|copd|transfer|diet */
  (function () {
    var q = new URLSearchParams(location.search);
    var t = q.get('tab');
    if (t && TABS[t]) switchTab(t);
  })();
</script>

</body>
