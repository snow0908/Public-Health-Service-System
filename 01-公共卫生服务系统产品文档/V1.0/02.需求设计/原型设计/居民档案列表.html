<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>居民档案 - 档案管理</title>
<link rel="stylesheet" href="框架.css">
<style>
  /* ===== 居民档案列表页面特有样式（设计变量与公共样式见 框架.css） ===== */

  /* ===== 嵌入模式（被 index.html 壳子以 iframe 内嵌时，框架.js 自动加 html.embed-mode） ===== */
  html.embed-mode .main-area{height:100%}      /* 壳子内自适应：无顶部导航栏包裹 */
  html.embed-mode .tabbar{display:none}        /* 标签栏由壳子统一管理，本页隐藏 */
  html.embed-mode .toast{top:24px}             /* 壳内提示位置上移 */

  /* ===== 布局：content 改为 flex，content-card 撑满并让表格区内部滚动 ===== */
  .content{display:flex;overflow:hidden}
  .content .content-card{flex:1;min-height:0;min-width:0}

  /* ===== 页头按钮 ===== */
  .page-head .right .btn{height:28px;padding:0 14px;font-size:13px}

  /* ===== 筛选区（4 列栅格；第 5 列为行尾按钮区） =====
     收起：常显 8 个条件（2 行）；展开：再追加 16 个条件（4 行） */
  .filter-panel{padding:14px 12px 16px;border-bottom:1px solid #E8E8E8;flex-shrink:0;background:var(--bg-white)}
  .filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:14px 16px;align-items:center}
  .filter-item{display:flex;align-items:center;gap:6px;min-width:0}
  .filter-item>label{font-size:14px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  /* 仅展开时出现 */
  .filter-item.extra,.filter-check.extra{display:none}
  .filter-grid.expanded .filter-item.extra{display:flex}
  .filter-grid.expanded .filter-check.extra{display:inline-flex}
  .fi-ctl,.fi-select{flex:1 1 0;min-width:0;max-width:190px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fi-select{padding:0 26px 0 10px;appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fi-ctl:focus,.fi-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fi-ctl::placeholder{color:var(--text-placeholder)}
  /* 下拉未选择时按占位灰展示 */
  .fi-select.is-placeholder{color:var(--text-placeholder)}
  /* 日期区间：开始日期 ~ 结束日期 + 右侧日历图标 */
  .fi-range{display:flex;align-items:center;gap:5px;flex:1 1 0;min-width:0;max-width:230px;padding-right:22px;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23bfbfbf' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2'/%3E%3Cline x1='16' y1='2' x2='16' y2='6'/%3E%3Cline x1='8' y1='2' x2='8' y2='6'/%3E%3Cline x1='3' y1='10' x2='21' y2='10'/%3E%3C/svg%3E") no-repeat right 2px center}
  .fi-range .fi-ctl{max-width:none;padding:0 6px;text-align:center}
  .fi-range .fi-tilde{color:var(--text-tertiary);font-size:13px;flex-shrink:0}
  /* 百分比后缀 */
  .fi-suffix{display:flex;align-items:center;gap:4px;flex:1 1 0;min-width:0}
  .fi-suffix .fi-ctl{max-width:none;text-align:center}
  .fi-suffix .unit{font-size:13px;color:var(--text-secondary);flex-shrink:0}
  /* 比较符下拉（档案完整度） */
  .fi-select.fi-op{flex:0 0 76px;max-width:76px}
  /* 只看个人管理档案 */
  .filter-check{align-items:center;gap:6px;font-size:14px;color:var(--text-secondary);white-space:nowrap;justify-self:start;user-select:none;cursor:pointer}
  .filter-check input{width:14px;height:14px;margin:0;accent-color:var(--primary);cursor:pointer}
  /* 行尾按钮区：固定落在第 5 列（即最后一个条件行行尾） */
  .filter-btns{grid-column:5;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-left:8px}
  .btn-plain{height:28px;padding:0 6px;font-size:13px;color:var(--primary);border-radius:var(--r-sm);white-space:nowrap}
  .btn-plain:hover{background:var(--primary-bg)}

  /* ===== 筛选区复合控件：多选下拉 / 级联 / 树形 / 项目弹框 ===== */
  .filter-item{position:relative}
  /* 打开下拉的条件项抬升层级，保证浮层覆盖相邻条件项 */
  .filter-item.z-on{z-index:70}
  .ms{position:relative;flex:1 1 0;min-width:0;max-width:190px}
  .ms-box{display:flex;align-items:center;gap:6px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 8px 0 10px;font-size:14px;background:var(--bg-white);cursor:pointer;transition:all var(--transition-fast)}
  .ms-box:hover{border-color:var(--primary)}
  .ms.open .ms-box{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .ms-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
  .ms-text.is-placeholder{color:var(--text-placeholder)}
  .ms-clear{display:none;width:16px;height:16px;line-height:15px;text-align:center;border-radius:50%;background:#c9c9c9;color:#fff;font-size:12px;flex-shrink:0}
  .ms.has-val .ms-clear{display:block}
  .ms-clear:hover{background:#a9a9a9}
  .ms-panel{position:absolute;left:0;top:calc(100% + 4px);min-width:100%;max-height:238px;overflow:auto;padding:4px 0;background:#fff;border:1px solid #d9d9d9;border-radius:var(--r-sm);box-shadow:0 6px 16px rgba(0,0,0,0.14);display:none;z-index:80}
  .ms.open .ms-panel{display:block}
  .ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:14px;color:var(--text-primary);white-space:nowrap;cursor:pointer}
  .ms-opt:hover{background:var(--primary-bg)}
  .ms-opt input{width:14px;height:14px;margin:0;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
  .ms-opt.on{color:var(--primary)}
  /* 级联面板（管辖行政区：省 / 市 / 区 / 街道） */
  .cas{position:relative;flex:1 1 0;min-width:0;max-width:190px}
  .cas-panel{position:absolute;left:0;top:calc(100% + 4px);display:none;background:#fff;border:1px solid #d9d9d9;border-radius:var(--r-sm);box-shadow:0 6px 16px rgba(0,0,0,0.14);z-index:80}
  .cas.open .cas-panel{display:flex}
  .cas-col{width:150px;max-height:232px;overflow:auto;padding:4px 0;border-right:1px solid #F0F0F0}
  .cas-col:last-child{border-right:none}
  .cas-n,.tree-n{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:14px;color:var(--text-primary);white-space:nowrap;cursor:pointer}
  .cas-n:hover,.tree-n:hover{background:var(--primary-bg)}
  .cas-n.on,.tree-n.on{background:var(--primary-bg);color:var(--primary)}
  .cas-n.sel,.tree-n.sel{color:var(--primary)}
  .cas-n input,.tree-n input{width:14px;height:14px;margin:0;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
  .cas-n .arrow{margin-left:auto;padding-left:8px;color:var(--text-placeholder);font-size:12px}
  /* 树形面板（管辖网格） */
  .tree{position:relative;flex:1 1 0;min-width:0;max-width:190px}
  .tree-panel{position:absolute;left:0;top:calc(100% + 4px);width:232px;max-height:250px;overflow:auto;padding:4px 0;background:#fff;border:1px solid #d9d9d9;border-radius:var(--r-sm);box-shadow:0 6px 16px rgba(0,0,0,0.14);display:none;z-index:80}
  .tree.open .tree-panel{display:block}
  .tree-n .tgl{width:12px;text-align:center;font-size:11px;color:var(--text-placeholder);flex-shrink:0}
  /* 项目弹框（封面内容 / 个档内容） */
  .proj-modal{width:560px;max-width:94vw}
  .proj-rows{display:flex;flex-direction:column;gap:12px;padding:6px 2px 10px}
  .proj-row{display:flex;align-items:center;gap:8px}
  .proj-row .fi-select{flex:1 1 0;min-width:0;max-width:none}
  .proj-row .fi-select.pj-op{flex:0 0 120px;max-width:120px}
  /* 条件组合形态（封面内容）：行首逻辑连接符 + 比较符 + 值输入；「个档内容」保持原形态 */
  .proj-row.combo .fi-select.pj-logic{flex:0 0 92px;max-width:92px}
  .proj-row.combo .fi-select.pj-op{flex:0 0 88px;max-width:88px}
  .proj-row.combo .fi-select.pj-cmp{flex:0 0 92px;max-width:92px}
  .proj-row.combo .pj-val{flex:1 1 0;min-width:0;max-width:none}
  .proj-row.combo:first-child .pj-logic{display:none}   /* 首行无前置连接符，字段左移对齐截图 */
  .proj-ico{width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;border:1px solid;background:#fff;font-size:14px;cursor:pointer;flex-shrink:0;user-select:none}
  .proj-ico.add{color:var(--primary);border-color:var(--primary)}
  .proj-ico.add:hover{background:var(--primary-bg)}
  .proj-ico.del{color:#ff4d4f;border-color:#ff4d4f}
  .proj-ico.del:hover{background:#fff1f0}
  .proj-ico.hide{visibility:hidden}

  /* ===== 数据表格 ===== */
  .table-wrap{flex:1;overflow:auto;min-height:0}

  /* 横向滚动时前 4 列冻结（序号/管理机构/姓名/证件号） */
  .list-tbl th:nth-child(-n+4),.list-tbl td:nth-child(-n+4){position:sticky}
  .list-tbl td:nth-child(-n+4){z-index:2;background:var(--bg-white)}
  .list-tbl th:nth-child(-n+4){z-index:6}
  .list-tbl th:nth-child(1),.list-tbl td:nth-child(1){left:0}
  .list-tbl th:nth-child(2),.list-tbl td:nth-child(2){left:44px}
  .list-tbl th:nth-child(3),.list-tbl td:nth-child(3){left:194px}
  .list-tbl th:nth-child(4),.list-tbl td:nth-child(4){left:270px}
  .list-tbl th:nth-child(4),.list-tbl td:nth-child(4){box-shadow:6px 0 8px -6px rgba(0,0,0,0.2)}
  /* 横向滚动时操作列（末列）冻结在右侧 */
  .list-tbl th:last-child,.list-tbl td:last-child{position:sticky;right:0}
  .list-tbl td:last-child{z-index:2;background:var(--bg-white)}
  .list-tbl th:last-child{z-index:6}
  .list-tbl th:last-child,.list-tbl td:last-child{box-shadow:-6px 0 8px -6px rgba(0,0,0,0.2)}
  .list-tbl tr.empty-row td:last-child{position:static;box-shadow:none}
  /* 操作列允许溢出，保证「更多」下拉菜单可正常展开 */
  .list-tbl tbody tr:not(.empty-row) td:last-child{overflow:visible}
  .list-tbl{width:100%;min-width:2302px;table-layout:fixed;border-collapse:collapse;font-size:13px}
  .list-tbl th{position:sticky;top:0;z-index:5;height:36px;padding:0 8px;background:#F5F6FA;color:var(--text-primary);font-weight:var(--font-weight-medium);text-align:left;white-space:nowrap;border-bottom:1px solid #E4E7ED}
  .list-tbl td{height:36px;padding:0 8px;border-bottom:1px solid #EEF0F4;color:var(--text-secondary);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-tbl tbody tr:hover td{background:var(--primary-bg)}
  .list-tbl th.center,.list-tbl td.center{text-align:center}
  .cell{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 重点人群徽标（绿色） */
  .crowd-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-right:4px;border-radius:4px;background:var(--success);color:#fff;font-size:12px;line-height:1;vertical-align:middle}
  .crowd-none{color:var(--text-tertiary)}

  /* 是否合格 */
  .qual-badge{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 8px;border-radius:4px;font-size:12px;line-height:1}
  .qual-badge.ok{background:var(--success-bg);color:var(--success);border:1px solid rgba(82,195,27,0.35)}
  .qual-badge.bad{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-border)}

  /* 状态圆点（居民状态/银行状态） */
  .st-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .st-dot.ok{background:var(--success)}
  .st-dot.warn{background:#FF9500}

  /* 操作列 */
  .op-link{color:var(--primary);cursor:pointer;font-size:13px}
  .op-link:hover{text-decoration:underline}
  .op-gap{display:inline-block;width:8px}
  .op-more{position:relative;display:inline-flex;align-items:center}
  .op-more .more-btn{display:inline-flex;align-items:center;gap:2px;color:var(--primary);cursor:pointer;font-size:13px}
  .op-more .more-btn:hover{text-decoration:underline}
  .op-more .more-btn svg{transition:transform var(--transition-fast)}
  .op-more.open .more-btn svg{transform:rotate(180deg)}
  .op-menu-global{position:fixed;left:-9999px;top:-9999px;min-width:112px;background:#fff;border:1px solid #d9d9d9;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,0.15);padding:4px 0;display:none;z-index:999999}
  .op-menu-global .mi{display:block;width:100%;text-align:left;padding:7px 14px;font-size:13px;color:var(--text-secondary);line-height:1.4;background:none;border:none;cursor:pointer;font-family:inherit}
  .op-menu-global .mi:hover{background:var(--primary-bg);color:var(--primary)}
  .op-menu-global .mi.danger{color:#ff4d4f}
  .op-menu-global .mi.danger:hover{color:#ff4d4f;background:#fff1f0}

  /* ===== 分页 ===== */
  .page-foot{display:flex;align-items:center;justify-content:flex-end;gap:12px;height:52px;padding:0 16px;flex-shrink:0;border-top:1px solid #E8E8E8;font-size:13px;color:var(--text-secondary)}
  .pg-total b{color:var(--primary);font-weight:var(--font-weight-medium)}
  .pg-size select{height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 22px 0 8px;font-size:13px;color:var(--text-secondary);background:#fff;outline:none;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 6px center;cursor:pointer}
  .pg-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{min-width:26px;height:26px;padding:0 6px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);font-size:13px;color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all var(--transition-fast)}
  .pg-btn:hover{border-color:var(--primary);color:var(--primary)}
  .pg-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;cursor:default}
  .pg-jump input{width:40px;height:26px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 6px;font-size:13px;text-align:center;color:var(--text-primary);outline:none}
  .pg-jump input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}

  /* ===== 新建个人档案弹框 ===== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--transition-normal)}
  .modal-overlay.show{opacity:1;pointer-events:auto}
  .modal{width:860px;max-width:92vw;background:var(--bg-white);border-radius:var(--r-md);box-shadow:0 8px 32px rgba(0,0,0,0.18);display:flex;flex-direction:column;overflow:hidden;transform:translateY(10px);transition:transform var(--transition-normal)}
  .modal-overlay.show .modal{transform:translateY(0)}
  .modal-head{height:48px;display:flex;align-items:center;padding:0 16px;flex-shrink:0}
  .modal-head h3{font-size:15px;font-weight:var(--font-weight-semibold);color:var(--primary)}
  .modal-close{margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);border-radius:var(--r-sm);font-size:16px}
  .modal-close:hover{background:var(--primary-bg);color:var(--primary)}
  .modal-body{padding:16px 16px 4px}
  .modal-cols{display:flex;gap:16px;align-items:flex-start}
  .modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:18px 20px 20px}

  /* 左侧表单 */
  .fm-form{width:316px;flex-shrink:0}
  .fm-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .fm-row label{width:88px;text-align:right;font-size:14px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .fm-row label i{color:var(--danger);font-style:normal;margin-right:2px}
  .fm-ctl-wrap{position:relative}
  .fm-ctl{width:220px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast)}
  .fm-ctl.has-cnt{padding-right:40px}
  .fm-select{width:220px;height:32px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:0 26px 0 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;transition:all var(--transition-fast);appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238c8c8c' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
  .fm-ctl:focus,.fm-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .fm-ctl::placeholder{color:var(--text-placeholder)}
  .cnt{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-placeholder);pointer-events:none}
  .fm-readcard{height:32px;padding:0 10px;border:1px solid var(--primary);color:var(--primary);background:var(--bg-white);border-radius:var(--r-sm);font-size:13px;white-space:nowrap;flex-shrink:0;transition:all var(--transition-fast)}
  .fm-readcard:hover{background:var(--primary-bg)}

  /* 右侧：证件号行 + 信息回显卡 */
  .pv-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
  .pv-side .fm-row{margin-bottom:0}
  .pv-side .fm-ctl-wrap{flex:1;min-width:0}
  .pv-side .fm-ctl{width:100%}

  /* 右侧信息回显卡 */
  .pv-card{flex:1;min-width:0;background:var(--primary-bg);border:1px dashed #9EC3F5;border-radius:var(--r-md);padding:22px 18px;display:grid;grid-template-columns:1fr 1fr;row-gap:26px;column-gap:12px;font-size:13px;min-height:210px;align-content:start}

  /* 联系地址整行铺底 */
  .fm-addr-row{margin:14px 0 0}
  .fm-addr-row .fm-ctl-wrap{flex:1;min-width:0}
  .fm-addr-row .fm-ctl{width:100%}

  /* ===== 居民状态管理弹框（两列 + 通栏文本域） ===== */
  .stat-form{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding:8px 4px 12px}
  .stat-row{display:flex;align-items:center;gap:8px;min-width:0}
  .stat-row-full{grid-column:1/-1}
  .stat-form .stat-label{width:96px;text-align:right;font-size:14px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .stat-form .stat-label i{color:var(--danger);font-style:normal;margin-right:2px}
  .stat-form .fm-ctl,.stat-form .fm-select{width:calc(100% - 104px);min-width:0}
  .stat-ctl-wrap{position:relative;width:calc(100% - 104px);min-width:0}
  .stat-form .stat-ctl-wrap .fm-ctl{width:100%;padding-right:30px}
  .stat-ctl-wrap .cal-ico{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-placeholder);cursor:pointer;border-radius:var(--r-sm)}
  .stat-ctl-wrap .cal-ico:hover{color:var(--primary);background:var(--primary-bg)}
  .stat-radio{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;color:var(--text-primary);margin-right:18px}
  .stat-radio input{display:none}
  .stat-radio .rbox{width:16px;height:16px;border:1px solid var(--color-neutral-400);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;transition:border-color var(--transition-fast)}
  .stat-radio .rbox::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);transform:scale(0);transition:transform var(--transition-fast)}
  .stat-radio input:checked + .rbox{border-color:var(--primary)}
  .stat-radio input:checked + .rbox::after{transform:scale(1)}
  .stat-radio input:checked ~ .txt{color:var(--primary)}
  .stat-remark-wrap{position:relative;width:calc(100% - 104px);min-width:0}
  .stat-remark-wrap .stat-ta{width:100%;height:84px;border:1px solid var(--color-neutral-300);border-radius:var(--r-sm);padding:8px 10px;font-size:14px;color:var(--text-primary);background:var(--bg-white);outline:none;resize:vertical;min-height:84px;box-sizing:border-box;font-family:inherit;transition:all var(--transition-fast)}
  .stat-remark-wrap .stat-ta:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(0,122,255,0.15)}
  .stat-cnt{position:absolute;right:8px;bottom:6px;font-size:12px;color:var(--text-placeholder);pointer-events:none}
  .pv-row{display:flex;min-width:0}
  .pv-row.wide{grid-column:1 / -1}
  .pv-label{color:var(--text-secondary);white-space:nowrap;flex-shrink:0}
  .pv-val{color:var(--primary);word-break:break-all}

</style>
</head>
<body>

<!-- ===== 主内容区（顶部导航栏与左侧菜单栏由 框架.js 注入） ===== -->
<div class="main-area">

  <!-- 页面标签条（嵌入模式下隐藏，由壳子统一管理） -->
  <div class="tabbar">
    <div class="tab-item dashboard active" onclick="toast('当前已在「居民档案」页','info')">
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      居民档案
    </div>
  </div>

  <div class="content">
    <div class="content-card">

      <!-- 页头 -->
      <div class="page-head">
        <h1>居民档案</h1>
        <div class="right">
          <button class="btn btn-default" onclick="toast('导出功能建设中','info')">导出</button>
          <button class="btn btn-default" onclick="toast('明细导出功能建设中','info')">明细导出</button>
          <button class="btn btn-default" onclick="toast('请连接身份证读卡器','info')">身份证读卡</button>
          <button class="btn btn-primary" onclick="goCreateResident()">新建</button>
        </div>
      </div>

      <!-- 筛选区 -->
      <div class="filter-panel">
        <div class="filter-grid" id="filterGrid">

          <!-- ===== 常显条件（收起状态 2 行 × 4 列） ===== -->
          <div class="filter-item">
            <label>管理机构：</label>
            <div class="ms" id="msOrg">
              <div class="ms-box" onclick="toggleMs('msOrg',event)">
                <span class="ms-text is-placeholder">请选择</span>
                <span class="ms-clear" title="清空" onclick="clearMs('msOrg',event)">×</span>
              </div>
              <div class="ms-panel">
                <label class="ms-opt"><input type="checkbox" value="**大学淮河医院"><span>**大学淮河医院</span></label>
                <label class="ms-opt"><input type="checkbox" value="温江区华西医院"><span>温江区华西医院</span></label>
                <label class="ms-opt"><input type="checkbox" value="成都市新都区妇幼保健院"><span>成都市新都区妇幼保健院</span></label>
                <label class="ms-opt"><input type="checkbox" value="江都区大桥镇"><span>江都区大桥镇</span></label>
                <label class="ms-opt"><input type="checkbox" value="山东大学齐鲁医院"><span>山东大学齐鲁医院</span></label>
              </div>
              <input type="hidden" class="ms-val" id="fOrg">
            </div>
          </div>
          <div class="filter-item"><label>姓名：</label><input id="fName" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item"><label>证件号：</label><input id="fIdcard" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item">
            <label>管辖行政区：</label>
            <div class="cas" id="casRegion">
              <div class="ms-box" onclick="toggleCas('casRegion',event)">
                <span class="ms-text is-placeholder">请选择</span>
                <span class="ms-clear" title="清空" onclick="clearCas(event)">×</span>
              </div>
              <div class="cas-panel" id="casPanel"></div>
              <input type="hidden" class="ms-val" id="fRegion">
            </div>
          </div>

          <div class="filter-item">
            <label>居民状态：</label>
            <select id="fStatus" class="fi-select">
              <option value="正常" selected>正常</option>
              <option value="">全部</option>
              <option>死亡</option>
              <option>迁出</option>
              <option>注销</option>
            </select>
          </div>
          <div class="filter-item">
            <label>管辖网格：</label>
            <div class="tree" id="treeGrid">
              <div class="ms-box" onclick="toggleTree('treeGrid',event)">
                <span class="ms-text is-placeholder">请选择</span>
                <span class="ms-clear" title="清空" onclick="clearTree(event)">×</span>
              </div>
              <div class="tree-panel" id="treePanel"></div>
              <input type="hidden" class="ms-val" id="fGrid">
            </div>
          </div>
          <div class="filter-item">
            <label>重点人群类型：</label>
            <select id="fCrowdOp" class="fi-select fi-op">
              <option value="and" selected>且</option>
              <option value="or">或</option>
            </select>
            <div class="ms" id="msCrowd">
              <div class="ms-box" onclick="toggleMs('msCrowd',event)">
                <span class="ms-text is-placeholder">请选择</span>
                <span class="ms-clear" title="清空" onclick="clearMs('msCrowd',event)">×</span>
              </div>
              <div class="ms-panel">
                <label class="ms-opt"><input type="checkbox" value="高"><span>高血压</span></label>
                <label class="ms-opt"><input type="checkbox" value="糖"><span>糖尿病</span></label>
                <label class="ms-opt"><input type="checkbox" value="慢"><span>慢阻肺</span></label>
                <label class="ms-opt"><input type="checkbox" value="老"><span>老年人</span></label>
                <label class="ms-opt"><input type="checkbox" value="肺"><span>肺结核</span></label>
                <label class="ms-opt"><input type="checkbox" value="精"><span>严重精神障碍</span></label>
                <label class="ms-opt"><input type="checkbox" value="脑"><span>脑卒中</span></label>
                <label class="ms-opt"><input type="checkbox" value="冠"><span>冠心病</span></label>
              </div>
              <input type="hidden" class="ms-val" id="fCrowd">
            </div>
          </div>
          <div class="filter-item">
            <label>封面内容：</label>
            <div class="ms" id="msCover">
              <div class="ms-box" onclick="openProj('cover',event)">
                <span class="ms-text is-placeholder">请选择</span>
              </div>
              <input type="hidden" class="ms-val" id="fCover">
            </div>
          </div>

          <!-- ===== 展开后追加条件（4 行 × 4 列） ===== -->
          <div class="filter-item extra">
            <label>个档内容：</label>
            <div class="ms" id="msArch">
              <div class="ms-box" onclick="openProj('arch',event)">
                <span class="ms-text is-placeholder">请选择</span>
              </div>
              <input type="hidden" class="ms-val" id="fArchContent">
            </div>
          </div>
          <div class="filter-item extra">
            <label>性别：</label>
            <select id="fGender" class="fi-select">
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>
          <div class="filter-item extra">
            <label>档案完整度：</label>
            <select id="fCompleteOp" class="fi-select fi-op">
              <option value="">请选择</option>
              <option value="gt">大于</option>
              <option value="lt">小于</option>
              <option value="eq">等于</option>
            </select>
            <span class="fi-suffix"><input id="fCompleteVal" class="fi-ctl" placeholder="请输入"><span class="unit">%</span></span>
          </div>
          <div class="filter-item extra">
            <label>人群性质：</label>
            <select id="fNatureOp" class="fi-select fi-op">
              <option value="and" selected>且</option>
              <option value="or">或</option>
            </select>
            <select id="fNature" class="fi-select">
              <option value="">请选择</option>
              <option value="普通人群">普通人群</option>
              <option value="农村建档立卡贫困人口">农村建档立卡贫困人口</option>
              <option value="城乡低保五保人口">城乡低保五保人口</option>
              <option value="计划生育特殊家庭人口">计划生育特殊家庭人口</option>
              <option value="失能(失智)老年人">失能(失智)老年人</option>
              <option value="残疾人">残疾人</option>
              <option value="0-6岁儿童">0-6岁儿童</option>
              <option value="高血压患者">高血压患者</option>
            </select>
          </div>

          <div class="filter-item extra">
            <label>锁定状态：</label>
            <select id="fLock" class="fi-select">
              <option value="">请选择</option>
              <option>已锁定</option>
              <option>未锁定</option>
            </select>
          </div>
          <div class="filter-item extra"><label>责任医生：</label><input id="fDoctor" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item extra">
            <label>建档机构：</label>
            <div class="ms" id="msBuildOrg">
              <div class="ms-box" onclick="toggleMs('msBuildOrg',event)">
                <span class="ms-text is-placeholder">请选择</span>
                <span class="ms-clear" title="清空" onclick="clearMs('msBuildOrg',event)">×</span>
              </div>
              <div class="ms-panel">
                <label class="ms-opt"><input type="checkbox" value="**大学淮河医院"><span>**大学淮河医院</span></label>
                <label class="ms-opt"><input type="checkbox" value="温江区华西医院"><span>温江区华西医院</span></label>
                <label class="ms-opt"><input type="checkbox" value="成都市新都区妇幼保健院"><span>成都市新都区妇幼保健院</span></label>
                <label class="ms-opt"><input type="checkbox" value="江都区大桥镇"><span>江都区大桥镇</span></label>
                <label class="ms-opt"><input type="checkbox" value="山东大学齐鲁医院"><span>山东大学齐鲁医院</span></label>
              </div>
              <input type="hidden" class="ms-val" id="fBuildOrg">
            </div>
          </div>
          <div class="filter-item extra"><label>建档医生：</label><input id="fBuildDoctor" class="fi-ctl" placeholder="请输入"></div>

          <div class="filter-item extra">
            <label>建档日期：</label>
            <span class="fi-range">
              <input id="fCreateStart" class="fi-ctl" type="text" placeholder="开始日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
              <span class="fi-tilde">~</span>
              <input id="fCreateEnd" class="fi-ctl" type="text" placeholder="结束日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
            </span>
          </div>
          <div class="filter-item extra">
            <label>状态变更日期：</label>
            <span class="fi-range">
              <input id="fChangeStart" class="fi-ctl" type="text" placeholder="开始日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
              <span class="fi-tilde">~</span>
              <input id="fChangeEnd" class="fi-ctl" type="text" placeholder="结束日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
            </span>
          </div>
          <div class="filter-item extra"><label>档案编号：</label><input id="fArchNo" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item extra">
            <label>是否合格：</label>
            <select id="fQual" class="fi-select">
              <option value="">请选择</option>
              <option value="1">合格</option>
              <option value="0">不合格</option>
            </select>
          </div>

          <div class="filter-item extra">
            <label>出生日期：</label>
            <span class="fi-range">
              <input id="fBirthStart" class="fi-ctl" type="text" placeholder="开始日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
              <span class="fi-tilde">~</span>
              <input id="fBirthEnd" class="fi-ctl" type="text" placeholder="结束日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
            </span>
          </div>
          <div class="filter-item extra"><label>更新医生：</label><input id="fUpdateDoctor" class="fi-ctl" placeholder="请输入"></div>
          <div class="filter-item extra">
            <label>更新日期：</label>
            <span class="fi-range">
              <input id="fUpdateStart" class="fi-ctl" type="text" placeholder="开始日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
              <span class="fi-tilde">~</span>
              <input id="fUpdateEnd" class="fi-ctl" type="text" placeholder="结束日期" onfocus="if(this.type==='text')this.type='date'" onblur="if(!this.value)this.type='text'">
            </span>
          </div>
          <label class="filter-check extra"><input type="checkbox" id="fOnlySelf">只看个人管理档案</label>

          <!-- 行尾按钮区（与最后一个条件行同行） -->
          <div class="filter-btns">
            <button class="btn btn-default" onclick="resetFilter()">重置</button>
            <button class="btn btn-primary" onclick="applyFilter()">查询</button>
            <button class="btn-plain" id="btnExpand" onclick="toggleExtra()">展开 ▾</button>
          </div>
        </div>
      </div>

      <!-- 数据表格 -->
      <div class="table-wrap">
        <table class="list-tbl">
          <colgroup>
            <col style="width:44px"><col style="width:150px"><col style="width:76px"><col style="width:148px"><col style="width:82px"><col style="width:44px"><col style="width:44px"><col style="width:104px"><col style="width:84px"><col style="width:88px"><col style="width:68px"><col style="width:110px"><col style="width:132px"><col style="width:110px"><col style="width:56px"><col style="width:72px"><col style="width:72px"><col style="width:88px"><col style="width:160px"><col style="width:88px"><col style="width:140px"><col style="width:72px"><col style="width:72px"><col style="width:130px">
          </colgroup>
          <thead>
            <tr>
              <th class="center">序号</th>
              <th>管理机构</th>
              <th>姓名</th>
              <th>证件号</th>
              <th>证件类型</th>
              <th class="center">性别</th>
              <th class="center">年龄</th>
              <th>电话号码</th>
              <th>出生日期</th>
              <th class="center">重点人群类型</th>
              <th class="center">是否合格</th>
              <th>现居住址</th>
              <th>档案编号</th>
              <th>管理行政区</th>
              <th class="center">行政区</th>
              <th>责任医生</th>
              <th>建档医生</th>
              <th>建档日期</th>
              <th>建档机构</th>
              <th class="center">档案完整度(%)</th>
              <th>人群性质</th>
              <th>居民状态</th>
              <th>银行状态</th>
              <th class="center">操作</th>
            </tr>
          </thead>
          <tbody id="tbBody"></tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="page-foot">
        <span class="pg-total">共 <b id="pgTotal">20</b> 条</span>
        <span class="pg-size">
          <select onchange="toast('原型演示：每页条数固定 20 条','info')">
            <option selected>20条/页</option>
            <option>50条/页</option>
            <option>100条/页</option>
          </select>
        </span>
        <span class="pg-pager">
          <button class="pg-btn" onclick="toast('已是第一页','info')">‹</button>
          <button class="pg-btn active">1</button>
          <button class="pg-btn" onclick="toast('仅 1 页','info')">›</button>
        </span>
        <span class="pg-jump">前往 <input id="pgJump" value="1" onkeydown="if(event.key==='Enter'){toast('仅 1 页','info')}"> 页</span>
      </div>

    </div>
  </div>
</div>

<!-- ===== 新建个人档案弹框 ===== -->
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-head">
      <h3>新建个人档案</h3>
      <span class="modal-close" onclick="closeCreateModal()">×</span>
    </div>
    <div class="modal-body">
      <div class="modal-cols">
        <!-- 左侧表单 -->
        <div class="fm-form">
          <div class="fm-row">
            <label><i>*</i>证件类型：</label>
            <select id="cmIdType" class="fm-select">
              <option value="居民身份证" selected>居民身份证</option>
              <option value="居民户口簿">居民户口簿</option>
              <option value="护照">护照</option>
              <option value="港澳居民来往内地通行证">港澳居民来往内地通行证</option>
              <option value="台湾居民来往大陆通行证">台湾居民来往大陆通行证</option>
            </select>
          </div>
          <div class="fm-row">
            <label><i>*</i>姓名：</label>
            <div class="fm-ctl-wrap">
              <input id="cmName" class="fm-ctl has-cnt" maxlength="8" placeholder="请输入">
              <span class="cnt" id="cntName">0/8</span>
            </div>
          </div>
          <div class="fm-row">
            <label><i>*</i>性别：</label>
            <select id="cmGender" class="fm-select">
              <option value="" selected>请选择</option>
              <option value="男性">男性</option>
              <option value="女性">女性</option>
            </select>
          </div>
          <div class="fm-row">
            <label><i>*</i>民族：</label>
            <select id="cmNation" class="fm-select">
              <option value="汉族" selected>汉族</option>
              <option value="蒙古族">蒙古族</option>
              <option value="回族">回族</option>
              <option value="藏族">藏族</option>
              <option value="维吾尔族">维吾尔族</option>
              <option value="苗族">苗族</option>
              <option value="彝族">彝族</option>
              <option value="壮族">壮族</option>
              <option value="满族">满族</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="fm-row">
            <label><i>*</i>联系电话：</label>
            <input id="cmPhone" class="fm-ctl" maxlength="11" placeholder="请输入联系电话">
          </div>
          <div class="fm-row">
            <label><i>*</i>出生日期：</label>
            <input id="cmBirth" class="fm-ctl" type="text" placeholder="请选择日期"
                   onfocus="this.type='date';try{this.showPicker()}catch(e){}"
                   onblur="if(!this.value){this.type='text'}">
          </div>
        </div>
        <!-- 右侧：证件号 + 信息回显卡 -->
        <div class="pv-side">
          <div class="fm-row">
            <label><i>*</i>证件号：</label>
            <div class="fm-ctl-wrap">
              <input id="cmIdcard" class="fm-ctl has-cnt" maxlength="18" placeholder="请输入证件号">
              <span class="cnt" id="cntIdcard">0/18</span>
            </div>
            <button class="fm-readcard" onclick="toast('请连接身份证读卡器','info')">身份证读卡</button>
          </div>
          <div class="pv-card" id="pvCard"></div>
        </div>
      </div>
      <!-- 联系地址：整行铺底 -->
      <div class="fm-row fm-addr-row">
        <label><i>*</i>联系地址：</label>
        <select id="cmRegion" class="fm-select" style="width:186px">
          <option value="" selected>请选择现住址</option>
          <option value="江苏省扬州市江都区">江苏省 / 扬州市 / 江都区</option>
          <option value="江苏省扬州市邗江区">江苏省 / 扬州市 / 邗江区</option>
          <option value="江苏省南京市玄武区">江苏省 / 南京市 / 玄武区</option>
          <option value="江苏省苏州市姑苏区">江苏省 / 苏州市 / 姑苏区</option>
          <option value="山东省济南市历下区">山东省 / 济南市 / 历下区</option>
          <option value="山东省济南市市中区">山东省 / 济南市 / 市中区</option>

  /* ================= 工具函数 ================= */
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function $(id) { return document.getElementById(id); }

  /* ================= 表格渲染（按筛选条件实时过滤） ================= */
  var DOCTORS = ['冯仁卉', '李蕾', '朱劲松', '敖鹏天', '陆柳琳', '王盛'];
  function docOf(r) { return DOCTORS[residentData.indexOf(r) % DOCTORS.length]; }
  function zoneOf(r) { return r.address.indexOf('村') !== -1 ? '村' : '社区'; }
  function completeOf(r) { return r.qualified ? 100 : 0; }

  function renderTable() {
    var orgs = splitVal($('fOrg').value), name = $('fName').value.trim();
    var idcard = $('fIdcard').value.trim(), region = $('fRegion').value;
    var status = $('fStatus').value, grids = splitVal($('fGrid').value);
    var crowds = splitVal($('fCrowd').value), crowdOp = $('fCrowdOp').value;
    var nature = $('fNature').value;
    var gender = $('fGender').value;
    var compOp = $('fCompleteOp').value, compVal = parseFloat($('fCompleteVal').value);
    var buildOrgs = splitVal($('fBuildOrg').value);
    var doctor = $('fDoctor').value.trim(), buildDoctor = $('fBuildDoctor').value.trim();
    var createStart = $('fCreateStart').value, createEnd = $('fCreateEnd').value;
    var archNo = $('fArchNo').value.trim(), qual = $('fQual').value;
    var birthStart = $('fBirthStart').value, birthEnd = $('fBirthEnd').value;

    var list = residentData.filter(function (r) {
      if (orgs.length && orgs.indexOf(r.org) === -1) return false;
      if (name && r.name.indexOf(name) === -1) return false;
      if (idcard && r.idcard.indexOf(idcard) === -1) return false;
      if (region && r.region.indexOf(region) === -1) return false;
      if (status && r.status !== status) return false;
      if (grids.length && !grids.some(function (g) { return r.address.indexOf(g) !== -1; })) return false;
      if (crowds.length) {
        var hit = crowds.filter(function (c) { return r.crowd.indexOf(c) !== -1; });
        if (crowdOp === 'or' ? !hit.length : hit.length !== crowds.length) return false;
      }
      if (nature) {
        if (nature === '普通人群') { if (r.crowd.length) return false; }
        else if (nature === '高血压患者') { if (r.crowd.indexOf('高') === -1) return false; }
        else if (nature === '0-6岁儿童') { if (r.crowd.indexOf('儿') === -1) return false; }
      }
      if (gender && r.gender !== gender) return false;
      if (compOp && !isNaN(compVal)) {
        var c = completeOf(r);
        if (compOp === 'gt' && !(c > compVal)) return false;
        if (compOp === 'lt' && !(c < compVal)) return false;
        if (compOp === 'eq' && c !== compVal) return false;
      }
      if (buildOrgs.length && buildOrgs.indexOf(r.org) === -1) return false;
      if (doctor && docOf(r).indexOf(doctor) === -1) return false;
      if (buildDoctor && docOf(r).indexOf(buildDoctor) === -1) return false;
      if (createStart && r.created < createStart) return false;
      if (createEnd && r.created > createEnd) return false;
      if (archNo && r.archNo.indexOf(archNo) === -1) return false;
      if (qual === '1' && !r.qualified) return false;
      if (qual === '0' && r.qualified) return false;
      if (birthStart && r.birth < birthStart) return false;
      if (birthEnd && r.birth > birthEnd) return false;
      return true;
    });

    var html = '';
    if (list.length === 0) {
      html = '<tr class="empty-row"><td colspan="24"><div class="ico">📭</div>暂无符合条件的居民档案</td></tr>';
    } else {
      var groupMap = { '老': '65岁及以上老年人', '高': '高血压患者', '糖': '2型糖尿病患者', '儿': '0-6岁儿童' };
      list.forEach(function (r, i) {
        var srcIdx = residentData.indexOf(r);
        var crowdHtml = r.crowd.length
          ? r.crowd.map(function (c) { return '<span class="crowd-badge">' + esc(c) + '</span>'; }).join('')
          : '<span class="crowd-none">-</span>';
        var qualHtml = r.qualified
          ? '<span class="qual-badge ok">合格</span>'
          : '<span class="qual-badge bad">不合格</span>';
        var zone = zoneOf(r);
        var doc = docOf(r);
        var crowdTxt = r.crowd.length
          ? r.crowd.map(function (c) { return groupMap[c] || c; }).join('/')
          : '';
        html += '<tr>'
          + '<td class="center">' + (i + 1) + '</td>'
          + '<td title="' + esc(r.org) + '"><span class="cell">' + esc(r.org) + '</span></td>'
          + '<td><a class="op-link" onclick="toast(\'查看居民档案：' + esc(r.name) + '\',\'info\')">' + esc(r.name) + '</a></td>'
          + '<td title="' + esc(r.idcard) + '"><span class="cell">' + esc(r.idcard) + '</span></td>'
          + '<td>' + esc(r.idType) + '</td>'
          + '<td class="center">' + esc(r.gender) + '</td>'
          + '<td class="center">' + r.age + '</td>'
          + '<td title="' + esc(r.phone) + '"><span class="cell">' + esc(r.phone) + '</span></td>'
          + '<td>' + esc(r.birth) + '</td>'
          + '<td class="center">' + crowdHtml + '</td>'
          + '<td class="center">' + qualHtml + '</td>'
          + '<td title="' + esc(r.address) + '"><span class="cell">' + esc(r.address) + '</span></td>'
          + '<td title="' + esc(r.archNo) + '"><span class="cell">' + esc(r.archNo) + '</span></td>'
          + '<td>' + esc(r.region) + '</td>'
          + '<td class="center">' + esc(zone) + '</td>'
          + '<td>' + esc(doc) + '</td>'
          + '<td>' + esc(doc) + '</td>'
          + '<td>' + esc(r.created) + '</td>'
          + '<td title="' + esc(r.org) + '"><span class="cell">' + esc(r.org) + '</span></td>'
          + '<td class="center">' + (r.qualified ? 100 : 0) + '</td>'
          + '<td title="' + esc(crowdTxt) + '"><span class="cell">' + esc(crowdTxt) + '</span></td>'
          + '<td><span class="st-dot ok"></span>' + esc(r.status) + '</td>'
          + '<td><span class="st-dot warn"></span>未上传</td>'
          + '<td class="center">'
          +   '<a class="op-link" onclick="openArchive(' + srcIdx + ')">查看</a>'
          +   '<span class="op-gap"></span>'
          +   '<a class="op-link" onclick="openArchive(' + srcIdx + ')">编辑</a>'
          +   '<span class="op-gap"></span>'
          +   '<span class="op-more">'
              +     '<a class="more-btn" onclick="showOpMenu(this,event,\'' + esc(r.name) + '\')">更多<svg viewBox="0 0 24 24" style="width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="6 9 12 15 18 9"/></svg></a>'
              +   '</span>'
          + '</td>'
          + '</tr>';
      });
    }
    $('tbBody').innerHTML = html;
    $('pgTotal').textContent = list.length;
  }

  /* ================= 交互 ================= */
  /* 下拉未选择时按占位灰展示 */
  function syncPh(sel) { sel.classList.toggle('is-placeholder', !sel.value); }
  function syncAllPh() {
    document.querySelectorAll('.filter-grid .fi-select').forEach(syncPh);
  }
  function splitVal(v) { return v ? String(v).split(',').filter(Boolean) : []; }

  /* ===== 多选下拉（管理机构 / 重点人群类型 / 建档机构） ===== */
  var MS_IDS = ['msOrg', 'msCrowd', 'msBuildOrg'];
  function msValues(id) {
    return Array.prototype.slice.call($(id).querySelectorAll('.ms-opt input:checked'))
      .map(function (i) { return i.value; });
  }
  function refreshMs(id) {
    var box = $(id), val = msValues(id);
    box.querySelectorAll('.ms-opt').forEach(function (o) {
      o.classList.toggle('on', o.querySelector('input').checked);

  var casDrill = [], casSelPath = [];   /* 下钻路径 / 已选路径 */
  function casChildNames(path) {
    var node = REGION_TREE;
    for (var i = 0; i < path.length; i++) { node = node ? node[path[i]] : null; }
    if (Array.isArray(node)) return node;                 /* 街道层：值即名称数组 */
    return node ? Object.keys(node) : [];

  function casColHtml(level, names) {
    var parents = casDrill.slice(0, level), active = casDrill[level], selKey = casSelPath.join('/');
    return '<div class="cas-col">' + names.map(function (n) {
      var path = parents.concat([n]), key = path.join('/');
      return '<div class="cas-n' + (n === active ? ' on' : '') + (key === selKey ? ' sel' : '') + '"'
        + ' onclick="casClick(event,' + level + ',\'' + n + '\')">'
        + '<input type="checkbox"' + (key === selKey ? ' checked' : '') + ' onclick="casCheck(event,' + level + ',\'' + n + '\')">'

  function renderCas() {

     按需整体左移，保证第四级（街道）在可视范围内可选 */
  function positionCasPanel() {
    var box = $('casRegion'), panel = $('casPanel');
    if (!box.classList.contains('open')) return;   /* 关闭态 offsetWidth 为 0，不参与计算 */
    var card = box.closest('.content-card') || document.documentElement;
    var cr = card.getBoundingClientRect(), br = box.getBoundingClientRect();
    var maxRight = Math.min(cr.right, window.innerWidth) - 8;
    var minLeft = Math.max(cr.left, 0) + 8;
    var left = 0;
    if (br.left + panel.offsetWidth > maxRight) left -= (br.left + panel.offsetWidth - maxRight);
    if (br.left + left < minLeft) left = minLeft - br.left;
    panel.style.left = Math.round(left) + 'px';
  }
  function casClick(ev, level, name) {

    if (ev) ev.stopPropagation();
    var path = casDrill.slice(0, level).concat([name]);
    if (casChildNames(path).length) { casDrill = path; }   /* 有下级：仅下钻，面板保持展开 */
    else { casSelPath = path; }                            /* 末级：选中，面板不关闭 */
    renderCas();
    renderTable();

  function treeRow(name, depth, hasKids, expanded) {

    return '<div class="tree-n" style="padding-left:' + (6 + depth * 18) + 'px" onclick="' + click + '">'
      + '<span class="tgl">' + (hasKids ? (expanded ? '▾' : '▸') : '') + '</span>'

  function renderTree() {

    var birth = $('cmBirth'); birth.type = 'text'; birth.value = '';
    $('cmRegion').value = '';
    $('cmAddr').value = ''; $('cntAddr').textContent = '0/50';
    renderPreviewEmpty();
    $('createModal').classList.add('show');
  }

  function closeCreateModal() {
    $('createModal').classList.remove('show');
  }

  /* 证件号满 18 位：自动解析出生日期与性别（身份证第 7-14 位出生段、第 17 位奇偶判性别） */
  function parseIdcard() {
    var v = $('cmIdcard').value.trim();
    if (!/^\d{17}[\dXx]$/.test(v)) return;
    $('cmBirth').value = v.slice(6, 10) + '-' + v.slice(10, 12) + '-' + v.slice(12, 14);
    $('cmGender').value = (parseInt(v[16], 10) % 2 === 1) ? '男性' : '女性';
    toast('已根据证件号自动填充出生日期与性别', 'success');
  }

  function submitCreate() {
    var missing = [];
    if (!$('cmIdType').value) missing.push('证件类型');
    var idcard = $('cmIdcard').value.trim();
    if (!idcard) missing.push('证件号');
    else if (!/^\d{17}[\dXx]$/.test(idcard)) { toast('证件号格式不正确，需为 18 位', 'warning'); return; }
    if (!$('cmName').value.trim()) missing.push('姓名');
    if (!$('cmGender').value) missing.push('性别');
    if (!$('cmNation').value) missing.push('民族');
    if (!$('cmPhone').value.trim()) missing.push('联系电话');
    if (!$('cmBirth').value) missing.push('出生日期');
    if (!$('cmRegion').value || !$('cmAddr').value.trim()) missing.push('联系地址');
    if (missing.length) { toast('请完善必填项：' + missing.join('、'), 'warning'); return; }
    closeCreateModal();
    /* 校验通过：携带弹框信息进入档案维护界面（封面 → 个人基本信息表） */
    var p = new URLSearchParams();
    p.set('name', $('cmName').value.trim());
    p.set('gender', $('cmGender').value);
    p.set('idType', $('cmIdType').value);
    p.set('idcard', $('cmIdcard').value.trim());
    p.set('birth', $('cmBirth').value);
    p.set('phone', $('cmPhone').value.trim());
    p.set('nation', $('cmNation').value);
    p.set('region', $('cmRegion').value);
    p.set('addr', $('cmAddr').value.trim());
    window.open('档案维护.html?' + p.toString(), '_blank');
    toast('档案信息校验通过，已在新窗口打开档案维护界面', 'success');
  }

  /* 弹框联动事件 */
  $('cmIdType').addEventListener('change', renderPreview);
  $('cmGender').addEventListener('change', renderPreview);
  $('cmNation').addEventListener('change', renderPreview);
  $('cmBirth').addEventListener('change', renderPreview);
  $('cmRegion').addEventListener('change', renderPreview);
  $('cmIdcard').addEventListener('input', function () {
    $('cntIdcard').textContent = this.value.length + '/18';
    if (this.value.length === 18) parseIdcard();
    renderPreview();
  });
  $('cmName').addEventListener('input', function () {
    $('cntName').textContent = this.value.length + '/8';
    renderPreview();
  });
  $('cmAddr').addEventListener('input', function () {
    $('cntAddr').textContent = this.value.length + '/50';
    renderPreview();
  });

  /* 状态管理：变更说明字符计数 */
  $('stRemark').addEventListener('input', function () {
    $('cntRemark').textContent = this.value.length + '/200';
  });

  /* 初始渲染 */
  syncAllPh();
  MS_IDS.forEach(refreshMs);
  renderCas();
  renderTree();
  renderTable();
</script>

<!-- 更多操作全局浮层 -->
<div id="opMenu" class="op-menu-global"></div>

</body>
</html>
