<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8">
<style>html,body{margin:0;height:100%;background:#fff}#f{width:1600px;height:900px;border:0}#info{position:fixed;left:0;top:0;z-index:99;background:#ffe94d;color:#000;font:bold 18px/1.5 Consolas,monospace;padding:4px 10px;max-width:1600px;white-space:pre-wrap}</style>
</head>
<body>
<div id="info">loading...</div>
<iframe id="f"></iframe>
<script>
var base = 'file:///D:/AI_Project/Public-Health-Service-System/Public-Health-Service-System/';
var dir = base + ['01-公共卫生服务系统产品文档','V1.0','02.需求设计','原型设计'].map(encodeURIComponent).join('/') + '/';
var f = document.getElementById('f');
f.src = dir + 'index.html';
f.onload = function () {
  try {
    var w = f.contentWindow;
    w.shellOpen('cervical-cancer-screening');
    setTimeout(function () {
      var doc = w.document;
      var out = [];
      // 1. 三级菜单渲染
      var owners = doc.querySelectorAll('.sub-item.has-children');
      out.push('has-children=' + owners.length + ':' + owners[0] && owners[0].textContent.trim());
      var sub2 = doc.querySelectorAll('.menu-sub.sub2');
      var sub2Items = [];
      sub2.forEach(function (s) {
        s.querySelectorAll('.sub-item').forEach(function (i) { sub2Items.push(i.textContent.trim() + (i.classList.contains('active') ? '*' : '')); });
      });
      out.push('sub2-open=' + sub2[0] && sub2[0].classList.contains('open'));
      out.push('sub2-items=' + sub2Items.join('|'));
      // 2. 页面 iframe 装载
      var frames = doc.querySelectorAll('iframe.shell-frame');
      out.push('frames=' + frames.length);
      var page = frames[frames.length - 1].contentDocument;
      out.push('h1=' + (page.querySelector('.page-head h1') || {}).textContent);
      out.push('cols=' + page.querySelectorAll('.list-tbl thead th').length);
      out.push('rows=' + page.querySelectorAll('#tbBody tr:not(.empty-row)').length);
      out.push('pager=' + page.getElementById('pgTotal').textContent);
      out.push('mirrors=' + Array.from(page.querySelectorAll('#tbBody .st-dot')).length);
      document.getElementById('info').textContent = 'OK\n' + out.join('\n');
    }, 1200);
  } catch (e) {
    document.getElementById('info').textContent = 'ERR ' + e.message;
  }
};
</script>
</body>
</html>
