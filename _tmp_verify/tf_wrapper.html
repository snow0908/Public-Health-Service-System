<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0}#diag{font:13px/1.6 Consolas;background:#FFFBE6;border:1px solid #F0D060;padding:4px 10px}iframe{width:1600px;height:1420px;border:0;display:block}</style>
</head>
<body>
<div id="diag">running...</div>
<iframe id="f" src="file:///D:/AI_Project/Public-Health-Service-System/Public-Health-Service-System/01-公共卫生服务系统产品文档/V1.0/02.需求设计/原型设计/档案维护.html?view=tumor&name=吴昊&archNo=321012010136301" onload="run()"></iframe>
<script>
function run(){
  try{
    var f=document.getElementById('f');
    var w=f.contentWindow, d=f.contentDocument;
    function V(id,v){var e=d.getElementById(id); if(e) e.value=v;}
    function R(name,v){var r=d.querySelector('input[name="'+name+'"][value="'+v+'"]'); if(r) r.checked=true;}
    function SI(id,i){var e=d.getElementById(id); if(e) e.selectedIndex=i;}
    V('tmMorphName','神经鞘瘤病'); SI('tmMorphCode',1);
    V('tmTopoName','回肠'); SI('tmTopoCode',1);
    SI('tmIcd10',1);
    V('tmDiagName','咽部恶性肿瘤');
    V('tmContact','李四'); V('tmContactTel','13859911212');
    R('tmClinical','0-I期');
    SI('tmGrad',1); SI('tmBasis',7);
    V('tmFirstDiagDate','2026-09-01'); V('tmDiagDate','2026-09-03');
    SI('tmFirstTreat',1);
    V('tmKps','90');
    SI('tmReportOrg',1); SI('tmReporter',1);
    V('tmReportDate','2026-09-05'); V('tmCreator','朱劲松');
    w.saveTumorArchive();
    var nav=d.getElementById('navTumorFollowup');
    var stillHidden=nav.classList.contains('nav-followup-hidden');
    w.switchView('tumorFollowup');
    V('tfHeight','170'); V('tfWeight','65'); w.tfCalcBmi();
    var rows=d.querySelectorAll('#tfKpsList .kps-row');
    w.pickTfKps(rows[1]);
    // 校验空保存提示（先清一个必填再触发）
    var bmi=d.getElementById('tfBmi').value;
    var sel=rows[1].classList.contains('selected');
    document.getElementById('diag').textContent='reveal-stillHidden='+stillHidden+' | navActive='+nav.classList.contains('active')+' | tfDate='+d.getElementById('tfDate').value+' | BMI='+bmi+' | kps90-selected='+sel+' | viewVisible='+!d.getElementById('viewTumorFollowup').classList.contains('hidden');
  }catch(e){document.getElementById('diag').textContent='ERR: '+e.message;}
}
</script>
</body>
</html>
